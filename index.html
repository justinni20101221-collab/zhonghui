<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   基础
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        #0b0d12;

    color: #fff;

    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =====================================================
   首页
===================================================== */

#homePage {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card {

    width: 100%;

    max-width: 460px;

    padding: 50px 38px;

    text-align: center;

    border-radius: 18px;

    background: #15171d;

    border:
        1px solid #252832;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.logo {

    width: 82px;

    height: 82px;

    margin:
        0 auto 25px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 22px;

    font-size: 38px;

    background:
        #5865f2;

    box-shadow:
        0 15px 35px
        rgba(88,101,242,.35);
}

.home-card h1 {

    font-size: 40px;

    margin-bottom: 12px;
}

.home-card p {

    color: #a6a8b0;

    line-height: 1.7;

    margin-bottom: 30px;
}

.primary-button {

    width: 100%;

    border: none;

    border-radius: 4px;

    padding: 14px 20px;

    color: white;

    font-weight: 700;

    background: #5865f2;

    transition: .2s;
}

.primary-button:hover {

    background: #4752c4;
}

.primary-button:disabled {

    opacity: .55;

    cursor: not-allowed;
}


/* =====================================================
   页面通用
===================================================== */

.page {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background: #0b0d12;
}

.auth-card {

    width: 100%;

    max-width: 430px;

    padding: 32px;

    border-radius: 8px;

    background: #15171d;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1 {

    text-align: center;

    font-size: 25px;

    margin-bottom: 8px;
}

.auth-subtitle {

    text-align: center;

    color: #a6a8b0;

    font-size: 14px;

    margin-bottom: 25px;
}

.form-group {

    margin-bottom: 18px;
}

.form-group label {

    display: block;

    font-size: 12px;

    font-weight: 700;

    color: #b5bac1;

    margin-bottom: 8px;

    text-transform: uppercase;
}

.form-input {

    width: 100%;

    border: none;

    outline: none;

    padding: 13px;

    border-radius: 4px;

    color: white;

    background: #0f1116;

    border:
        1px solid #252832;
}

.form-input:focus {

    border-color: #5865f2;
}

.auth-link {

    text-align: center;

    margin-top: 18px;

    font-size: 14px;

    color: #a6a8b0;
}

.auth-link button {

    border: none;

    background: none;

    color: #5865f2;

    font-weight: 600;
}

.auth-link button:hover {

    text-decoration: underline;
}

.auth-error {

    display: none;

    padding: 10px;

    margin-bottom: 15px;

    border-radius: 4px;

    background:
        rgba(237,66,69,.12);

    color: #f38688;

    font-size: 13px;
}

.auth-success {

    display: none;

    padding: 10px;

    margin-bottom: 15px;

    border-radius: 4px;

    background:
        rgba(35,165,90,.12);

    color: #57d48b;

    font-size: 13px;
}


/* =====================================================
   验证码
===================================================== */

.code-row {

    display: flex;

    gap: 8px;
}

.code-row .form-input {

    flex: 1;

    letter-spacing: 5px;

    text-align: center;
}

.code-button {

    width: 125px;

    border: none;

    border-radius: 4px;

    background: #4f545c;

    color: white;

    font-size: 13px;
}

.code-button:hover {

    background: #686d75;
}

.code-button:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* =====================================================
   注册资料
===================================================== */

.avatar-upload {

    display: flex;

    flex-direction: column;

    align-items: center;

    margin-bottom: 25px;
}

.avatar-preview {

    width: 96px;

    height: 96px;

    border-radius: 50%;

    object-fit: cover;

    background: #5865f2;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 38px;

    margin-bottom: 12px;

    border: 3px solid #2b2e35;
}

.avatar-upload input {

    display: none;
}

.avatar-button {

    border: none;

    background: #4f545c;

    color: white;

    padding: 8px 14px;

    border-radius: 4px;

    font-size: 13px;
}

.avatar-button:hover {

    background: #686d75;
}


/* =====================================================
   聊天页面
===================================================== */

#chatPage {

    display: none;

    height: 100vh;

    background: #111318;
}

.chat-container {

    width: 100%;

    height: 100vh;

    display: flex;

    flex-direction: column;
}


/* =====================================================
   Header
===================================================== */

.chat-header {

    height: 64px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    background: #15171d;

    border-bottom:
        1px solid #252832;
}

.chat-title {

    display: flex;

    align-items: center;

    gap: 12px;
}

.chat-icon {

    width: 38px;

    height: 38px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: #5865f2;
}

.chat-title h2 {

    font-size: 16px;
}

.status {

    font-size: 11px;

    color: #23a55a;

    margin-top: 2px;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 12px;
}

.current-user {

    display: flex;

    align-items: center;

    gap: 8px;

    color: #dbdee1;

    font-size: 13px;
}

.header-avatar {

    width: 32px;

    height: 32px;

    border-radius: 50%;

    object-fit: cover;

    background: #5865f2;
}

.logout-button {

    border: none;

    border-radius: 4px;

    padding: 8px 12px;

    background: #2b2e35;

    color: #dbdee1;

    font-size: 13px;
}

.logout-button:hover {

    background: #ed4245;
}


/* =====================================================
   消息
===================================================== */

#messages {

    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.message {

    display: flex;

    gap: 12px;

    margin-bottom: 18px;
}

.message.mine {

    flex-direction: row-reverse;
}

.message-avatar {

    width: 40px;

    height: 40px;

    flex-shrink: 0;

    border-radius: 50%;

    object-fit: cover;

    background: #5865f2;
}

.message-body {

    max-width: 75%;
}

.message.mine .message-body {

    text-align: right;
}

.nickname {

    font-size: 13px;

    color: #b5bac1;

    margin-bottom: 4px;

    font-weight: 600;
}

.bubble {

    display: inline-block;

    padding: 9px 13px;

    border-radius: 8px;

    background: #1e2128;

    color: #dbdee1;

    line-height: 1.5;

    word-break: break-word;

    text-align: left;
}

.mine .bubble {

    background: #5865f2;

    color: white;
}

.time {

    font-size: 10px;

    margin-top: 4px;

    color: #6d717a;
}

.empty {

    height: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    color: #6d717a;

    text-align: center;
}


/* =====================================================
   图片
===================================================== */

.image-bubble {

    padding: 5px;
}

.chat-image {

    display: block;

    max-width: 320px;

    max-height: 400px;

    border-radius: 8px;

    object-fit: contain;

    cursor: pointer;
}

.chat-image:hover {

    opacity: .9;
}


/* =====================================================
   输入
===================================================== */

.input-area {

    display: flex;

    gap: 8px;

    padding: 15px 20px;

    background: #15171d;

    border-top:
        1px solid #252832;
}

#messageInput {

    flex: 1;

    min-width: 0;

    border: none;

    outline: none;

    padding: 12px 14px;

    border-radius: 6px;

    color: white;

    background: #1e2128;
}

#messageInput::placeholder {

    color: #6d717a;
}

#imageInput {

    display: none;
}

#imageButton {

    width: 46px;

    border: none;

    border-radius: 6px;

    background: #2b2e35;

    color: white;

    font-size: 18px;
}

#imageButton:hover {

    background: #40444b;
}

#sendButton {

    width: 75px;

    border: none;

    border-radius: 6px;

    background: #5865f2;

    color: white;

    font-weight: 700;
}

#sendButton:hover {

    background: #4752c4;
}

#sendButton:disabled,
#imageButton:disabled {

    opacity: .5;

    cursor: not-allowed;
}


/* =====================================================
   图片查看器
===================================================== */

#imageViewer {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.9);

    z-index: 999;
}

#viewerImage {

    max-width: 95vw;

    max-height: 90vh;

    border-radius: 8px;
}

#closeViewer {

    position: absolute;

    top: 20px;

    right: 25px;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.15);

    color: white;

    font-size: 28px;
}


/* =====================================================
   手机
===================================================== */

@media (max-width:600px) {

    .auth-card {

        padding: 25px 20px;
    }

    #messages {

        padding: 18px 12px;
    }

    .message-body {

        max-width: 78%;
    }

    .chat-header {

        padding: 0 12px;
    }

    .current-user span {

        display: none;
    }

    .chat-image {

        max-width: 250px;

        max-height: 350px;
    }

    .input-area {

        padding: 10px;
    }

    #sendButton {

        width: 60px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     首页
===================================================== -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">

            开始聊天

        </button>

    </div>

</div>


<!-- =====================================================
     登录
===================================================== -->

<div
    id="loginPage"
    class="page">

    <div class="auth-card">

        <h1>欢迎回来</h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div
            id="loginError"
            class="auth-error">
        </div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
            >

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password"
            >

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">

            登录

        </button>

        <div class="auth-link">

            还没有账号？

            <button
                onclick="openRegisterPage()">

                创建账号

            </button>

        </div>

        <div class="auth-link">

            <button
                onclick="backToHome()">

                返回首页

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     注册第一步
===================================================== -->

<div
    id="registerPage"
    class="page">

    <div class="auth-card">

        <h1>创建账号</h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div
            id="registerError"
            class="auth-error">
        </div>

        <div
            id="registerSuccess"
            class="auth-success">
        </div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
            >

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password"
            >

        </div>

        <div class="form-group">

            <label>验证码</label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="6位验证码"
                >

                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendRegisterCode()">

                    获取验证码

                </button>

            </div>

        </div>

        <button
            id="verifyButton"
            class="primary-button"
            onclick="verifyRegisterCode()">

            验证并继续

        </button>

        <div class="auth-link">

            已经有账号？

            <button
                onclick="openLoginPage()">

                登录

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     注册第二步：资料
===================================================== -->

<div
    id="profilePage"
    class="page">

    <div class="auth-card">

        <h1>完善资料</h1>

        <div class="auth-subtitle">
            设置你的昵称和头像
        </div>

        <div
            id="profileError"
            class="auth-error">
        </div>

        <div class="avatar-upload">

            <img
                id="avatarPreview"
                class="avatar-preview"
                src=""
                alt="头像"
                style="display:none;"
            >

            <div
                id="avatarDefault"
                class="avatar-preview">

                👤

            </div>

            <input
                id="avatarInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
                onchange="previewAvatar(event)"
            >

            <button
                class="avatar-button"
                onclick="document.getElementById('avatarInput').click()">

                选择头像

            </button>

        </div>

        <div class="form-group">

            <label>昵称</label>

            <input
                id="profileNickname"
                class="form-input"
                type="text"
                maxlength="30"
                placeholder="例如：Justin"
                autocomplete="off"
            >

        </div>

        <button
            id="finishProfileButton"
            class="primary-button"
            onclick="finishProfile()">

            完成注册并进入聊天

        </button>

    </div>

</div>


<!-- =====================================================
     聊天页面
===================================================== -->

<div id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>
                        My Chat
                    </h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <div class="header-right">

                <div class="current-user">

                    <img
                        id="currentUserAvatar"
                        class="header-avatar"
                        src=""
                        alt="头像"
                    >

                    <span id="currentUserName">
                        用户
                    </span>

                </div>

                <button
                    class="logout-button"
                    onclick="logoutUser()">

                    退出

                </button>

            </div>

        </header>


        <main id="messages">

            <div
                class="empty"
                id="emptyMessage">

                暂时还没有消息
                <br>
                成为第一个发言的人吧！

            </div>

        </main>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="输入消息..."
                autocomplete="off"
            >

            <input
                id="imageInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
            >

            <button
                id="imageButton"
                onclick="document.getElementById('imageInput').click()"
                title="发送图片">

                📷

            </button>

            <button
                id="sendButton"
                onclick="sendMessage()">

                发送

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     图片查看器
===================================================== -->

<div
    id="imageViewer"
    onclick="closeImageViewer()">

    <button
        id="closeViewer"
        onclick="closeImageViewer(event)">

        ×

    </button>

    <img
        id="viewerImage"
        src=""
        alt="图片"
        onclick="event.stopPropagation()"
    >

</div>


<script>

/* =====================================================
   Supabase
===================================================== */

const SUPABASE_URL =
    "https://fhkqnknpmdddiehpktnu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_3p3PR-D3GUy5BRhQDl57AA__4Gbg388";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   数据库
===================================================== */

const MESSAGE_TABLE =
    "messages";

const PROFILE_TABLE =
    "profiles";

const CHAT_IMAGE_BUCKET =
    "chat-images";

const AVATAR_BUCKET =
    "avatars";


/* =====================================================
   状态
===================================================== */

let currentUser = null;

let currentProfile = null;

let realtimeChannel = null;

let temporaryAvatarFile = null;


/* =====================================================
   DOM
===================================================== */

const homePage =
    document.getElementById("homePage");

const loginPage =
    document.getElementById("loginPage");

const registerPage =
    document.getElementById("registerPage");

const profilePage =
    document.getElementById("profilePage");

const chatPage =
    document.getElementById("chatPage");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");


/* =====================================================
   页面切换
===================================================== */

function hideAllPages() {

    homePage.style.display = "none";

    loginPage.style.display = "none";

    registerPage.style.display = "none";

    profilePage.style.display = "none";

    chatPage.style.display = "none";
}


function openLoginPage() {

    hideAllPages();

    loginPage.style.display = "flex";

    document
        .getElementById("loginEmail")
        .focus();
}


function openRegisterPage() {

    hideAllPages();

    registerPage.style.display = "flex";

    document
        .getElementById("registerEmail")
        .focus();
}


function openProfilePage() {

    hideAllPages();

    profilePage.style.display = "flex";
}


function backToHome() {

    hideAllPages();

    homePage.style.display = "flex";
}


/* =====================================================
   错误提示
===================================================== */

function showError(id, text) {

    const box =
        document.getElementById(id);

    box.textContent = text;

    box.style.display = "block";
}


function hideMessage(id) {

    const box =
        document.getElementById(id);

    box.style.display = "none";

    box.textContent = "";
}


/* =====================================================
   初始化
===================================================== */

async function initializeApp() {

    const {
        data
    } = await supabaseClient.auth.getSession();

    if (data && data.session) {

        currentUser =
            data.session.user;

        await loadCurrentProfile();

        if (currentProfile) {

            openChat();

        } else {

            openProfilePage();
        }

    } else {

        hideAllPages();

        homePage.style.display = "flex";
    }


    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            if (event === "SIGNED_OUT") {

                currentUser = null;

                currentProfile = null;

                if (realtimeChannel) {

                    await supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                    realtimeChannel = null;
                }

                backToHome();

                return;
            }

            if (
                session &&
                event === "SIGNED_IN"
            ) {

                currentUser =
                    session.user;
            }

        }
    );
}


/* =====================================================
   登录
===================================================== */

async function loginUser() {

    hideMessage("loginError");

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    if (!email) {

        showError(
            "loginError",
            "请输入邮箱。"
        );

        return;
    }

    if (!password) {

        showError(
            "loginError",
            "请输入密码。"
        );

        return;
    }


    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled = true;

    button.textContent =
        "登录中...";


    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

    });


    button.disabled = false;

    button.textContent =
        "登录";


    if (error) {

        console.error(
            "登录失败：",
            error
        );

        showError(
            "loginError",
            "登录失败：" +
            error.message
        );

        return;
    }


    currentUser =
        data.user;


    await loadCurrentProfile();


    if (!currentProfile) {

        openProfilePage();

        return;
    }


    openChat();
}


/* =====================================================

/* =====================================================
   注册：验证验证码
===================================================== */

async function verifyRegisterCode() {

    hideMessage("registerError");

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const token =
        document
            .getElementById("registerCode")
            .value
            .trim();


    if (!email) {

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;
    }


    if (password.length < 6) {

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;
    }


    if (!/^\d{6}$/.test(token)) {

        showError(
            "registerError",
            "请输入 6 位数字验证码。"
        );

        return;
    }


    const button =
        document.getElementById(
            "verifyButton"
        );

    button.disabled = true;

    button.textContent =
        "验证中...";


    const {
        data,
        error
    } = await supabaseClient.auth.verifyOtp({

        email: email,

        token: token,

        type: "email"

    });


    if (error) {

        console.error(
            "验证码验证失败：",
            error
        );

        button.disabled = false;

        button.textContent =
            "验证并继续";

        showError(
            "registerError",
            "验证码错误或已过期：" +
            error.message
        );

        return;
    }


    currentUser =
        data.user;


    /*
       验证成功后设置密码
    */

    const {
        error: passwordError
    } = await supabaseClient.auth.updateUser({

        password: password

    });


    button.disabled = false;

    button.textContent =
        "验证并继续";


    if (passwordError) {

        console.error(
            "设置密码失败：",
            passwordError
        );

        showError(
            "registerError",
            "邮箱已验证，但设置密码失败：" +
            passwordError.message
        );

        return;
    }


    openProfilePage();
}


/* =====================================================
   头像预览
===================================================== */

function previewAvatar(event) {

    const file =
        event.target.files[0];

    if (!file) {

        return;
    }


    const allowedTypes = [

        "image/jpeg",

        "image/png",

        "image/gif",

        "image/webp"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "头像只支持 JPG、PNG、GIF、WEBP。"
        );

        event.target.value = "";

        return;
    }


    if (
        file.size >
        5 * 1024 * 1024
    ) {

        alert(
            "头像不能超过 5MB。"
        );

        event.target.value = "";

        return;
    }


    temporaryAvatarFile =
        file;


    const url =
        URL.createObjectURL(file);


    const preview =
        document.getElementById(
            "avatarPreview"
        );

    const defaultAvatar =
        document.getElementById(
            "avatarDefault"
        );


    preview.src = url;

    preview.style.display =
        "block";

    defaultAvatar.style.display =
        "none";
}


/* =====================================================
   完善资料
===================================================== */

async function finishProfile() {

    hideMessage("profileError");


    if (!currentUser) {

        showError(
            "profileError",
            "登录状态已经失效，请重新登录。"
        );

        return;
    }


    const nickname =
        document
            .getElementById("profileNickname")
            .value
            .trim();


    if (!nickname) {

        showError(
            "profileError",
            "请输入昵称。"
        );

        return;
    }


    const button =
        document.getElementById(
            "finishProfileButton"
        );

    button.disabled = true;

    button.textContent =
        "正在创建资料...";


    let avatarUrl = null;


    try {


        /* =================================================
           上传头像
        ================================================= */

        if (temporaryAvatarFile) {

            const extension =
                temporaryAvatarFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                currentUser.id +
                "_" +
                Date.now() +
                "." +
                extension;


            const {
                error: uploadError
            } = await supabaseClient.storage
                .from(AVATAR_BUCKET)
                .upload(
                    fileName,
                    temporaryAvatarFile,
                    {
                        cacheControl: "3600",

                        upsert: false,

                        contentType:
                            temporaryAvatarFile.type
                    }
                );


            if (uploadError) {

                throw new Error(
                    "头像上传失败：" +
                    uploadError.message
                );
            }


            const {
                data: publicData
            } =
                supabaseClient.storage
                    .from(AVATAR_BUCKET)
                    .getPublicUrl(
                        fileName
                    );


            avatarUrl =
                publicData.publicUrl;
        }


        /* =================================================
           保存 profiles
        ================================================= */

        const {
            error: profileError
        } =
            await supabaseClient
                .from(PROFILE_TABLE)
                .upsert({

                    id:
                        currentUser.id,

                    nickname:
                        nickname,

                    avatar_url:
                        avatarUrl

                });


        if (profileError) {

            throw new Error(
                "保存用户资料失败：" +
                profileError.message
            );
        }


        currentProfile = {

            id:
                currentUser.id,

            nickname:
                nickname,

            avatar_url:
                avatarUrl

        };


        temporaryAvatarFile =
            null;


        openChat();


    } catch (error) {

        console.error(
            "创建资料失败：",
            error
        );

        showError(
            "profileError",
            error.message
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "完成注册并进入聊天";
    }
}

/* =====================================================
   历史消息
===================================================== */

async function loadMessages() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from(MESSAGE_TABLE)
            .select(
                "id,nickname,message,created_at"
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "读取历史消息失败：",
            error
        );


        messages.innerHTML = `

            <div class="empty">

                读取聊天记录失败

                <br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;
    }


    messages.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        showEmpty();

        return;
    }


    /*
       一次读取所有 profiles。

       这样旧消息也可以尽可能找到
       对应昵称的头像。
    */

    const {
        data: profiles
    } =
        await supabaseClient
            .from(PROFILE_TABLE)
            .select(
                "nickname,avatar_url"
            );


    const profileMap =
        new Map();


    if (profiles) {

        profiles.forEach(
            function(profile) {

                if (
                    !profileMap.has(
                        profile.nickname
                    )
                ) {

                    profileMap.set(
                        profile.nickname,
                        profile
                    );
                }

            }
        );
    }


    data.forEach(
        function(message) {

            renderMessage(
                message,
                profileMap
            );

        }
    );


    scrollToBottom();
}

/* =====================================================
   图片判断
===================================================== */

function isImageUrl(value) {

    if (!value) {

        return false;
    }


    const text =
        String(value).trim();


    return (
        text.startsWith("http://") ||
        text.startsWith("https://")
    );
}


/* =====================================================
   默认头像
===================================================== */

function createDefaultAvatar(name) {

    const letter =
        (name || "?")
            .charAt(0)
            .toUpperCase();


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="80"
            height="80">

            <rect
                width="80"
                height="80"
                rx="40"
                fill="#5865f2"
            />

            <text
                x="50%"
                y="55%"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="white"
                font-size="32"
                font-family="Arial">

                ${escapeHtml(letter)}

            </text>

        </svg>

    `;


    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}


/* =====================================================
   显示消息
===================================================== */

function renderMessage(
    message,
    profileMap = null
) {

    hideEmpty();


    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message";


    const isMine =
        currentProfile &&
        message.nickname ===
        currentProfile.nickname;


    if (isMine) {

        row.classList.add(
            "mine"
        );
    }


    let profile = null;


    if (profileMap) {

        profile =
            profileMap.get(
                message.nickname
            );
    }


    /*
       如果是自己的消息，
       直接使用自己的 profile。
    */

    if (
        isMine &&
        currentProfile
    ) {

        profile =
            currentProfile;
    }


    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "message-avatar";


    if (
        profile &&
        profile.avatar_url
    ) {

        avatar.src =
            profile.avatar_url;

    } else {

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );
    }


    avatar.alt =
        "头像";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "nickname";

    name.textContent =
        message.nickname ||
        "匿名";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    /* =================================================
       图片
    ================================================= */

    if (
        isImageUrl(
            message.message
        )
    ) {

        bubble.classList.add(
            "image-bubble"
        );


        const img =
            document.createElement(
                "img"
            );

        img.className =
            "chat-image";

        img.src =
            message.message;

        img.alt =
            "聊天图片";

        img.loading =
            "lazy";


        img.onclick =
            function() {

                openImageViewer(
                    message.message
                );

            };


        img.onerror =
            function() {

                img.alt =
                    "图片无法加载";

                img.style.display =
                    "none";

                const text =
                    document.createElement(
                        "div"
                    );

                text.textContent =
                    message.message;

                bubble.appendChild(
                    text
                );
            };


        bubble.appendChild(
            img
        );

    }


    /* =================================================
       普通文字
    ================================================= */

    else {

        bubble.textContent =
            message.message ||
            "";
    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            message.created_at
        );


    body.appendChild(
        name
    );

    body.appendChild(
        bubble
    );

    body.appendChild(
        time
    );


    row.appendChild(
        avatar
    );

    row.appendChild(
        body
    );


    messages.appendChild(
        row
    );


    scrollToBottom();
}


/* =====================================================
   时间
===================================================== */

function formatTime(value) {

    if (!value) {

        return "";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =====================================================
   滚动
===================================================== */

function scrollToBottom() {

    setTimeout(
        function() {

            messages.scrollTop =
                messages.scrollHeight;

        },
        50
    );
}

/* =====================================================
   上传聊天图片
===================================================== */

async function uploadImage(file) {

    if (
        !currentUser ||
        !currentProfile
    ) {

        openLoginPage();

        return;
    }


    const maxSize =
        10 * 1024 * 1024;


    if (
        file.size >
        maxSize
    ) {

        alert(
            "图片太大，请选择 10MB 以下的图片。"
        );

        return;
    }


    const allowedTypes = [

        "image/jpeg",

        "image/png",

        "image/gif",

        "image/webp"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "只支持 JPG、PNG、GIF、WEBP 图片。"
        );

        return;
    }


    imageButton.disabled =
        true;

    imageButton.textContent =
        "⏳";


    try {

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const fileName =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            extension;


        const {
            error: uploadError
        } =
            await supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl:
                            "3600",

                        upsert:
                            false,

                        contentType:
                            file.type
                    }
                );


        if (uploadError) {

            throw uploadError;
        }


        const {
            data: urlData
        } =
            supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .getPublicUrl(
                    fileName
                );


        const imageUrl =
            urlData.publicUrl;


        const {
            data,
            error
        } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    nickname:
                        currentProfile.nickname,

                    message:
                        imageUrl

                })
                .select(
                    "id,nickname,message,created_at"
                )
                .single();


        if (error) {

            throw error;
        }


        if (data) {

            renderMessage(
                data,
                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );
        }


    } catch (error) {

        console.error(
            "图片发送失败：",
            error
        );


        alert(
            "图片发送失败：\n" +
            error.message
        );


    } finally {

        imageButton.disabled =
            false;

        imageButton.textContent =
            "📷";
    }
}


/* =====================================================
   Realtime
===================================================== */

function subscribeToMessages() {

    if (
        realtimeChannel
    ) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }


    realtimeChannel =
        supabaseClient

            .channel(
                "messages-realtime"
            )

            .on(

                "postgres_changes",

                {

                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        MESSAGE_TABLE

                },

                async function(payload) {

                    /*
                       自己的消息已经立即显示，
                       所以不重复显示。
                    */

                    if (
                        currentProfile &&
                        payload.new.nickname ===
                        currentProfile.nickname
                    ) {

                        return;
                    }


                    /*
                       查找发送者头像。
                    */

                    let profileMap =
                        new Map();


                    const {
                        data
                    } =
                        await supabaseClient
                            .from(
                                PROFILE_TABLE
                            )
                            .select(
                                "nickname,avatar_url"
                            )
                            .eq(
                                "nickname",
                                payload.new.nickname
                            );


                    if (data) {

                        data.forEach(
                            function(profile) {

                                profileMap.set(
                                    profile.nickname,
                                    profile
                                );

                            }
                        );
                    }


                    renderMessage(
                        payload.new,
                        profileMap
                    );

                }

            )

            .subscribe(

                function(status) {

                    console.log(
                        "Realtime:",
                        status
                    );

                }

            );
}

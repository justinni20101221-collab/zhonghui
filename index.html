<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   基础
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#0b0d12;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
}


/* =========================================================
   页面通用
========================================================= */

.page{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    overflow:auto;

    background:#0b0d12;
}


/* =========================================================
   首页
========================================================= */

#homePage{
    position:fixed;
    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:auto;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card{
    width:100%;
    max-width:460px;

    padding:50px 38px;

    text-align:center;

    border-radius:18px;

    background:#15171d;

    border:1px solid #252832;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:82px;
    height:82px;

    margin:0 auto 25px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:38px;

    background:#5865f2;

    box-shadow:
        0 15px 35px rgba(88,101,242,.35);
}

.home-card h1{
    font-size:40px;
    margin-bottom:12px;
}

.home-card p{
    color:#a6a8b0;
    line-height:1.7;
    margin-bottom:30px;
}

.primary-button{
    width:100%;

    border:none;

    border-radius:6px;

    padding:14px 20px;

    color:white;

    font-weight:700;

    background:#5865f2;

    transition:
        background .15s,
        transform .1s;
}

.primary-button:hover{
    background:#4752c4;
}

.primary-button:active{
    transform:scale(.99);
}

.primary-button:disabled{
    opacity:.55;
}


/* =========================================================
   登录 / 注册
========================================================= */

.auth-card{
    width:100%;
    max-width:430px;

    padding:32px;

    border-radius:10px;

    background:#15171d;

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1{
    text-align:center;

    font-size:25px;

    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;

    color:#a6a8b0;

    font-size:14px;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    font-size:12px;

    font-weight:700;

    color:#b5bac1;

    margin-bottom:8px;
}

.form-input{
    width:100%;

    border:none;
    outline:none;

    padding:13px;

    border-radius:5px;

    color:white;

    background:#0f1116;

    border:1px solid #252832;

    transition:border-color .15s;
}

.form-input:focus{
    border-color:#5865f2;
}

.auth-link{
    text-align:center;

    margin-top:18px;

    font-size:14px;

    color:#a6a8b0;
}

.auth-link button{
    border:none;

    background:none;

    color:#5865f2;

    font-weight:600;
}

.auth-error,
.auth-success{
    display:none;

    padding:10px;

    margin-bottom:15px;

    border-radius:5px;

    font-size:13px;
}

.auth-error{
    background:rgba(237,66,69,.12);
    color:#f38688;
}

.auth-success{
    background:rgba(35,165,90,.12);
    color:#57d48b;
}

.code-row{
    display:flex;

    gap:8px;
}

.code-row .form-input{
    flex:1;

    letter-spacing:5px;

    text-align:center;

    font-size:18px;
}

.code-button{
    width:125px;

    flex-shrink:0;

    border:none;

    border-radius:5px;

    background:#4f545c;

    color:white;

    font-size:13px;
}

.code-button:disabled{
    opacity:.5;
}


/* =========================================================
   头像
========================================================= */

.avatar-upload{
    display:flex;

    flex-direction:column;

    align-items:center;

    margin-bottom:25px;
}

.avatar-preview{
    width:96px;
    height:96px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:38px;

    margin-bottom:12px;

    border:3px solid #2b2e35;
}

.avatar-upload input{
    display:none;
}

.avatar-button{
    border:none;

    background:#4f545c;

    color:white;

    padding:8px 14px;

    border-radius:5px;

    font-size:13px;
}


/* =========================================================
   聊天页面
========================================================= */

#chatPage{
    position:fixed;

    inset:0;

    width:100%;
    height:100dvh;

    display:none;

    overflow:hidden;

    background:#111318;
}

.chat-container{
    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}


/* =========================================================
   顶部
========================================================= */

.chat-header{
    height:64px;

    min-height:64px;

    flex:0 0 64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    background:#15171d;

    border-bottom:1px solid #252832;

    z-index:50;
}

.chat-title{
    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}

.chat-icon{
    width:38px;
    height:38px;

    flex:0 0 38px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:#5865f2;
}

.chat-title h2{
    font-size:16px;
}

.status{
    font-size:11px;

    color:#23a55a;

    margin-top:2px;
}

.header-right{
    display:flex;

    align-items:center;

    gap:12px;

    flex-shrink:0;
}

.current-user{
    display:flex;

    align-items:center;

    gap:8px;

    color:#dbdee1;

    font-size:13px;
}

.header-avatar{
    width:32px;
    height:32px;

    flex:0 0 32px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;
}

.logout-button{
    border:none;

    border-radius:5px;

    padding:8px 12px;

    background:#2b2e35;

    color:#dbdee1;

    font-size:13px;

    transition:.15s;
}

.logout-button:hover{
    background:#ed4245;
}


/* =========================================================
   消息区域
========================================================= */

#messages{
    flex:1 1 auto;

    min-height:0;

    width:100%;

    overflow-x:hidden;

    overflow-y:auto;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

    padding:24px;

    background:#111318;

    overflow-anchor:none;

    scroll-behavior:auto;
}


/* =========================================================
   加载旧消息
========================================================= */

.load-more{
    display:flex;

    justify-content:center;
    align-items:center;

    min-height:38px;

    color:#777d87;

    font-size:12px;

    opacity:0;

    transition:opacity .2s;
}

.load-more.show{
    opacity:1;
}

.load-more-text{
    padding:7px 12px;

    border-radius:20px;

    background:#1e2128;
}


/* =========================================================
   消息
========================================================= */

.message{
    display:flex;

    gap:12px;

    margin-bottom:18px;

    width:100%;

    animation:
        messageAppear .12s ease-out;
}

@keyframes messageAppear{
    from{
        opacity:0;
        transform:translateY(3px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.mine{
    flex-direction:row-reverse;
}

.message-avatar{
    width:40px;
    height:40px;

    flex:0 0 40px;

    border-radius:50%;

    object-fit:cover;

    background:#5865f2;
}

.message-body{
    max-width:75%;
    min-width:0;
}

.message.mine .message-body{
    text-align:right;
}

.nickname{
    font-size:13px;

    color:#b5bac1;

    margin-bottom:4px;

    font-weight:600;
}

.bubble{
    display:inline-block;

    max-width:100%;

    padding:9px 13px;

    border-radius:8px;

    background:#1e2128;

    color:#dbdee1;

    line-height:1.5;

    word-break:break-word;

    overflow-wrap:anywhere;

    text-align:left;

    position:relative;
}

.mine .bubble{
    background:#5865f2;

    color:white;
}


/* =========================================================
   消息发送中
========================================================= */

.message.pending{
    opacity:.75;
}

.pending-text{
    font-size:11px;

    margin-top:4px;

    color:#777d87;
}

.mine .pending-text{
    text-align:right;
}


/* =========================================================
   图片
========================================================= */

.bubble.image-bubble{
    padding:0 !important;

    background:transparent !important;

    border-radius:8px;

    overflow:hidden;

    line-height:0;
}

.chat-image{
    display:block;

    max-width:320px;

    max-height:400px;

    width:auto;
    height:auto;

    border-radius:8px;

    object-fit:contain;

    cursor:pointer;

    background:#1e2128;
}

.chat-image:hover{
    opacity:.92;
}

.image-loading{
    width:160px;
    height:120px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#8b8f98;

    background:#1e2128;

    border-radius:8px;

    font-size:12px;
}


/* =========================================================
   语音
========================================================= */

.audio-bubble{
    padding:6px !important;

    background:#1e2128;
}

.mine .audio-bubble{
    background:#5865f2;
}

.audio-player{
    display:block;

    width:270px;

    max-width:100%;

    height:42px;
}

.audio-loading{
    display:flex;

    align-items:center;

    gap:8px;

    min-width:150px;

    padding:8px 10px;

    color:#c8cad0;

    font-size:12px;
}


/* =========================================================
   时间
========================================================= */

.time{
    font-size:10px;

    margin-top:4px;

    color:#6d717a;
}


/* =========================================================
   空消息
========================================================= */

.empty{
    min-height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    color:#6d717a;

    text-align:center;

    line-height:1.8;
}


/* =========================================================
   输入区
========================================================= */

.input-area{
    width:100%;

    flex:0 0 auto;

    position:relative;

    display:flex;

    align-items:center;

    padding:
        12px
        18px
        calc(
            12px +
            env(safe-area-inset-bottom)
        );

    background:#15171d;

    border-top:1px solid #252832;

    z-index:100;
}


/* =========================================================
   Composer
========================================================= */

.composer{
    width:100%;

    min-height:48px;

    display:flex;

    align-items:center;

    gap:8px;

    padding:6px 8px;

    background:#1e2128;

    border-radius:10px;

    border:1px solid transparent;

    transition:
        border-color .15s,
        background .15s;
}

.composer:focus-within{
    border-color:#343842;

    background:#20232a;
}


/* =========================================================
   +
========================================================= */

.plus-button{
    width:34px;
    height:34px;

    flex:0 0 34px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:#4f545c;

    color:white;

    font-size:24px;

    line-height:1;

    transition:.15s;
}

.plus-button:hover{
    background:#5865f2;

    transform:rotate(90deg);
}


/* =========================================================
   输入框
========================================================= */

#messageInput{
    flex:1 1 auto;

    min-width:0;

    height:36px;

    border:none;

    outline:none;

    padding:5px 6px;

    color:white;

    background:transparent;

    font-size:15px;
}

#messageInput::placeholder{
    color:#6d717a;
}


/* =========================================================
   功能按钮
========================================================= */

.composer-actions{
    display:flex;

    align-items:center;

    gap:2px;

    flex:0 0 auto;
}

.composer-button{
    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:transparent;

    color:#b5bac1;

    font-size:21px;

    transition:.15s;
}

.composer-button:hover{
    color:white;

    background:#2b2e35;
}


/* =========================================================
   发送
========================================================= */

#sendButton{
    display:none;

    width:38px;
    height:38px;

    flex:0 0 38px;

    align-items:center;
    justify-content:center;

    border:none;

    border-radius:50%;

    background:#5865f2;

    color:white;

    font-size:18px;

    transition:.15s;
}

#sendButton:hover{
    background:#4752c4;

    transform:scale(1.05);
}

#sendButton:disabled{
    opacity:.5;
}

.composer.has-text .normal-actions{
    display:none;
}

.composer.has-text #sendButton{
    display:flex;
}


/* =========================================================
   Emoji
========================================================= */

#emojiPicker{
    position:absolute;

    right:20px;

    bottom:82px;

    width:320px;

    max-width:
        calc(
            100vw - 30px
        );

    padding:12px;

    display:none;

    background:#181a20;

    border:1px solid #2b2e35;

    border-radius:10px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.5);

    z-index:300;
}

.emoji-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:4px 5px 10px;

    color:#b5bac1;

    font-size:12px;
}

.emoji-grid{
    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    gap:3px;

    max-height:250px;

    overflow-y:auto;
}

.emoji-item{
    width:34px;
    height:34px;

    border:none;

    background:transparent;

    border-radius:6px;

    font-size:22px;
}

.emoji-item:hover{
    background:#2b2e35;
}


/* =========================================================
   加号菜单
========================================================= */

#plusMenu{
    position:absolute;

    left:18px;

    bottom:82px;

    width:190px;

    padding:6px;

    display:none;

    background:#181a20;

    border:1px solid #2b2e35;

    border-radius:10px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.5);

    z-index:300;
}

.plus-menu-item{
    width:100%;

    display:flex;

    align-items:center;

    gap:10px;

    border:none;

    background:transparent;

    color:#dbdee1;

    padding:10px;

    border-radius:6px;

    text-align:left;

    font-size:14px;
}

.plus-menu-item:hover{
    background:#2b2e35;
}


/* =========================================================
   现代语音
========================================================= */

#voiceOverlay{
    position:absolute;

    left:12px;
    right:12px;

    bottom:82px;

    display:none;

    align-items:center;

    gap:9px;

    padding:8px;

    background:#1e2128;

    border:1px solid #30343d;

    border-radius:12px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.4);

    z-index:400;
}

#voiceOverlay.active{
    display:flex;
}

#voiceCancel{
    width:38px;
    height:38px;

    flex:0 0 38px;

    border:0;

    border-radius:50%;

    background:#2b2e35;

    color:#b5bac1;

    font-size:20px;
}

#voiceCancel:hover{
    background:#ed4245;

    color:white;
}

#voiceHold{
    flex:1;

    min-width:0;

    height:42px;

    border:0;

    border-radius:10px;

    background:#5865f2;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    font-size:14px;

    font-weight:600;

    user-select:none;

    -webkit-user-select:none;

    touch-action:none;
}

#voiceHold.recording{
    background:#ed4245;
}

.voice-dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:#fff;

    display:none;
}

#voiceOverlay.recording .voice-dot{
    display:block;

    animation:
        voicePulse 1s infinite;
}

@keyframes voicePulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.35;
        transform:scale(.8);
    }
}

#voiceTime{
    min-width:42px;

    font-size:12px;

    font-variant-numeric:
        tabular-nums;
}

.voice-status{
    color:#777d87;

    font-size:11px;

    white-space:nowrap;
}


/* =========================================================
   图片上传隐藏
========================================================= */

#imageInput{
    display:none;
}


/* =========================================================
   图片查看器
========================================================= */

#imageViewer{
    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.9);

    z-index:9999;
}

#viewerImage{
    max-width:95vw;

    max-height:90vh;

    border-radius:8px;

    object-fit:contain;
}

#closeViewer{
    position:absolute;

    top:20px;
    right:25px;

    width:45px;
    height:45px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:white;

    font-size:28px;
}


/* =========================================================
   上传状态 Toast
========================================================= */

#toast{
    position:fixed;

    left:50%;

    bottom:90px;

    transform:
        translateX(-50%)
        translateY(15px);

    max-width:
        calc(
            100vw - 30px
        );

    padding:10px 15px;

    border-radius:8px;

    background:#181a20;

    border:1px solid #30343d;

    color:#fff;

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s,
        transform .2s;

    z-index:10000;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   手机
========================================================= */

@media(max-width:600px){

    .home-card{
        padding:40px 25px;
    }

    .home-card h1{
        font-size:34px;
    }

    .auth-card{
        padding:25px 20px;
    }

    .page{
        padding:12px;
    }

    .chat-header{
        height:58px;

        min-height:58px;

        flex-basis:58px;

        padding:0 12px;
    }

    .chat-icon{
        width:34px;
        height:34px;

        flex-basis:34px;
    }

    .chat-title h2{
        font-size:15px;
    }

    #messages{
        padding:18px 12px;
    }

    .message{
        gap:9px;
    }

    .message-avatar{
        width:36px;
        height:36px;

        flex-basis:36px;
    }

    .message-body{
        max-width:80%;
    }

    .chat-image{
        max-width:250px;
        max-height:350px;
    }

    .input-area{
        padding:
            9px
            10px
            max(
                9px,
                env(safe-area-inset-bottom)
            );
    }

    .composer{
        min-height:46px;

        padding:5px 6px;
    }

    .plus-button{
        width:34px;
        height:34px;

        flex-basis:34px;
    }

    #messageInput{
        font-size:16px;
    }

    .composer-button{
        width:34px;
        height:34px;

        font-size:20px;
    }

    #sendButton{
        width:36px;
        height:36px;

        flex-basis:36px;
    }

    .current-user span{
        display:none;
    }

    .logout-button{
        padding:7px 9px;
    }

    #emojiPicker{
        right:10px;
        bottom:72px;

        width:300px;
    }

    #plusMenu{
        left:10px;
        bottom:72px;
    }

    #voiceOverlay{
        left:10px;
        right:10px;

        bottom:72px;
    }

    .voice-status{
        display:none;
    }

    .audio-player{
        width:230px;
    }
}


@media(max-width:380px){

    .message-body{
        max-width:78%;
    }

    .emoji-grid{
        grid-template-columns:
            repeat(7,1fr);
    }
}


/* =========================================================
   防止选择
========================================================= */

.chat-header,
.input-area,
.chat-icon,
.status,
.logout-button,
.plus-button,
.composer-button,
#sendButton,
#voiceOverlay{
    user-select:none;
}

</style>

</head>

<body>


<!-- =========================================================
     首页
========================================================= -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>
            My Chat
        </h1>

        <p>

/* =========================================================
   初始化
========================================================= */

async function initializeApp(){

    try{

        const {
            data
        } =
        await supabaseClient.auth
            .getSession();


        if(
            data &&
            data.session
        ){

            currentUser =
                data.session.user;


            await loadCurrentProfile();


            if(currentProfile){

                await openChat();

            }else{

                openProfilePage();

            }

        }else{

            hideAllPages();

            homePage.style.display =
                "flex";

        }

    }catch(error){

        console.error(
            "初始化失败:",
            error
        );

        hideAllPages();

        homePage.style.display =
            "flex";

    }


    supabaseClient.auth.onAuthStateChange(
        async function(
            event,
            session
        ){

            if(
                event ===
                "SIGNED_OUT"
            ){

                currentUser = null;

                currentProfile = null;

                chatInitialized = false;

                if(realtimeChannel){

                    await supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                    realtimeChannel = null;

                }

                backToHome();

            }


            if(
                session &&
                event ===
                "SIGNED_IN"
            ){

                currentUser =
                    session.user;

            }

        }
    );

}

async function loginUser(){

    hideMessage(
        "loginError"
    );


    const email =
        document

                "loginEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

        );

    if(!password){

            "loginButton"

        const {
            data,
            error
        } =

            throw error;


        currentUser =

        if(!currentProfile){

            openProfilePage();

        button.disabled = false;

        button.textContent =

    }

}


/* =========================================================
   注册验证码
========================================================= */

async function sendRegisterCode(){

    hideMessage(
        "registerError"
    );

    hideMessage(
        "registerSuccess"
    );


    if(codeCooldown > 0){

        showError(
            "registerError",
            "请等待 " +
            codeCooldown +
            " 秒。"
        );

        return;

    }


    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;


    if(!email){

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;

    }


    if(password.length < 6){

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;

    }


    const button =
        document.getElementById(
            "sendCodeButton"
        );


    button.disabled = true;

    button.textContent =
        "发送中...";


    try{

        const {
            error
        } =
        await supabaseClient.auth
            .signInWithOtp({

                email,

                options:{
                    shouldCreateUser:true
                }

            });


        if(error)
            throw error;


        showSuccess(
            "registerSuccess",
            "验证码已经发送到你的邮箱。"
        );


        startCodeCooldown();


    }catch(error){

        console.error(
            error
        );

        button.disabled =
            false;

        button.textContent =
            "获取验证码";


        showError(
            "registerError",
            "验证码发送失败：" +
            error.message
        );

    }

}


function startCodeCooldown(){

    const button =
        document.getElementById(
            "sendCodeButton"
        );


    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";


    clearInterval(
        codeTimer
    );


    codeTimer =
        setInterval(
            function(){

                codeCooldown--;


                if(
                    codeCooldown <= 0
                ){

                    clearInterval(
                        codeTimer
                    );

                    codeCooldown = 0;

                    button.disabled =
                        false;

                    button.textContent =
                        "获取验证码";

                    return;

                }


                button.textContent =
                    codeCooldown +
                    " 秒后重试";

            },
            1000
        );

}


/* =========================================================
   验证验证码
========================================================= */

async function verifyRegisterCode(){

    hideMessage(
        "registerError"
    );


    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;


    const token =
        document
            .getElementById(
                "registerCode"
            )
            .value
            .trim();


    if(!email){

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;

    }


    if(password.length < 6){

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;

    }


    if(!/^\d{8}$/.test(token)){

        showError(
            "registerError",
            "请输入完整的8位验证码。"
        );

        return;

    }


    const button =
        document.getElementById(
            "verifyButton"
        );


    button.disabled = true;

    button.textContent =
        "验证中...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .verifyOtp({

                email,

                token,

                type:"email"

            });


        if(error)
            throw error;


        currentUser =
            data.user;


        const {
            error:passwordError
        } =
        await supabaseClient.auth
            .updateUser({

                password

            });


        if(passwordError)
            throw passwordError;


        openProfilePage();


    }catch(error){

        console.error(
            error
        );

        showError(
            "registerError",
            "验证码验证失败：" +
            error.message
        );

    }finally{

        button.disabled =
            false;

        button.textContent =
            "验证并继续";

    }

}


/* =========================================================
   头像预览
========================================================= */

function previewAvatar(event){

    const file =
        event.target.files[0];


    if(!file)
        return;


    const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"

    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        alert(
            "头像只支持 JPG、PNG、GIF、WEBP。"
        );

        event.target.value =
            "";

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        alert(
            "头像不能超过 5MB。"
        );

        event.target.value =
            "";

        return;

    }


    temporaryAvatarFile =
        file;


    const url =
        URL.createObjectURL(
            file
        );


    const preview =
        document.getElementById(
            "avatarPreview"
        );


    const defaultAvatar =
        document.getElementById(
            "avatarDefault"
        );


    preview.src =
        url;

    preview.style.display =
        "block";

    defaultAvatar.style.display =
        "none";

}


/* =========================================================
   完善资料
========================================================= */

async function finishProfile(){

    hideMessage(
        "profileError"
    );


    if(!currentUser){

        showError(
            "profileError",
            "登录状态已经失效，请重新登录。"
        );

        return;

    }


    const nickname =
        document
            .getElementById(
                "profileNickname"
            )
            .value
            .trim();


    if(!nickname){

        showError(
            "profileError",
            "请输入昵称。"
        );

        return;

    }


    const button =
        document.getElementById(
            "finishProfileButton"
        );


    button.disabled = true;

    button.textContent =
        "正在创建资料...";


    let avatarUrl = null;


    try{

        if(temporaryAvatarFile){

            const extension =
                temporaryAvatarFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const fileName =
                currentUser.id +
                "_" +
                Date.now() +
                "." +
                extension;


            const {
                error:uploadError
            } =
            await supabaseClient.storage
                .from(
                    AVATAR_BUCKET
                )
                .upload(
                    fileName,
                    temporaryAvatarFile,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:
                            temporaryAvatarFile.type
                    }
                );


            if(uploadError)
                throw uploadError;


            avatarUrl =
                fileName;

        }


        const {
            error:profileError
        } =
        await supabaseClient
            .from(
                PROFILE_TABLE
            )
            .upsert({

                id:
                    currentUser.id,

                nickname,

                avatar_url:
                    avatarUrl

            });


        if(profileError)
            throw profileError;


        currentProfile = {

            id:
                currentUser.id,

            nickname,

            avatar_url:
                avatarUrl

        };


        temporaryAvatarFile =
            null;


        await openChat();


    }catch(error){

        console.error(
            error
        );

        showError(
            "profileError",
            "保存资料失败：" +
            error.message

/* =========================================================
   Storage URL
========================================================= */

async function getPrivateFileUrl(
    bucket,
    path
){

    if(!path)
        return null;


    if(
        path.startsWith(
            "blob:"
        ) ||
        path.startsWith(
            "http://"
        ) ||
        path.startsWith(
            "https://"
        ) ||
        path.startsWith(
            "data:"
        )
    ){

        return path;

    }


    const cacheKey =
        bucket +
        ":" +
        path;


    if(
        imageUrlCache.has(
            cacheKey
        )
    ){

        const cached =
            imageUrlCache.get(
                cacheKey
            );


        if(
            cached.expires >
            Date.now()
        ){

            return cached.url;

        }

    }


    const {
        data,
        error
    } =
    await supabaseClient.storage
        .from(
            bucket
        )
        .createSignedUrl(
            path,
            3600
        );


    if(error){

        console.error(
            "生成 Storage 地址失败:",
            error
        );

        return null;

    }


    imageUrlCache.set(
        cacheKey,
        {
            url:
                data.signedUrl,

            expires:
                Date.now() +
                3500000
        }
    );


    return data.signedUrl;

}

/* =========================================================
   加载最近消息
========================================================= */

async function loadMessages(){

    hasMoreMessages =
        true;

    oldestMessageTime =
        null;


    messages.innerHTML =
        "";


    const loading =
        document.createElement(
            "div"
        );

    loading.className =
        "load-more show";

    loading.innerHTML =
        '<span class="load-more-text">正在加载消息...</span>';

    messages.appendChild(
        loading
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from(
            MESSAGE_TABLE
        )
        .select(
            "id,user_id,nickname,message,created_at,image_url,audio_url"
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(50);


    if(error){

        console.error(
            "读取历史消息失败:",
            error
        );


        messages.innerHTML =
            "";


        const errorBox =
            document.createElement(
                "div"
            );


        errorBox.className =
            "empty";


        errorBox.textContent =
            "读取聊天记录失败：" +
            error.message;


        messages.appendChild(
            errorBox
        );


        return;

    }


    messages.innerHTML =
        "";


    if(
        !data ||
        data.length === 0
    ){

        hasMoreMessages =
            false;

        showEmpty();

        return;

    }


    if(
        data.length < 50
    ){

        hasMoreMessages =
            false;

    }


    /*
       数据库是最新 → 最旧
       页面需要最旧 → 最新
    */

    data.reverse();


    oldestMessageTime =
        data[0].created_at;


    const profiles =
        await loadProfiles();


    const fragment =
        document.createDocumentFragment();


    for(
        const message of data
    ){

        const row =
            createMessageElement(
                message,
                profiles
            );


        fragment.appendChild(
            row
        );

    }


    messages.appendChild(
        fragment
    );


    /*
       媒体全部异步加载
    */

    data.forEach(
        function(message){

            hydrateMessageMedia(
                message,
                profiles
            );

        }
    );


    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =========================================================
   加载旧消息
========================================================= */

async function loadOlderMessages(){

    if(
        loadingOlderMessages ||
        !hasMoreMessages ||
        !oldestMessageTime
    ){

        return;

    }


    loadingOlderMessages =
        true;


    const oldHeight =
        messages.scrollHeight;


    const oldTop =
        messages.scrollTop;


    const loader =
        document.createElement(
            "div"
        );


    loader.className =
        "load-more show";


    loader.innerHTML =
        '<span class="load-more-text">加载更早消息...</span>';


    messages.insertBefore(
        loader,
        messages.firstChild
    );


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from(
                MESSAGE_TABLE
            )
            .select(
                "id,user_id,nickname,message,created_at,image_url,audio_url"
            )
            .lt(
                "created_at",
                oldestMessageTime
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            )
            .limit(50);


        loader.remove();


        if(error)
            throw error;


        if(
            !data ||
            data.length === 0
        ){

            hasMoreMessages =
                false;

            return;

        }


        if(
            data.length < 50
        ){

            hasMoreMessages =
                false;

        }


        data.reverse();


        oldestMessageTime =
            data[0].created_at;


        const profiles =
            await loadProfiles();


        const fragment =
            document.createDocumentFragment();


        for(
            const message of data
        ){

            const row =
                createMessageElement(
                    message,
                    profiles
                );


            fragment.appendChild(
                row
            );

        }


        messages.insertBefore(
            fragment,
            messages.firstChild
        );


        data.forEach(
            function(message){

                hydrateMessageMedia(
                    message,
                    profiles
                );

            }
        );


        /*
           保持用户原来的滚动位置
        */

        requestAnimationFrame(
            function(){

                const newHeight =
                    messages.scrollHeight;


                messages.scrollTop =
                    oldTop +
                    (
                        newHeight -
                        oldHeight
                    );

            }
        );


    }catch(error){

        console.error(
            "加载旧消息失败:",
            error
        );

        loader.remove();

    }finally{

        loadingOlderMessages =
            false;

    }

}

/* =========================================================
   Profiles
========================================================= */

async function loadProfiles(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from(
            PROFILE_TABLE
        )
        .select(
            "id,nickname,avatar_url"
        );


    if(error){

        console.error(
            "读取用户资料失败:",
            error
        );

        return {
            byId:new Map(),
            byNickname:new Map()
        };

    }


    const byId =
        new Map();


    const byNickname =
        new Map();


    (data || []).forEach(
        function(profile){

            if(profile.id){

                byId.set(
                    profile.id,
                    profile
                );

            }


            if(
                profile.nickname &&
                !byNickname.has(
                    profile.nickname
                )
            ){

                byNickname.set(
                    profile.nickname,
                    profile
                );

            }

        }
    );


    return {
        byId,
        byNickname
    };

}

function createDefaultAvatar(
    name
){

    const letter =
        (name || "?")
            .charAt(0)
            .toUpperCase();


    const svg =
        `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="80"
            height="80">

            <rect
                width="80"
                height="80"
                rx="40"
                fill="#5865f2"/>

    return(

    );

/* =========================================================
   创建消息 DOM
========================================================= */

function createMessageElement(
    message,
    profiles
){

    hideEmpty();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    row.dataset.messageId =
        String(message.id);


    const profile =
        (
            message.user_id
            ?
            profiles.byId.get(
                message.user_id
            )
            :
            profiles.byNickname.get(
                message.nickname
            )
        )
        ||
        (
            currentUser &&
            message.user_id ===
            currentUser.id
            ?
            currentProfile
            :
            null
        );


    const isMine =
        currentUser &&
        (
            message.user_id ===
            currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                currentProfile.nickname
            )
        );


    if(isMine){

        row.classList.add(
            "mine"
        );

    }


    /*
       头像
    */

    const avatar =
        document.createElement(
            "img"
        );


    avatar.className =
        "message-avatar";


    avatar.alt =
        "头像";


    avatar.src =
        createDefaultAvatar(
            message.nickname
        );


    if(
        profile &&
        profile.avatar_url
    ){

        getPrivateFileUrl(
            AVATAR_BUCKET,
            profile.avatar_url
        )
        .then(
            function(url){

                if(url){

                    avatar.src =
                        url;

                }

            }
        );

    }


    /*
       主体
    */

    const body =
        document.createElement(
            "div"
        );


    body.className =
        "message-body";


    /*
       昵称
    */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "nickname";


    name.textContent =
        message.nickname ||
        "匿名";


    /*
       气泡
    */

    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    /*
       图片
    */

    if(message.image_url){

        bubble.classList.add(
            "image-bubble"
        );


        if(
            message.image_url.startsWith(
                "blob:"
            )
        ){

            const img =
                document.createElement(
                    "img"
                );


            img.className =
                "chat-image";


            img.src =
                message.image_url;


            img.alt =
                "聊天图片";


            img.onclick =
                function(){

                    openImageViewer(
                        img.src
                    );

                };


            bubble.appendChild(
                img
            );


        }else{

            const loading =
                document.createElement(
                    "div"
                );


            loading.className =
                "image-loading";


            loading.textContent =
                "图片加载中...";


            bubble.appendChild(
                loading
            );

        }


    /*
       语音
    */

    }else if(message.audio_url){

        bubble.classList.add(
            "audio-bubble"
        );


        if(
            message.audio_url.startsWith(
                "blob:"
            )
        ){

            const audio =
                document.createElement(
                    "audio"
                );


            audio.className =
                "audio-player";


            audio.controls =
                true;


            audio.src =
                message.audio_url;


            bubble.appendChild(
                audio
            );


        }else{

            const loading =
                document.createElement(
                    "div"
                );


            loading.className =
                "audio-loading";


            loading.textContent =
                "🔊 语音加载中...";


            bubble.appendChild(
                loading
            );

        }


    /*
       文字
    */

    }else{

        bubble.textContent =
            message.message ||
            "";

    }


    /*
       时间
    */

    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.textContent =
        formatTime(
            message.created_at
        );


    /*
       发送中
    */

    if(message.pending){

        row.classList.add(
            "pending"
        );


        const pending =
            document.createElement(
                "div"
            );


        pending.className =
            "pending-text";


        pending.textContent =
            "发送中...";


        body.appendChild(
            pending
        );

    }


    body.insertBefore(
        name,
        body.firstChild
    );


    body.appendChild(
        bubble
    );


    body.appendChild(
        time
    );


    row.appendChild(
        avatar
    );


    row.appendChild(
        body
    );


    return row;

}


/* =========================================================
   异步加载图片 / 语音
========================================================= */

async function hydrateMessageMedia(
    message,
    profiles
){

    const row =
        messages.querySelector(
            '[data-message-id="' +
            String(message.id) +
            '"]'
        );


    if(!row)
        return;


    const bubble =
        row.querySelector(
            ".bubble"
        );


    if(!bubble)
        return;


    /*
       图片
    */

    if(message.image_url){

        if(
            message.image_url.startsWith(
                "blob:"
            )
        ){

            return;

        }


        const url =
            await getPrivateFileUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );


        if(!url)
            return;


        const img =
            document.createElement(
                "img"
            );


        img.className =
            "chat-image";


        img.src =
            url;


        img.alt =
            "聊天图片";


        img.loading =
            "lazy";


        img.onclick =
            function(){

                openImageViewer(
                    url
                );

            };


        bubble.innerHTML =
            "";


        bubble.appendChild(
            img
        );


        img.addEventListener(
            "load",
            function(){

                if(isNearBottom()){

                    forceScrollToBottom();

                }

            }
        );


        return;

    }


    /*
       语音
    */

    if(message.audio_url){

        if(
            message.audio_url.startsWith(
                "blob:"
            )
        ){

            return;

        }


        const url =
            await getPrivateFileUrl(
                AUDIO_BUCKET,
                message.audio_url
            );


        if(!url)
            return;


        const audio =
            document.createElement(
                "audio"
            );


        audio.className =
            "audio-player";


        audio.controls =
            true;


        audio.preload =
            "metadata";


        audio.src =
            url;


        bubble.innerHTML =
            "";


        bubble.appendChild(
            audio
        );

    }

}


/* =========================================================
   时间
========================================================= */

function formatTime(
    value
){

    if(!value)
        return "";


    const date =
        new Date(
            value
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

/* =========================================================
   发送限制
========================================================= */

function checkRateLimit(){

    const now =
        Date.now();


    sentMessageTimes =
        sentMessageTimes.filter(
            function(time){

                return(
                    now - time <
                    60000
                );

            }
        );


    if(
        sentMessageTimes.length >=
        40
    ){

        return false;

    }


    sentMessageTimes.push(
        now
    );


    return true;

}

   生成临时 ID
========================================================= */

function temporaryId(){

        "temp-" +
        Date.now() +
        "-" +

            .toString(36)
            .slice(2)
    );

}


/* =========================================================
   发送文字
========================================================= */

async function sendMessage(){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;

    }


    const text =
        messageInput.value.trim();


    if(!text)
        return;


    if(text.length > 1500){

        alert(
            "一条消息最多 1500 个字符。"
        );

        return;

    }


    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请一分钟后再继续发送。"
        );

        return;

    }


    const wasAtBottom =
        isNearBottom();


    const tempId =
        temporaryId();


    const tempMessage = {

        id:
            tempId,

        user_id:
            currentUser.id,

        nickname:
            currentProfile.nickname,

        message:
            text,

        created_at:
            new Date().toISOString(),

        image_url:
            null,

        audio_url:
            null,

        pending:
            true

    };


    /*
       立即显示
    */

    messageInput.value =
        "";


    updateComposerState();


    const profiles = {

        byId:
            new Map([
                [
                    currentUser.id,
                    currentProfile
                ]
            ]),

        byNickname:
            new Map([
                [
                    currentProfile.nickname,
                    currentProfile
                ]
            ])

    };


    const row =
        createMessageElement(
            tempMessage,
            profiles
        );


    row.dataset.tempId =
        tempId;


    messages.appendChild(
        row
    );


    if(wasAtBottom){

        forceScrollToBottom();

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .from(
                MESSAGE_TABLE
            )
            .insert({

                user_id:
                    currentUser.id,

                nickname:
                    currentProfile.nickname,

                message:
                    text,

                image_url:
                    null,

                audio_url:
                    null

            })
            .select(
                "id,user_id,nickname,message,created_at,image_url,audio_url"
            )
            .single();


        if(error)
            throw error;


        /*
           删除临时消息
        */

        const tempRow =
            messages.querySelector(
                '[data-temp-id="' +
                tempId +
                '"]'
            );


        if(tempRow){

            tempRow.remove();

        }


        /*
           Realtime 会跳过自己的消息
           所以这里自己渲染正式消息
        */

        if(data){

            const realRow =
                createMessageElement(
                    data,
                    profiles
                );


            messages.appendChild(
                realRow
            );


            hydrateMessageMedia(
                data,
                profiles
            );


            if(wasAtBottom){

                forceScrollToBottom();

            }

        }


    }catch(error){

        const tempRow =
            messages.querySelector(
                '[data-temp-id="' +
                tempId +
                '"]'
            );


        if(tempRow){

            tempRow.remove();

        }


        console.error(
            "发送消息失败:",
            error
        );


        alert(
            "发送失败：\n" +
            error.message
        );

    }

}

/* =========================================================
   图片压缩
========================================================= */

async function compressChatImage(
    file
){

    /*
       GIF 不压缩，避免动画 GIF 变成静态图
    */

    if(
        file.type ===
        "image/gif"
    ){

        return {
            blob:file,
            extension:"gif",
            type:"image/gif"
        };

    }


    const maxWidth =
        1600;


    const maxHeight =
        1600;


    const bitmap =
        await createImageBitmap(
            file
        );


    let width =
        bitmap.width;


    let height =
        bitmap.height;


    const scale =
        Math.min(
            1,
            maxWidth / width,
            maxHeight / height
        );


    width =
        Math.round(
            width * scale
        );


    height =
        Math.round(
            height * scale
        );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width;


    canvas.height =
        height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
    );


    bitmap.close();


    const blob =
        await new Promise(
            function(resolve){

                canvas.toBlob(
                    resolve,
                    "image/webp",
                    .82
                );

            }
        );


    if(!blob)
        throw new Error(
            "图片压缩失败"
        );


    return {

        blob,

        extension:
            "webp",

        type:
            "image/webp"

    };

}


/* =========================================================
   图片上传
========================================================= */

async function uploadImageFast(
    file
){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;

    }


    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;

    }


    const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"

    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        alert(
            "只支持 JPG、PNG、GIF、WEBP。"
        );

        return;

    }


    if(
        file.size >
        20 * 1024 * 1024
    ){

        alert(
            "原始图片不能超过 20MB。"
        );

        return;

    }


    const wasAtBottom =
        isNearBottom();


    const tempId =
        temporaryId();


    const previewUrl =
        URL.createObjectURL(
            file
        );


    /*
       立即显示图片
    */

    const tempMessage = {

        id:
            tempId,

        user_id:
            currentUser.id,

        nickname:
            currentProfile.nickname,

        message:"",

        created_at:
            new Date().toISOString(),

        image_url:
            previewUrl,

        audio_url:
            null,

        pending:true

    };


    const profiles = {

        byId:
            new Map([
                [
                    currentUser.id,
                    currentProfile
                ]
            ]),

        byNickname:
            new Map([
                [
                    currentProfile.nickname,
                    currentProfile
                ]
            ])

    };


    const row =
        createMessageElement(
            tempMessage,
            profiles
        );


    row.dataset.tempId =
        tempId;


    messages.appendChild(
        row
    );


    if(wasAtBottom){

        forceScrollToBottom();

    }


    try{

        showToast(
            "正在压缩图片..."
        );


        const compressed =
            await compressChatImage(
                file
            );


        const fileName =
            currentUser.id +
            "_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,8) +
            "." +
            compressed.extension;


        showToast(
            "正在发送图片..."
        );


        const {
            error:uploadError
        } =
        await supabaseClient.storage
            .from(
                CHAT_IMAGE_BUCKET
            )
            .upload(
                fileName,
                compressed.blob,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:
                        compressed.type
                }
            );


        if(uploadError)
            throw uploadError;


        const {
            data,
            error
        } =
        await supabaseClient
            .from(
                MESSAGE_TABLE
            )
            .insert({

                user_id:
                    currentUser.id,

                nickname:
                    currentProfile.nickname,

                message:"",

                image_url:
                    fileName,

                audio_url:
                    null

            })
            .select(
                "id,user_id,nickname,message,created_at,image_url,audio_url"
            )
            .single();


        if(error)
            throw error;


        const tempRow =
            messages.querySelector(
                '[data-temp-id="' +
                tempId +
                '"]'
            );


        if(tempRow){

            tempRow.remove();

        }


        URL.revokeObjectURL(
            previewUrl
        );


        if(data){

            const realRow =
                createMessageElement(
                    data,
                    profiles
                );


            messages.appendChild(
                realRow
            );


            hydrateMessageMedia(
                data,
                profiles
            );


            if(wasAtBottom){

                forceScrollToBottom();

            }

        }


        showToast(
            "图片已发送"
        );


    }catch(error){

        console.error(
            "图片发送失败:",
            error
        );


        const tempRow =
            messages.querySelector(
                '[data-temp-id="' +
                tempId +
                '"]'
            );


        if(tempRow){

            tempRow.remove();

        }


        URL.revokeObjectURL(
            previewUrl
        );


        alert(
            "图片发送失败：\n" +
            error.message
        );

    }

}


/* =========================================================
   语音 MIME
========================================================= */

function getBestAudioType(){

    if(
        !window.MediaRecorder ||
        !MediaRecorder.isTypeSupported
    ){

        return "";

    }


    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/mp4",

        "audio/ogg;codecs=opus",

        "audio/ogg"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   音频扩展名
========================================================= */

function audioExtension(
    mime
){

    mime =
        (
            mime ||
            ""
        )
        .toLowerCase();


    if(
        mime.includes(
            "mp4"
        )
    ){

        return "m4a";

    }


    if(
        mime.includes(
            "ogg"
        )
    ){

        return "ogg";

    }


    if(
        mime.includes(
            "aac"
        )
    ){

        return "aac";

    }


    return "webm";

}

/* =========================================================
   开始录音
========================================================= */

async function beginVoiceRecording(
    event
){

    event.preventDefault();

    event.stopPropagation();


    if(recorder)
        return;


    if(
        !currentUser ||
        !currentProfile
    ){

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices
            .getUserMedia
    ){

        alert(
            "你的浏览器不支持麦克风录音。"
        );

        closeRecordingUI();

        return;

    }


    try{

        recorderStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true
                    }

                });


        recorderMime =
            getBestAudioType();


        recorder =
            recorderMime
            ?
            new MediaRecorder(
                recorderStream,
                {
                    mimeType:
                        recorderMime
                }
            )
            :
            new MediaRecorder(
                recorderStream
            );


        recorderChunks =
            [];


        cancellingRecording =
            false;


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recorderChunks.push(
                        event.data
                    );

                }

            };


        recorder.onerror =
            function(event){

                console.error(
                    "录音错误:",
                    event.error
                );

                cancelVoiceRecording();

            };


        recorder.onstop =
            async function(){

                const mime =
                    recorder.mimeType ||
                    recorderMime ||
                    "audio/webm";


                const blob =
                    new Blob(
                        recorderChunks,
                        {
                            type:mime
                        }
                    );


                if(
                    recorderStream
                ){

                    recorderStream
                        .getTracks()
                        .forEach(
                            function(track){

                                track.stop();

                            }
                        );

                }


                recorder =
                    null;


                recorderStream =
                    null;


                recorderChunks =
                    [];


                const cancelled =
                    cancellingRecording;


                closeRecordingUI();


                if(
                    !cancelled &&
                    blob.size > 0
                ){

                    await uploadAudioFast(
                        blob,
                        mime
                    );

                }

            };


        recorder.start(
            200
        );


        recordingStartedAt =
            Date.now();


        voiceOverlay.classList.add(
            "recording"
        );


        voiceHold.classList.add(
            "recording"
        );


        voiceHoldText.textContent =
            "正在录音";


        updateVoiceTime();


        recordingInterval =
            setInterval(
                updateVoiceTime,
                200
            );


    }catch(error){

        console.error(
            "麦克风错误:",
            error
        );


        if(
            recorderStream
        ){

            recorderStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        recorderStream =
            null;


        closeRecordingUI();


        alert(
            "无法使用麦克风：\n" +
            error.message
        );

    }

}


/* =========================================================
   录音时间
========================================================= */

function updateVoiceTime(){

    if(!recordingStartedAt)
        return;


    const seconds =
        Math.floor(
            (
                Date.now() -
                recordingStartedAt
            ) /
            1000
        );


    const minutes =
        Math.floor(
            seconds /
            60
        );


    const remain =
        seconds %
        60;


    voiceTime.textContent =
        String(minutes)
            .padStart(
                2,
                "0"
            )
        +
        ":"
        +
        String(remain)
            .padStart(
                2,
                "0"
            );

}


/* =========================================================
   松开 → 发送
========================================================= */

function finishVoiceRecording(
    event
){

    event.preventDefault();

    event.stopPropagation();


    if(!recorder)
        return;


    cancellingRecording =
        false;


    if(
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }

}


/* =========================================================
   取消录音
========================================================= */

function cancelVoiceRecording(
    event
){

    if(event){

        event.preventDefault();

        event.stopPropagation();

    }


    cancellingRecording =
        true;


    if(
        recorder &&
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }else{

        closeRecordingUI();

    }

}

/* =========================================================
   Realtime
========================================================= */

function subscribeToMessages(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel =
            null;

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "my-chat-messages-v2"
            )
            .on(

                "postgres_changes",

                {
                    event:"INSERT",

                    schema:"public",

                    table:
                        MESSAGE_TABLE

                },

                async function(payload){

                    /*
                       自己发的消息已经立即显示
                       所以 Realtime 不再重复显示
                    */

                    if(
                        currentUser &&
                        payload.new.user_id ===
                        currentUser.id
                    ){

                        return;

                    }


                    /*
                       防止重复
                    */

                    const existing =
                        messages.querySelector(
                            '[data-message-id="' +
                            String(
                                payload.new.id
                            ) +
                            '"]'
                        );


                    if(existing)
                        return;


                    const profiles =
                        await loadProfiles();


                    const stick =
                        isNearBottom();


                    const row =
                        createMessageElement(
                            payload.new,
                            profiles
                        );


                    messages.appendChild(
                        row
                    );


                    hydrateMessageMedia(
                        payload.new,
                        profiles
                    );


                    if(stick){

                        forceScrollToBottom();

                    }

                }

            )
            .subscribe(
                function(status){

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at top left, #283c86, transparent 40%),
        radial-gradient(circle at bottom right, #45a247, transparent 40%),
        #10131c;

    min-height: 100vh;
    color: white;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

/* 首页 */

#homePage {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.home-card {
    width: 100%;
    max-width: 500px;

    padding: 50px 35px;

    text-align: center;

    border-radius: 28px;

    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.35);
}

.logo {
    width: 80px;
    height: 80px;

    margin: 0 auto 25px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 24px;

    font-size: 38px;

    background:
        linear-gradient(135deg,#667eea,#764ba2);

    box-shadow:
        0 15px 35px rgba(118,75,162,0.4);
}

.home-card h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.home-card p {
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
    margin-bottom: 35px;
}

.primary-button {
    width: 100%;

    border: none;
    border-radius: 15px;

    padding: 16px 20px;

    color: white;
    font-weight: 700;
    font-size: 16px;

    background:
        linear-gradient(135deg,#667eea,#764ba2);

    box-shadow:
        0 10px 25px rgba(118,75,162,0.35);

    transition: 0.2s;
}

.primary-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 15px 30px rgba(118,75,162,0.5);
}

/* 聊天页面 */

#chatPage {
    display: none;

    height: 100vh;

    padding: 20px;
}

.chat-container {
    width: 100%;
    max-width: 1000px;

    height: calc(100vh - 40px);

    margin: auto;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    border-radius: 24px;

    background: rgba(15,18,28,0.85);

    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 25px 80px rgba(0,0,0,0.4);
}

.chat-header {
    min-height: 75px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 22px;

    border-bottom:
        1px solid rgba(255,255,255,0.08);
}

.chat-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.chat-icon {
    width: 45px;
    height: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 14px;

    background:
        linear-gradient(135deg,#667eea,#764ba2);
}

.chat-title h2 {
    font-size: 18px;
}

.status {
    font-size: 12px;
    color: #7ee787;
    margin-top: 3px;
}

.back-button {
    border: none;

    padding: 9px 13px;

    border-radius: 10px;

    background: rgba(255,255,255,0.08);
    color: white;
}

.back-button:hover {
    background: rgba(255,255,255,0.15);
}

/* 消息 */

#messages {
    flex: 1;

    overflow-y: auto;

    padding: 25px;
}

.message {
    display: flex;
    margin-bottom: 18px;
}

.message.mine {
    justify-content: flex-end;
}

.message-content {
    max-width: 75%;
}

.nickname {
    font-size: 12px;

    color: rgba(255,255,255,0.55);

    margin-bottom: 5px;
}

.mine .nickname {
    text-align: right;
}

.bubble {
    padding: 11px 15px;

    border-radius: 17px;

    background: rgba(255,255,255,0.10);

    word-break: break-word;

    line-height: 1.5;
}

.mine .bubble {
    background:
        linear-gradient(135deg,#667eea,#764ba2);
}

.time {
    font-size: 10px;

    margin-top: 5px;

    color: rgba(255,255,255,0.35);
}

.mine .time {
    text-align: right;
}

.empty {
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    color: rgba(255,255,255,0.35);

    text-align: center;
}

/* 图片 */

.chat-image {
    display: block;

    max-width: 320px;
    max-height: 400px;

    width: auto;
    height: auto;

    border-radius: 14px;

    cursor: pointer;

    object-fit: contain;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25);

    transition: 0.2s;
}

.chat-image:hover {
    transform: scale(1.02);
}

.image-bubble {
    padding: 5px;
}

/* 输入区域 */

.input-area {
    display: flex;
    gap: 10px;

    padding: 15px;

    border-top:
        1px solid rgba(255,255,255,0.08);
}

#messageInput {
    flex: 1;

    min-width: 0;

    border: 1px solid rgba(255,255,255,0.1);

    outline: none;

    padding: 13px 15px;

    border-radius: 14px;

    color: white;

    background: rgba(255,255,255,0.07);
}

#messageInput::placeholder {
    color: rgba(255,255,255,0.35);
}

#imageButton {
    width: 50px;

    border: none;

    border-radius: 14px;

    color: white;

    font-size: 20px;

    background: rgba(255,255,255,0.08);
}

#imageButton:hover {
    background: rgba(255,255,255,0.15);
}

#sendButton {
    width: 90px;

    border: none;
    border-radius: 14px;

    color: white;
    font-weight: 700;

    background:
        linear-gradient(135deg,#667eea,#764ba2);
}

#sendButton:disabled,
#imageButton:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#imageInput {
    display: none;
}

/* 图片查看 */

#imageViewer {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0,0,0,0.88);

    z-index: 999;
}

#imageViewer img {
    max-width: 95vw;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 10px;
}

#closeViewer {
    position: absolute;

    top: 20px;
    right: 25px;

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.15);

    color: white;

    font-size: 28px;
}

/* 昵称弹窗 */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0,0,0,0.65);

    z-index: 100;
}

.modal-card {
    width: 100%;
    max-width: 400px;

    padding: 30px;

    border-radius: 22px;

    background: #181c28;

    border:
        1px solid rgba(255,255,255,0.1);
}

.modal-card h2 {
    margin-bottom: 10px;
}

.modal-card p {
    color: rgba(255,255,255,0.55);

    font-size: 14px;

    margin-bottom: 20px;
}

#nicknameInput {
    width: 100%;

    padding: 14px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,0.1);

    outline: none;

    background: rgba(255,255,255,0.07);

    color: white;

    margin-bottom: 15px;
}

#nicknameInput::placeholder {
    color: rgba(255,255,255,0.35);
}

/* 手机 */

@media (max-width:600px) {

    #chatPage {
        padding: 0;
    }

    .chat-container {
        height: 100vh;
        border-radius: 0;
    }

    .home-card {
        padding: 40px 25px;
    }

    .home-card h1 {
        font-size: 34px;
    }

    #messages {
        padding: 18px;
    }

    .message-content {
        max-width: 85%;
    }

    .chat-header {
        padding: 12px 15px;
    }

    #sendButton {
        width: 70px;
    }

    #imageButton {
        width: 48px;
    }

    .chat-image {
        max-width: 250px;
        max-height: 350px;
    }
}
</style>
</head>

<body>

<!-- 首页 -->

<section id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            现在免费开始，未来慢慢升级。
        </p>

        <button
            class="primary-button"
            onclick="openNicknameModal()">
            进入多人聊天室
        </button>

    </div>

</section>


<!-- 聊天页面 -->

<section id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>多人聊天室</h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <button
                class="back-button"
                onclick="backHome()">
                返回
            </button>

        </header>


        <main id="messages">

            <div class="empty" id="emptyMessage">
                暂时还没有消息<br>
                成为第一个发言的人吧！
            </div>

        </main>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="输入消息..."
                autocomplete="off"
            >

            <input
                id="imageInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
            >

            <button
                id="imageButton"
                onclick="document.getElementById('imageInput').click()"
                title="发送图片">
                📷
            </button>

            <button
                id="sendButton"
                onclick="sendMessage()">
                发送
            </button>

        </div>

    </div>

</section>


<!-- 昵称 -->

<div class="modal" id="nicknameModal">

    <div class="modal-card">

        <h2>进入聊天室</h2>

        <p>
            输入一个昵称，你不需要注册账号。
        </p>

        <input
            id="nicknameInput"
            type="text"
            maxlength="30"
            placeholder="例如：Justin"
            autocomplete="off"
        >

        <button
            class="primary-button"
            onclick="enterChat()">
            进入聊天室
        </button>

    </div>

</div>


<!-- 图片放大 -->

<div
    id="imageViewer"
    onclick="closeImageViewer()">

    <button
        id="closeViewer"
        onclick="closeImageViewer(event)">
        ×
    </button>

    <img
        id="viewerImage"
        src=""
        alt="图片"
        onclick="event.stopPropagation()"
    >

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
    "https://fhkqnknpmdddiehpktnu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_3p3PR-D3GUy5BRhQDl57AA__4Gbg388";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   配置
========================= */

let nickname = "";

const messageTable = "chat_msg";

const storageBucket = "chat-images";


/* =========================
   页面元素
========================= */

const homePage =
    document.getElementById("homePage");

const chatPage =
    document.getElementById("chatPage");

const nicknameModal =
    document.getElementById("nicknameModal");

const nicknameInput =
    document.getElementById("nicknameInput");

const messageInput =
    document.getElementById("messageInput");

const messages =
    document.getElementById("messages");

const sendButton =
    document.getElementById("sendButton");

const imageButton =
    document.getElementById("imageButton");

const imageInput =
    document.getElementById("imageInput");


/* =========================
   昵称窗口
========================= */

function openNicknameModal() {

    nicknameModal.style.display = "flex";

    nicknameInput.focus();
}


/* =========================
   进入聊天室
========================= */

async function enterChat() {

    const name =
        nicknameInput.value.trim();

    if (!name) {

        alert("请输入昵称");

        nicknameInput.focus();

        return;
    }

    nickname = name;

    nicknameModal.style.display = "none";

    homePage.style.display = "none";

    chatPage.style.display = "block";

    await loadMessages();

    subscribeToMessages();

    messageInput.focus();
}


/* =========================
   返回首页
========================= */

function backHome() {

    chatPage.style.display = "none";

    homePage.style.display = "flex";
}


/* =========================
   加载历史消息
========================= */

async function loadMessages() {

    const { data, error } =
        await supabaseClient
            .from(messageTable)
            .select("*")
            .order("create_at", {
                ascending: true
            });

    if (error) {

        console.error(
            "加载消息失败:",
            error
        );

        alert(
            "加载聊天记录失败，请检查 Supabase 权限。"
        );

        return;
    }

    messages.innerHTML = "";

    if (!data || data.length === 0) {

        showEmpty();

        return;
    }

    data.forEach(message => {

        renderMessage(message);

    });

    scrollToBottom();
}


/* =========================
   空消息
========================= */

function showEmpty() {

    messages.innerHTML = `
        <div class="empty" id="emptyMessage">
            暂时还没有消息<br>
            成为第一个发言的人吧！
        </div>
    `;
}


function hideEmpty() {

    const empty =
        document.getElementById("emptyMessage");

    if (empty) {
        empty.remove();
    }
}


/* =========================
   判断图片
========================= */

function isImageMessage(content) {

    if (!content) {
        return false;
    }

    return (
        content.startsWith("https://") &&
        content.includes(
            "/storage/v1/object/public/"
        )
    );
}


/* =========================
   显示消息
========================= */

function renderMessage(message) {

    hideEmpty();

    const wrapper =
        document.createElement("div");

    wrapper.className = "message";

    if (
        message.send_name === nickname
    ) {

        wrapper.classList.add("mine");
    }


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const name =
        document.createElement("div");

    name.className = "nickname";

    name.textContent =
        message.send_name || "匿名";


    const bubble =
        document.createElement("div");

    bubble.className = "bubble";


    /* 图片 */

    if (isImageMessage(message.content)) {

        bubble.classList.add(
            "image-bubble"
        );

        const img =
            document.createElement("img");

        img.className =
            "chat-image";

        img.src =
            message.content;

        img.alt =
            "聊天图片";

        img.loading =
            "lazy";

        img.onclick = function() {

            openImageViewer(
                message.content
            );

        };

        bubble.appendChild(img);

    }

    /* 文字 */

    else {

        bubble.textContent =
            message.content || "";

    }


    const time =
        document.createElement("div");

    time.className = "time";

    time.textContent =
        formatTime(message.create_at);


    content.appendChild(name);

    content.appendChild(bubble);

    content.appendChild(time);

    wrapper.appendChild(content);

    messages.appendChild(wrapper);

    scrollToBottom();
}


/* =========================
   时间
========================= */

function formatTime(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================
   滚动
========================= */

function scrollToBottom() {

    setTimeout(() => {

        messages.scrollTop =
            messages.scrollHeight;

    }, 50);
}


/* =========================
   发送文字
========================= */

async function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text) {
        return;
    }

    sendButton.disabled = true;

    const { error } =
        await supabaseClient
            .from(messageTable)
            .insert({
                send_name: nickname,
                content: text
            });

    sendButton.disabled = false;

    if (error) {

        console.error(
            "发送消息失败:",
            error
        );

        alert(
            "发送失败：\n" +
            error.message
        );

        return;
    }

    messageInput.value = "";

    messageInput.focus();
}


/* =========================
   选择图片
========================= */

imageInput.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }

        await uploadImage(file);

        this.value = "";
    }
);


/* =========================
   上传图片
========================= */

async function uploadImage(file) {

    /* 最大 10MB */

    const maxSize =
        10 * 1024 * 1024;

    if (file.size > maxSize) {

        alert(
            "图片太大，请选择 10MB 以下的图片。"
        );

        return;
    }


    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];

    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "只支持 JPG、PNG、GIF、WEBP 图片。"
        );

        return;
    }


    imageButton.disabled = true;

    imageButton.textContent = "⏳";


    try {

        /* 创建唯一文件名 */

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,10) +
            "." +
            extension;


        /* 上传 Storage */

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from(storageBucket)
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false,
                        contentType: file.type
                    }
                );


        if (uploadError) {

            console.error(
                "图片上传失败:",
                uploadError
            );

            alert(
                "图片上传失败：\n" +
                uploadError.message
            );

            return;
        }


        /* 获取图片 URL */

        const { data } =
            supabaseClient
                .storage
                .from(storageBucket)
                .getPublicUrl(fileName);


        const imageUrl =
            data.publicUrl;


        /* 写入聊天数据库 */

        const { error: insertError } =
            await supabaseClient
                .from(messageTable)
                .insert({
                    send_name: nickname,
                    content: imageUrl
                });


        if (insertError) {

            console.error(
                "图片消息保存失败:",
                insertError
            );

            alert(
                "图片已经上传，但消息保存失败：\n" +
                insertError.message
            );

            return;
        }

    } catch (error) {

        console.error(
            "发送图片错误:",
            error
        );

        alert(
            "发送图片时发生错误。"
        );

    } finally {

        imageButton.disabled = false;

        imageButton.textContent = "📷";
    }
}


/* =========================
   实时消息
========================= */

function subscribeToMessages() {

    supabaseClient
        .channel("chat-room")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: messageTable
            },
            payload => {

                renderMessage(
                    payload.new
                );

            }
        )
        .subscribe();
}


/* =========================
   图片查看
========================= */

function openImageViewer(url) {

    const viewer =
        document.getElementById(
            "imageViewer"
        );

    const viewerImage =
        document.getElementById(
            "viewerImage"
        );

    viewerImage.src = url;

    viewer.style.display = "flex";
}


function closeImageViewer(event) {

    if (event) {
        event.stopPropagation();
    }

    const viewer =
        document.getElementById(
            "imageViewer"
        );

    const viewerImage =
        document.getElementById(
            "viewerImage"
        );

    viewer.style.display = "none";

    viewerImage.src = "";
}


/* =========================
   回车发送
========================= */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================
   昵称回车
========================= */

nicknameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            enterChat();
        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0b0d12;
    color: #fff;
    -webkit-text-size-adjust: 100%;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

input {
    -webkit-appearance: none;
    appearance: none;
}

/* =========================
   首页
========================= */

#homePage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: auto;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card {
    width: 100%;
    max-width: 460px;
    padding: 50px 38px;
    text-align: center;
    border-radius: 18px;
    background: #15171d;
    border: 1px solid #252832;
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
}

.logo {
    width: 82px;
    height: 82px;
    margin: 0 auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    font-size: 38px;
    background: #5865f2;
    box-shadow: 0 15px 35px rgba(88,101,242,.35);
}

.home-card h1 {
    font-size: 40px;
    margin-bottom: 12px;
}

.home-card p {
    color: #a6a8b0;
    line-height: 1.7;
    margin-bottom: 30px;
}

.primary-button {
    width: 100%;
    border: none;
    border-radius: 4px;
    padding: 14px 20px;
    color: white;
    font-weight: 700;
    background: #5865f2;
}

.primary-button:hover {
    background: #4752c4;
}

.primary-button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* =========================
   登录 / 注册
========================= */

.page {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: auto;
    background: #0b0d12;
}

.auth-card {
    width: 100%;
    max-width: 430px;
    padding: 32px;
    border-radius: 8px;
    background: #15171d;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1 {
    text-align: center;
    font-size: 25px;
    margin-bottom: 8px;
}

.auth-subtitle {
    text-align: center;
    color: #a6a8b0;
    font-size: 14px;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #b5bac1;
    margin-bottom: 8px;
}

.form-input {
    width: 100%;
    border: none;
    outline: none;
    padding: 13px;
    border-radius: 4px;
    color: white;
    background: #0f1116;
    border: 1px solid #252832;
}

.form-input:focus {
    border-color: #5865f2;
}

.auth-link {
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    color: #a6a8b0;
}

.auth-link button {
    border: none;
    background: none;
    color: #5865f2;
    font-weight: 600;
}

.auth-error {
    display: none;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 4px;
    background: rgba(237,66,69,.12);
    color: #f38688;
    font-size: 13px;
}

.auth-success {
    display: none;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 4px;
    background: rgba(35,165,90,.12);
    color: #57d48b;
    font-size: 13px;
}

.code-row {
    display: flex;
    gap: 8px;
}

.code-row .form-input {
    flex: 1;
    letter-spacing: 5px;
    text-align: center;
    font-size: 18px;
}

.code-button {
    width: 125px;
    flex-shrink: 0;
    border: none;
    border-radius: 4px;
    background: #4f545c;
    color: white;
    font-size: 13px;
}

.code-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================
   头像
========================= */

.avatar-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 25px;
}

.avatar-preview {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    background: #5865f2;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    margin-bottom: 12px;
    border: 3px solid #2b2e35;
}

.avatar-upload input {
    display: none;
}

.avatar-button {
    border: none;
    background: #4f545c;
    color: white;
    padding: 8px 14px;
    border-radius: 4px;
    font-size: 13px;
}

/* =========================
   聊天页面
========================= */

#chatPage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: none;
    overflow: hidden;
    background: #111318;
}

.chat-container {
    width: 100%;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* =========================
   顶部
========================= */

.chat-header {
    height: 64px;
    min-height: 64px;
    flex: 0 0 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: #15171d;
    border-bottom: 1px solid #252832;

    z-index: 50;
}

.chat-title {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.chat-icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;
    background: #5865f2;
}

.chat-title h2 {
    font-size: 16px;
}

.status {
    font-size: 11px;
    color: #23a55a;
    margin-top: 2px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.current-user {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #dbdee1;
    font-size: 13px;
}

.header-avatar {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: 50%;
    object-fit: cover;
    background: #5865f2;
}

.logout-button {
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    background: #2b2e35;
    color: #dbdee1;
    font-size: 13px;
}

.logout-button:hover {
    background: #ed4245;
}

/* =========================
   消息区域
========================= */

#messages {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;

    overflow-x: hidden;
    overflow-y: auto;

    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;

    padding: 25px;

    background: #111318;

    overflow-anchor: none;
}

/* =========================
   消息
========================= */

.message {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    width: 100%;
}

.message.mine {
    flex-direction: row-reverse;
}

.message-avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #5865f2;
}

.message-body {
    max-width: 75%;
    min-width: 0;
}

.message.mine .message-body {
    text-align: right;
}

.nickname {
    font-size: 13px;
    color: #b5bac1;
    margin-bottom: 4px;
    font-weight: 600;
}

.bubble {
    display: inline-block;
    max-width: 100%;
    padding: 9px 13px;
    border-radius: 8px;
    background: #1e2128;
    color: #dbdee1;
    line-height: 1.5;
    word-break: break-word;
    overflow-wrap: anywhere;
    text-align: left;
}

.mine .bubble {
    background: #5865f2;
    color: white;
}

.bubble.image-bubble {
    padding: 0 !important;
    background: transparent !important;
    border-radius: 8px;
    overflow: hidden;
    line-height: 0;
}

.chat-image {
    display: block;
    max-width: 320px;
    max-height: 400px;
    width: auto;
    height: auto;
    border-radius: 8px;
    object-fit: contain;
    cursor: pointer;
}

.chat-image:hover {
    opacity: .92;
}

/* =========================
   语音消息
========================= */

.bubble.voice-bubble {
    padding: 8px 10px;
    min-width: 190px;
}

.voice-message {
    display: flex;
    align-items: center;
    gap: 10px;
}

.voice-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.14);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
}

.voice-player {
    width: 160px;
    height: 34px;
    display: block;
}

.time {
    font-size: 10px;
    margin-top: 4px;
    color: #6d717a;
}

.empty {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #6d717a;
    text-align: center;
    line-height: 1.8;
}

/* =========================
   底部输入区
========================= */

.input-area {
    width: 100%;
    min-height: 72px;
    flex: 0 0 auto;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));

    background: #15171d;
    border-top: 1px solid #252832;

    z-index: 100;

    position: relative;
}

/* 左边 + */

#plusButton {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;

    border: none;
    border-radius: 50%;

    background: #2b2e35;
    color: #dbdee1;

    font-size: 27px;
    font-weight: 300;

    display: flex;
    align-items: center;
    justify-content: center;

    line-height: 1;
}

#plusButton:hover {
    background: #40444b;
}

/* 中间输入框 */

.message-input-wrapper {
    flex: 1 1 auto;
    min-width: 0;

    height: 44px;

    display: flex;
    align-items: center;

    border-radius: 8px;
    background: #1e2128;

    overflow: hidden;
}

#messageInput {
    width: 100%;
    height: 44px;

    border: none;
    outline: none;

    padding: 0 14px;

    color: white;
    background: transparent;

    font-size: 15px;
}

#messageInput::placeholder {
    color: #6d717a;
}

/* 右边功能 */

.input-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
}

.input-action-button {
    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: transparent;
    color: #b5bac1;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
}

.input-action-button:hover {
    background: #2b2e35;
    color: white;
}

/* 纸飞机 */

#sendButton {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;

    border: none;
    border-radius: 50%;

    background: #5865f2;
    color: white;

    display: none;
    align-items: center;
    justify-content: center;

    font-size: 21px;

    transform: rotate(-8deg);
}

#sendButton:hover {
    background: #4752c4;
}

#sendButton:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================
   隐藏文件选择
========================= */

#imageInput {
    display: none;
}

#voiceInput {
    display: none;
}

/* =========================
   + 菜单
========================= */

#plusMenu {
    position: absolute;

    left: 14px;
    bottom: calc(100% + 8px);

    width: 190px;

    padding: 8px;

    border-radius: 12px;

    background: #1e2128;
    border: 1px solid #30333b;

    box-shadow: 0 15px 45px rgba(0,0,0,.45);

    display: none;

    z-index: 300;
}

.plus-menu-item {
    width: 100%;
    height: 45px;

    border: none;
    border-radius: 8px;

    background: transparent;
    color: #dbdee1;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 0 12px;

    text-align: left;
}

.plus-menu-item:hover {
    background: #2b2e35;
}

.plus-menu-icon {
    width: 28px;
    text-align: center;
    font-size: 20px;
}

/* =========================
   表情面板
========================= */

#emojiPanel {
    position: absolute;

    right: 16px;
    bottom: calc(100% + 8px);

    width: min(340px, calc(100vw - 24px));
    height: 280px;

    border-radius: 14px;

    background: #181a20;
    border: 1px solid #30333b;

    box-shadow: 0 20px 55px rgba(0,0,0,.5);

    display: none;

    z-index: 300;

    overflow: hidden;
}

.emoji-header {
    height: 46px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    border-bottom: 1px solid #2b2e35;

    color: #b5bac1;
    font-size: 13px;
    font-weight: 700;

    flex-shrink: 0;
}

#emojiGrid {
    height: calc(100% - 46px);

    overflow-y: auto;
    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;

    padding: 10px;

    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-content: start;

    scrollbar-width: thin;
}

.emoji-item {
    width: 100%;
    height: 42px;

    border: none;
    background: transparent;

    border-radius: 7px;

    font-size: 23px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.emoji-item:hover {
    background: #2b2e35;
}

/* =========================
   录音状态
========================= */

#recordingOverlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.48);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 500;
}

.recording-box {
    width: 240px;

    padding: 28px 20px;

    border-radius: 18px;

    background: #181a20;

    text-align: center;

    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

.recording-mic {
    width: 68px;
    height: 68px;

    margin: 0 auto 16px;

    border-radius: 50%;

    background: #5865f2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;

    animation: recordingPulse 1.2s infinite;
}

.recording-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 7px;
}

.recording-time {
    color: #a6a8b0;
    font-size: 13px;
}

.recording-cancel {
    margin-top: 18px;

    border: none;

    padding: 9px 18px;

    border-radius: 7px;

    background: #2b2e35;
    color: #dbdee1;
}

@keyframes recordingPulse {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.08);
        opacity: .8;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* =========================
   图片查看器
========================= */

#imageViewer {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background: rgba(0,0,0,.9);

    z-index: 9999;
}

#viewerImage {
    max-width: 95vw;
    max-height: 90vh;

    border-radius: 8px;

    object-fit: contain;
}

#closeViewer {
    position: absolute;
    top: 20px;
    right: 25px;

    width: 45px;
    height: 45px;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.15);

    color: white;
    font-size: 28px;
}

/* =========================
   手机
========================= */

@media (max-width: 600px) {

    #chatPage,
    .chat-container {
        height: 100dvh;
        min-height: 100dvh;
        max-height: 100dvh;
    }

    .home-card {
        padding: 40px 25px;
    }

    .home-card h1 {
        font-size: 34px;
    }

    .auth-card {
        padding: 25px 20px;
    }

    .page {
        padding: 12px;
    }

    .chat-header {
        height: 58px;
        min-height: 58px;
        flex-basis: 58px;
        padding: 0 12px;
    }

    .chat-icon {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
    }

    .chat-title h2 {
        font-size: 15px;
    }

    #messages {
        padding: 18px 12px;
    }

    .message {
        gap: 9px;
    }

    .message-avatar {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
    }

    .message-body {
        max-width: 80%;
    }

    .chat-image {
        max-width: 250px;
        max-height: 350px;
    }

    .input-area {
        min-height: 64px;
        padding: 9px 10px;
        padding-bottom: max(9px, env(safe-area-inset-bottom));
    }

    #plusButton {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
    }

    .message-input-wrapper {
        height: 42px;
    }

    #messageInput {
        height: 42px;
        font-size: 15px;
    }

    .input-action-button,
    #sendButton {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
    }

    .current-user span {
        display: none;
    }

    .logout-button {
        padding: 7px 9px;
    }

    #emojiPanel {
        right: 10px;
        width: calc(100vw - 20px);
        height: 250px;
    }

    #emojiGrid {
        grid-template-columns: repeat(7, 1fr);
    }

    .voice-player {
        width: 145px;
    }
}

@media (max-width: 380px) {

    #plusButton {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
    }

    .input-action-button,
    #sendButton {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
    }

    .message-body {
        max-width: 78%;
    }
}

.chat-header,
.input-area,
.chat-icon,
.status,
.logout-button,
#plusButton,
#sendButton,
.input-action-button {
    user-select: none;
}
</style>
</head>

<body>

<!-- =========================
     首页
========================= -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">💬</div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">
            开始聊天
        </button>

    </div>

</div>

<!-- =========================
     登录
========================= -->

<div id="loginPage" class="page">

    <div class="auth-card">

        <h1>欢迎回来</h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div id="loginError" class="auth-error"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">
            登录
        </button>

        <div class="auth-link">
            还没有账号？
            <button onclick="openRegisterPage()">
                创建账号
            </button>
        </div>

        <div class="auth-link">
            <button onclick="backToHome()">
                返回首页
            </button>
        </div>

    </div>

</div>

<!-- =========================
     注册
========================= -->

<div id="registerPage" class="page">

    <div class="auth-card">

        <h1>创建账号</h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div id="registerError" class="auth-error"></div>

        <div id="registerSuccess" class="auth-success"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password">

        </div>

        <div class="form-group">

            <label>8位验证码</label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="8位验证码"

async function initializeApp() {

            await loadCurrentProfile();

            if (currentProfile) {

        hideAllPages();

        homePage.style.display = "flex";
    }

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            if (event === "SIGNED_OUT") {

                currentUser = null;
                currentProfile = null;

                if (realtimeChannel) {

                    await supabaseClient
                        .removeChannel(

        await loadCurrentProfile();

/* =====================================================
   验证码
===================================================== */

async function sendRegisterCode() {

    hideMessage("registerError");
    hideMessage("registerSuccess");

    if (codeCooldown > 0) {

        showError(
            "registerError",
            "请等待 " +
            codeCooldown +
            " 秒。"
        );

        return;
    }

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    if (!email) {

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;
    }

    if (password.length < 6) {

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;
    }

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    button.disabled = true;
    button.textContent = "发送中...";

    try {

        const { error } =
            await supabaseClient.auth
                .signInWithOtp({
                    email,
                    options: {
                        shouldCreateUser: true
                    }
                });

        if (error)
            throw error;

        showSuccess(
            "registerSuccess",
            "验证码已经发送到你的邮箱。"
        );

        startCodeCooldown();

    } catch (error) {

        console.error(error);

        button.disabled = false;
        button.textContent = "获取验证码";

        showError(
            "registerError",
            "验证码发送失败：" +
            error.message
        );
    }
}

function startCodeCooldown() {

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";

    clearInterval(codeTimer);

    codeTimer =
        setInterval(function() {

            codeCooldown--;

            if (codeCooldown <= 0) {

                clearInterval(codeTimer);

                codeCooldown = 0;

                button.disabled = false;

                button.textContent =
                    "获取验证码";

                return;
            }

            button.textContent =
                codeCooldown +
                " 秒后重试";

        }, 1000);
}

async function verifyRegisterCode() {

    hideMessage("registerError");

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const token =
        document
            .getElementById("registerCode")
            .value
            .trim();

    if (!email) {

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;
    }

    if (password.length < 6) {

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;
    }

    if (!/^\d{8}$/.test(token)) {

        showError(
            "registerError",
            "请输入完整的8位验证码。"
        );

        return;
    }

    const button =
        document.getElementById(
            "verifyButton"
        );

    button.disabled = true;
    button.textContent = "验证中...";

    try {

        const { data, error } =
            await supabaseClient.auth
                .verifyOtp({
                    email,
                    token,
                    type: "email"
                });

        if (error)
            throw error;

        currentUser = data.user;

        const { error: passwordError } =
            await supabaseClient.auth
                .updateUser({
                    password
                });

        if (passwordError)
            throw passwordError;

        openProfilePage();

    } catch (error) {

        console.error(error);

        showError(
            "registerError",
            "验证码验证失败：" +
            error.message
        );

    } finally {

        button.disabled = false;
        button.textContent =
            "验证并继续";
    }
}

/* =====================================================

===================================================== */

function previewAvatar(event) {

    const file =
        event.target.files[0];

    if (!file)
        return;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

        alert(
            "头像只支持 JPG、PNG、GIF、WEBP。"
        );

        event.target.value = "";

        return;
    }

    if (file.size > 5 * 1024 * 1024) {

        alert(
            "头像不能超过 5MB。"
        );

        event.target.value = "";

        return;
    }

    temporaryAvatarFile = file;

    const url =
        URL.createObjectURL(file);

    const preview =
        document.getElementById(
            "avatarPreview"
        );

    const defaultAvatar =
        document.getElementById(
            "avatarDefault"
        );

    preview.src = url;

    preview.style.display = "block";

    defaultAvatar.style.display = "none";
}

   完善资料
===================================================== */

async function finishProfile() {

    hideMessage("profileError");

    if (!currentUser) {

        showError(
            "profileError",
            "登录状态已经失效，请重新登录。"
        );

        return;
    }

    const nickname =
        document

    if (!nickname) {

        showError(

        );

    }

    const button =
        document.getElementById(
            "finishProfileButton"
        );

    button.disabled = true;
    button.textContent =
        "正在创建资料...";

    let avatarUrl = null;

    try {

        if (temporaryAvatarFile) {

            const extension =
                temporaryAvatarFile.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =
                currentUser.id +
                "_" +
                Date.now() +
                "." +
                extension;

            const { error: uploadError } =
                await supabaseClient.storage
                    .from(AVATAR_BUCKET)
                    .upload(
                        fileName,
                        temporaryAvatarFile,
                        {
                            cacheControl: "3600",
                            upsert: false,

                                temporaryAvatarFile.type
                        }

                throw uploadError;

        }

                });

        );

    } finally {

        button.disabled = false;

        button.textContent =
            "完成注册并进入聊天";
    }
}

/* =====================================================
   私有图片 / 文件 URL
===================================================== */

async function getPrivateFileUrl(
    bucket,
    path
) {

    if (!path)
        return null;

    if (
        path.startsWith("http://") ||
        path.startsWith("https://")
    ) {
        return path;
    }

    const cacheKey =
        bucket + ":" + path;

    if (imageUrlCache.has(cacheKey)) {

        const cached =
            imageUrlCache.get(cacheKey);

        if (
            cached.expires >
            Date.now()
        ) {

            return cached.url;
        }
    }

    const { data, error } =
        await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(
                path,
                3600
            );

    if (error) {

        console.error(
            "生成文件地址失败：",
            error
        );

        return null;
    }

    imageUrlCache.set(
        cacheKey,
        {
            url: data.signedUrl,
            expires: Date.now() + 3500000
        }
    );

    return data.signedUrl;
}

async function getPrivateImageUrl(
    bucket,
    path
) {
    return getPrivateFileUrl(
        bucket,
        path
    );
}

        console.error(
            "读取头像资料失败：",
            profileError
        );
    }

    const profileById =
        new Map();

    const profileByNickname =
        new Map();

    if (profiles) {

        profiles.forEach(
            function(profile) {

                if (profile.id) {

                    profileById.set(
                        profile.id,
                        profile
                    );
                }

                if (
                    profile.nickname &&
                    !profileByNickname.has(
                        profile.nickname
                    )
                ) {

                    profileByNickname.set(
                        profile.nickname,
                        profile
                    );
                }
            }
        );
    }

    for (const message of data) {

        await renderMessage(
            message,
            profileById,
            profileByNickname
        );
    }

    forceScrollToBottom();

    setTimeout(
        forceScrollToBottom,
        100
    );

    setTimeout(
        forceScrollToBottom,
        500
    );
}

function createDefaultAvatar(name) {

    const letter =
        (name || "?")
            .charAt(0)
            .toUpperCase();

    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg"
              width="80"
              height="80">

            <rect
                width="80"
                height="80"
                rx="40"
                fill="#5865f2"/>

                x="50%"
                y="55%"
                text-anchor="middle"
                dominant-baseline="middle"

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}

/* =====================================================
   显示消息
===================================================== */

async function renderMessage(
    message,
    profileById = null,
    profileByNickname = null
) {

    hideEmpty();

    const row =
        document.createElement("div");

    row.className = "message";

    const isMine =
        currentUser &&
        (
            message.user_id ===
            currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                currentProfile.nickname
            )
        );

    if (isMine)
        row.classList.add("mine");

    let profile = null;

    if (
        message.user_id &&
        profileById
    ) {

        profile =
            profileById.get(
                message.user_id
            ) || null;
    }

    if (
        !profile &&
        profileByNickname
    ) {

        profile =
            profileByNickname.get(
                message.nickname
            ) || null;
    }

    if (
        isMine &&
        currentProfile
    ) {

        profile =
            currentProfile;
    }

    const avatar =
        document.createElement("img");

    avatar.className =
        "message-avatar";

    avatar.alt = "头像";

    if (
        profile &&
        profile.avatar_url
    ) {

        const avatarUrl =
            await getPrivateImageUrl(
                AVATAR_BUCKET,
                profile.avatar_url
            );

        avatar.src =
            avatarUrl ||
            createDefaultAvatar(
                message.nickname
            );

    } else {

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );
    }

    const body =
        document.createElement("div");

    body.className =
        "message-body";

    const name =
        document.createElement("div");

    name.className =
        "nickname";

    name.textContent =
        message.nickname ||
        "匿名";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    /* =========================
       图片
    ========================= */

    if (message.image_url) {

        bubble.classList.add(
            "image-bubble"
        );

        const img =
            document.createElement("img");

        img.className =
            "chat-image";

        const imageUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );

        if (imageUrl) {

            img.src =
                imageUrl;

            img.alt =
                "聊天图片";

            img.loading =
                "lazy";

            img.onclick =
                function() {

                    openImageViewer(
                        imageUrl
                    );
                };

            bubble.appendChild(img);

            img.addEventListener(
                "load",
                function() {

                    forceScrollToBottom();

                }
            );

        } else {

            bubble.textContent =
                "[图片无法加载]";
        }

    /* =========================
       语音
    ========================= */

    } else if (message.voice_url) {

        bubble.classList.add(
            "voice-bubble"
        );

        const voiceWrap =
            document.createElement("div");

        voiceWrap.className =
            "voice-message";

        const icon =
            document.createElement("button");

        icon.className =
            "voice-icon";

        icon.textContent =
            "▶";

        const voiceUrl =
            await getPrivateFileUrl(
                VOICE_BUCKET,
                message.voice_url
            );

        if (voiceUrl) {

            const audio =
                document.createElement("audio");

            audio.className =
                "voice-player";

            audio.controls = true;

            audio.preload =
                "metadata";

            audio.src =
                voiceUrl;

            icon.onclick =
                function() {

                    if (audio.paused) {

                        audio.play();

                    } else {

                        audio.pause();
                    }
                };

            voiceWrap.appendChild(icon);
            voiceWrap.appendChild(audio);

        } else {

            voiceWrap.textContent =
                "[语音无法加载]";
        }

        bubble.appendChild(
            voiceWrap
        );

    /* =========================
       文字
    ========================= */

    } else {

        bubble.textContent =
            message.message || "";
    }

    const time =
        document.createElement("div");

    time.className = "time";

    time.textContent =
        formatTime(
            message.created_at
        );

    body.appendChild(name);
    body.appendChild(bubble);
    body.appendChild(time);

    row.appendChild(avatar);
    row.appendChild(body);

    messages.appendChild(row);
}

/* =====================================================
   时间
===================================================== */

function formatTime(value) {

    if (!value)
        return "";

    const date =
        new Date(value);

    if (isNaN(date.getTime()))
        return "";

    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

   强制滚到底部

function forceScrollToBottom() {

    requestAnimationFrame(
        function() {

            messages.scrollTop =
                messages.scrollHeight;

        }
    );
}

/* =====================================================
   发送限制
===================================================== */

function checkRateLimit() {

    const now =
        Date.now();

    sentMessageTimes =
        sentMessageTimes.filter(
            function(time) {

                return (
                    now - time < 60000
                );

            }
        );

    if (
        sentMessageTimes.length >= 40
    ) {

        return false;
    }

    sentMessageTimes.push(now);

    return true;
}

/* =====================================================
   发送文字
===================================================== */

async function sendMessage() {

    if (
        !currentUser ||
        !currentProfile
    ) {

        openLoginPage();

        return;
    }

    const text =
        messageInput.value.trim();

    if (!text)
        return;

    if (text.length > 1500) {

        alert(
            "一条消息最多 1500 个字符。"
        );

        return;
    }

    if (!checkRateLimit()) {

        alert(
            "发送太频繁了，请一分钟后再继续发送。"
        );

        return;
    }

    sendButton.disabled = true;

    try {

        const { data, error } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:
                        text,

                    image_url:
                        null,

                    voice_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url,voice_url"
                )
                .single();

        if (error)
            throw error;

        messageInput.value = "";

        updateInputButtons();

        if (data) {

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }

    } catch (error) {

        console.error(
            "发送消息失败：",
            error
        );

        alert(
            "发送失败：\n" +
            error.message
        );

    } finally {

        sendButton.disabled = false;

        if (window.innerWidth > 600) {

            messageInput.focus();
        }
    }
}

/* =====================================================
   上传图片
===================================================== */

async function uploadImage(file) {

    if (
        !currentUser ||
        !currentProfile
    ) {

        openLoginPage();

        return;
    }

    if (!checkRateLimit()) {

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;
    }

    const maxSize =
        5 * 1024 * 1024;

    if (file.size > maxSize) {

        alert(
            "图片不能超过 5MB。"
        );

        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];

    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "只支持 JPG、PNG、GIF、WEBP。"
        );

        return;
    }

    try {

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            currentUser.id +
            "_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            extension;

        const { error: uploadError } =
            await supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false,
                        contentType:
                            file.type
                    }
                );

        if (uploadError)
            throw uploadError;

        const { data, error } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message: "",

                    image_url:
                        fileName,

                    voice_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url,voice_url"
                )
                .single();

        if (error)
            throw error;

        if (data) {

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }

    } catch (error) {

        console.error(
            "图片发送失败：",
            error
        );

        alert(
            "图片发送失败：\n" +
            error.message
        );
    }
}

/* =====================================================
   语音录音
===================================================== */

async function toggleRecording() {

    if (mediaRecorder &&
        mediaRecorder.state === "recording") {

        stopRecording(false);

        return;
    }

    await startRecording();
}

async function startRecording() {

    if (
        !currentUser ||
        !currentProfile
    ) {

        openLoginPage();

        return;
    }

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "你的浏览器不支持语音录音。"
        );

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioChunks = [];

        recordingCancelled = false;

        let options = {};

        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            options.mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            options.mimeType =
                "audio/webm";
        }

        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );

        mediaRecorder.ondataavailable =
            function(event) {

                if (event.data.size > 0) {

                    audioChunks.push(
                        event.data
                    );
                }
            };

        mediaRecorder.onstop =
            async function() {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                clearRecordingTimer();

                hideRecordingOverlay();

                if (
                    recordingCancelled
                ) {

                    audioChunks = [];

                    return;
                }

                const mimeType =
                    mediaRecorder.mimeType ||
                    "audio/webm";

                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type: mimeType
                        }
                    );

                audioChunks = [];

                if (blob.size > 5 * 1024 * 1024) {

                    alert(
                        "语音不能超过 5MB。"
                    );

                    return;
                }

                await uploadVoice(
                    blob,
                    mimeType
                );
            };

        mediaRecorder.start();

        recordingSeconds = 0;

        updateRecordingTime();

        recordingTimer =
            setInterval(
                function() {

                    recordingSeconds++;

                    updateRecordingTime();

                    if (
                        recordingSeconds >= 60
                    ) {

                        stopRecording(false);
                    }

                },
                1000
            );

        showRecordingOverlay();

    } catch (error) {

        console.error(
            "录音失败：",
            error
        );

        alert(
            "无法使用麦克风：\n" +
            error.message
        );
    }
}

function stopRecording(cancelled) {

    if (
        !mediaRecorder ||
        mediaRecorder.state !== "recording"
    ) {

        return;
    }

    recordingCancelled =
        !!cancelled;

    mediaRecorder.stop();
}

function cancelRecording() {

    stopRecording(true);
}

function showRecordingOverlay() {

    document
        .getElementById(
            "recordingOverlay"
        )
        .style.display = "flex";
}

function hideRecordingOverlay() {

    document
        .getElementById(
            "recordingOverlay"
        )
        .style.display = "none";
}

function updateRecordingTime() {

    const minutes =
        Math.floor(
            recordingSeconds / 60
        )
        .toString()
        .padStart(2, "0");

    const seconds =
        (
            recordingSeconds % 60
        )
        .toString()
        .padStart(2, "0");

    document
        .getElementById(
            "recordingTime"
        )
        .textContent =
        minutes + ":" + seconds;
}

function clearRecordingTimer() {

    if (recordingTimer) {

        clearInterval(
            recordingTimer
        );

        recordingTimer = null;
    }
}

/* =====================================================
   Realtime
===================================================== */

function subscribeToMessages() {

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }

    realtimeChannel =
        supabaseClient
            .channel(
                "messages-realtime"
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: MESSAGE_TABLE
                },
                async function(payload) {

                    if (
                        currentUser &&
                        payload.new.user_id ===
                        currentUser.id
                    ) {

                        return;
                    }

                    let profileMap =
                        new Map();

                    let nicknameMap =
                        new Map();

                    if (
                        payload.new.user_id
                    ) {

                        const { data } =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "id",
                                    payload.new.user_id
                                )
                                .maybeSingle();

                        if (data) {

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }

                    } else {

                        const { data } =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "nickname",
                                    payload.new.nickname
                                )
                                .maybeSingle();

                        if (data) {

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }
                    }

                    await renderMessage(
                        payload.new,
                        profileMap,
                        nicknameMap
                    );

                    forceScrollToBottom();
                }
            )
            .subscribe(
                function(status) {

                    console.log(
                        "Realtime:",
                        status
                    );
                }
            );
}

    "🌊","🍎","🍉","🍓","🍕","🍔","🍟",
    "🌭","🍿","🍩","🍪","🎂","🍰","☕",
    "🍺","⚽","🏀","🏈","🎮","🎵","🎶",
    "❤️","🧡","💛","💚","💙","💜","🖤",
    "🤍","🤎","💔","❣️","💕","💞","💓",
    "💗","💖","💘","💝","💟","👍","👎",
    "👌","✌️","🤞","🤟","🤘","👏","🙌",
    "🙏","💪","👋","🤝","🫶","💯","🎉",
    "🎊","✅","❌","❗","❓","‼️","⁉️"
];

function initializeEmojiPanel() {

    const grid =
        document.getElementById(
            "emojiGrid"
        );

    emojiList.forEach(
        function(emoji) {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "emoji-item";

            button.textContent =
                emoji;

            button.onclick =
                function() {

                    insertEmoji(
                        emoji
                    );
                };

            grid.appendChild(button);
        }
    );
}

function insertEmoji(emoji) {

    const input =
        messageInput;

    const start =
        input.selectionStart ??
        input.value.length;

    const end =
        input.selectionEnd ??
        input.value.length;

    input.value =
        input.value.substring(
            0,
            start
        ) +
        emoji +
        input.value.substring(
            end
        );

    input.focus();

    const position =
        start + emoji.length;

    input.setSelectionRange(
        position,
        position
    );

    updateInputButtons();
}

function toggleEmojiPanel() {

    const visible =
        emojiPanel.style.display === "block";

    closePlusMenu();

    emojiPanel.style.display =
        visible
            ? "none"
            : "block";
}

function closeEmojiPanel() {

    emojiPanel.style.display =
        "none";
}

function closeMenus() {

    closePlusMenu();
    closeEmojiPanel();
}

/* =====================================================
   点击其他地方关闭菜单
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                "#plusMenu"
            ) &&
            !event.target.closest(
                "#plusButton"
            )
        ) {

            closePlusMenu();
        }

        if (
            !event.target.closest(
                "#emojiPanel"
            ) &&
            !event.target.closest(
                "#emojiButton"
            )
        ) {

            closeEmojiPanel();
        }
    }
);

/* =====================================================
   回车发送
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);

/* =====================================================
   输入文字时改变右侧按钮
===================================================== */

messageInput.addEventListener(
    "input",
    function() {

        updateInputButtons();
    }
);

/* =====================================================
   验证码只能数字
===================================================== */

document
    .getElementById("registerCode")
    .addEventListener(
        "input",
        function() {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 8);
        }
    );

/* =====================================================
   防止手机输入框导致页面缩放
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();
    }
);

document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();
    }
);

document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();
    }
);

/* =====================================================
   启动
===================================================== */

initializeEmojiPanel();

updateInputButtons();

initializeApp();

</script>

</body>
</html>

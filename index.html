<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0b0d12;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

/* =========================
   首页
========================= */

#homePage{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card{
    width:100%;
    max-width:460px;
    padding:50px 38px;
    text-align:center;
    border-radius:18px;
    background:#15171d;
    border:1px solid #252832;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:38px;
    background:#5865f2;
    box-shadow:0 15px 35px rgba(88,101,242,.35);
}

.home-card h1{
    font-size:40px;
    margin-bottom:12px;
}

.home-card p{
    color:#a6a8b0;
    line-height:1.7;
    margin-bottom:30px;
}

.primary-button{
    width:100%;
    border:0;
    border-radius:6px;
    padding:14px 20px;
    color:white;
    font-weight:700;
    background:#5865f2;
}

.primary-button:hover{
    background:#4752c4;
}

/* =========================
   页面 / 登录
========================= */

.page{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;
    background:#0b0d12;
}

.auth-card{
    width:100%;
    max-width:430px;
    padding:32px;
    border-radius:10px;
    background:#15171d;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#a6a8b0;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#b5bac1;
    margin-bottom:8px;
}

.form-input{
    width:100%;
    border:1px solid #252832;
    outline:none;
    padding:13px;
    border-radius:5px;
    color:white;
    background:#0f1116;
}

.form-input:focus{
    border-color:#5865f2;
}

.auth-link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#a6a8b0;
}

.auth-link button{
    border:0;
    background:none;
    color:#5865f2;
    font-weight:600;
}

.auth-error,
.auth-success{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    font-size:13px;
}

.auth-error{
    background:rgba(237,66,69,.12);
    color:#f38688;
}

.auth-success{
    background:rgba(35,165,90,.12);
    color:#57d48b;
}

.code-row{
    display:flex;
    gap:8px;
}

.code-row .form-input{
    flex:1;
    letter-spacing:4px;
    text-align:center;
}

.code-button{
    width:125px;
    flex-shrink:0;
    border:0;
    border-radius:5px;
    background:#4f545c;
    color:white;
    font-size:13px;
}

/* =========================
   头像
========================= */

.avatar-upload{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.avatar-preview{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin-bottom:12px;
    border:3px solid #2b2e35;
}

.avatar-upload input{
    display:none;
}

.avatar-button{
    border:0;
    background:#4f545c;
    color:white;
    padding:8px 14px;
    border-radius:5px;
    font-size:13px;
}

/* =========================
   聊天页面
========================= */

#chatPage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    display:none;
    overflow:hidden;
    background:#111318;
}

.chat-container{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   顶部
========================= */

.chat-header{
    height:64px;
    min-height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#15171d;
    border-bottom:1px solid #252832;

    z-index:20;
}

.chat-title{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.chat-icon{
    width:38px;
    height:38px;
    flex:0 0 38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;
    background:#5865f2;
}

.chat-title h2{
    font-size:16px;
}

.status{
    font-size:11px;
    color:#23a55a;
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.current-user{
    display:flex;
    align-items:center;
    gap:8px;
    color:#dbdee1;
    font-size:13px;
}

.header-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.logout-button{
    border:0;
    border-radius:5px;
    padding:8px 12px;
    background:#2b2e35;
    color:#dbdee1;
    font-size:13px;
}

.logout-button:hover{
    background:#ed4245;
}

/* =========================
   消息
========================= */

#messages{
    flex:1 1 auto;
    min-height:0;
    width:100%;

    overflow-x:hidden;
    overflow-y:auto;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;

    padding:25px;

    background:#111318;
    overflow-anchor:none;
}

.message{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    width:100%;
}

.message.mine{
    flex-direction:row-reverse;
}

.message-avatar{
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.message-body{
    max-width:75%;
    min-width:0;
}

.message.mine .message-body{
    text-align:right;
}

.nickname{
    font-size:13px;
    color:#b5bac1;
    margin-bottom:4px;
    font-weight:600;
}

.bubble{
    display:inline-block;
    max-width:100%;
    padding:9px 13px;
    border-radius:8px;
    background:#1e2128;
    color:#dbdee1;
    line-height:1.5;
    word-break:break-word;
    overflow-wrap:anywhere;
    text-align:left;
}

.mine .bubble{
    background:#5865f2;
    color:white;
}

.bubble.image-bubble{
    padding:0 !important;
    background:transparent !important;
    border-radius:8px;
    overflow:hidden;
    line-height:0;
}

.chat-image{
    display:block;
    max-width:320px;
    max-height:400px;
    width:auto;
    height:auto;
    border-radius:8px;
    object-fit:contain;
    cursor:pointer;
}

.time{
    font-size:10px;
    margin-top:4px;
    color:#6d717a;
}

.empty{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#6d717a;
    text-align:center;
    line-height:1.8;
}

/* =========================
   输入区域
========================= */

.input-area{
    position:relative;
    width:100%;
    min-height:78px;
    flex:0 0 auto;

    display:flex;
    align-items:center;

    padding:12px 20px;
    padding-bottom:max(12px,env(safe-area-inset-bottom));

    background:#15171d;
    border-top:1px solid #252832;

    z-index:30;
}

.composer{
    width:100%;
    max-width:1100px;
    margin:0 auto;

    min-height:48px;

    display:flex;
    align-items:center;

    background:#1e2128;
    border-radius:9px;

    padding:0 7px;
}

/* 左边 + */

.plus-button{
    width:40px;
    height:40px;
    flex:0 0 40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    background:transparent;
    color:#b5bac1;

    font-size:27px;
    font-weight:300;
    line-height:1;
}

.plus-button:hover{
    color:#fff;
    background:#2b2e35;
}

/* 中间输入框 */

#messageInput{
    flex:1 1 auto;
    min-width:0;

    height:46px;

    border:0;
    outline:0;

    padding:12px 8px;

    background:transparent;
    color:#fff;

    font-size:15px;
}

#messageInput::placeholder{
    color:#6d717a;
}

/* 右侧按钮 */

.composer-right{
    display:flex;
    align-items:center;
    gap:2px;

    flex:0 0 auto;
}

/* emoji */

.tool-button{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    background:transparent;
    color:#b5bac1;
}

.tool-button:hover{
    background:#2b2e35;
    color:#fff;
}

/* 麦克风 SVG */

.mic-icon{
    width:21px;
    height:21px;
}

/* 纸飞机 */

.send-icon{
    width:21px;
    height:21px;
}

/* =========================
   Emoji 面板
========================= */

#emojiPanel{
    position:absolute;

    right:20px;
    bottom:88px;

    width:330px;
    height:300px;

    display:none;

    background:#181a20;
    border:1px solid #2b2e35;
    border-radius:10px;

    box-shadow:0 15px 45px rgba(0,0,0,.5);

    z-index:100;
}

.emoji-header{
    height:45px;
    display:flex;
    align-items:center;

    padding:0 14px;

    border-bottom:1px solid #2b2e35;

    color:#b5bac1;
    font-size:13px;
    font-weight:600;
}

.emoji-grid{
    height:255px;

    padding:10px;

    display:grid;
    grid-template-columns:repeat(7,1fr);
    align-content:start;

    overflow-y:auto;
    overflow-x:hidden;

    overscroll-behavior:contain;
}

.emoji-grid::-webkit-scrollbar{
    width:7px;
}

.emoji-grid::-webkit-scrollbar-track{
    background:transparent;
}

.emoji-grid::-webkit-scrollbar-thumb{
    background:#3a3d45;
    border-radius:10px;
}

.emoji-item{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:6px;

    background:transparent;

    font-size:23px;
}

.emoji-item:hover{
    background:#2b2e35;
}

/* =========================
   图片查看器
========================= */

#imageViewer{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.9);

    z-index:9999;
}

#viewerImage{
    max-width:95vw;
    max-height:90vh;
    border-radius:8px;
    object-fit:contain;
}

#closeViewer{
    position:absolute;
    top:20px;
    right:25px;

    width:45px;
    height:45px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.15);
    color:white;

    font-size:28px;
}

/* =========================
   手机
========================= */

@media(max-width:600px){

    #homePage{
        padding:12px;
    }

    .home-card{
        padding:40px 25px;
    }

    .home-card h1{
        font-size:34px;
    }

    .auth-card{
        padding:25px 20px;
    }

    .page{
        padding:12px;
    }

    .chat-header{
        height:58px;
        min-height:58px;
        flex-basis:58px;
        padding:0 12px;
    }

    .chat-icon{
        width:34px;
        height:34px;
        flex-basis:34px;
    }

    .chat-title h2{
        font-size:15px;
    }

    #messages{
        padding:18px 12px;
    }

    .message{
        gap:9px;
    }

    .message-avatar{
        width:36px;
        height:36px;
        flex-basis:36px;
    }

    .message-body{
        max-width:80%;
    }

    .chat-image{
        max-width:250px;
        max-height:350px;
    }

    .input-area{
        min-height:68px;
        padding:9px 10px;
        padding-bottom:max(9px,env(safe-area-inset-bottom));
    }

    .composer{
        min-height:46px;
        border-radius:9px;
    }

    #messageInput{
        height:44px;
        font-size:15px;
    }

    .plus-button,
    .tool-button{
        width:38px;
        height:38px;
        flex-basis:38px;
    }

    .current-user span{
        display:none;
    }

    .logout-button{
        padding:7px 9px;
    }

    #emojiPanel{
        left:10px;
        right:10px;
        bottom:77px;
        width:auto;
        height:285px;
    }

    .emoji-grid{
        height:240px;
        grid-template-columns:repeat(7,1fr);
    }
}

@media(max-width:380px){

    .plus-button,
    .tool-button{
        width:36px;
        height:36px;
        flex-basis:36px;
    }

    .message-body{
        max-width:78%;
    }

    #emojiPanel{
        left:7px;
        right:7px;
    }
}

.chat-header,
.input-area,
.composer,
button{
    user-select:none;
}
</style>
</head>

<body>

<!-- =========================
     首页
========================= -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">💬</div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">
            开始聊天
        </button>

    </div>

</div>


<!-- =========================
     登录
========================= -->

<div id="loginPage" class="page">

    <div class="auth-card">

        <h1>欢迎回来</h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div id="loginError" class="auth-error"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">
            登录
        </button>

        <div class="auth-link">
            还没有账号？
            <button onclick="openRegisterPage()">
                创建账号
            </button>
        </div>

        <div class="auth-link">
            <button onclick="backToHome()">
                返回首页
            </button>
        </div>

    </div>

</div>


<!-- =========================
     注册
========================= -->

<div id="registerPage" class="page">

    <div class="auth-card">

        <h1>创建账号</h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div id="registerError" class="auth-error"></div>

        <div id="registerSuccess" class="auth-success"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password">

        </div>

        <div class="form-group">

            <label>验证码</label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="验证码"
                    autocomplete="one-time-code">

                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendRegisterCode()">
                    获取验证码
                </button>

            </div>

        </div>

        <button
            id="verifyButton"
            class="primary-button"
            onclick="verifyRegisterCode()">
            验证并继续
        </button>

        <div class="auth-link">
            已经有账号？
            <button onclick="openLoginPage()">
                登录
            </button>
        </div>

    </div>

</div>


<!-- =========================
     完善资料
========================= -->

<div id="profilePage" class="page">

    <div class="auth-card">

        <h1>完善资料</h1>

        <div class="auth-subtitle">
            设置你的昵称和头像
        </div>

        <div id="profileError" class="auth-error"></div>

        <div class="avatar-upload">

            <img
                id="avatarPreview"
                class="avatar-preview"
                src=""
                alt="头像"
                style="display:none;">

            <div
                id="avatarDefault"
                class="avatar-preview">
                👤
            </div>

            <input
                id="avatarInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
                onchange="previewAvatar(event)">

            <button
                class="avatar-button"
                onclick="document.getElementById('avatarInput').click()">
                选择头像
            </button>

        </div>

        <div class="form-group">

            <label>昵称</label>

            <input
                id="profileNickname"
                class="form-input"
                type="text"
                maxlength="30"
                placeholder="例如：Justin"
                autocomplete="off">

        </div>

        <button
            id="finishProfileButton"
            class="primary-button"
            onclick="finishProfile()">
            完成注册并进入聊天
        </button>

    </div>

</div>


<!-- =========================
     聊天
========================= -->

<div id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>My Chat</h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <div class="header-right">

                <div class="current-user">

                    <img
                        id="currentUserAvatar"
                        class="header-avatar"
                        src=""
                        alt="头像">

                    <span id="currentUserName">
                        用户
                    </span>

                </div>

                <button
                    class="logout-button"
                    onclick="logoutUser()">
                    退出
                </button>

            </div>

        </header>


        <main id="messages">

            <div
                class="empty"
                id="emptyMessage">

                暂时还没有消息

                <br>

                成为第一个发言的人吧！

            </div>

        </main>


        <!-- Emoji 面板 -->

        <div id="emojiPanel">

            <div class="emoji-header">
                表情
            </div>

            <div
                id="emojiGrid"
                class="emoji-grid">
            </div>

        </div>


        <!-- Discord 风格输入栏 -->

        <div class="input-area">

            <div class="composer">

                <!-- 左边 + -->

                <button
                    id="plusButton"
                    class="plus-button"
                    title="添加">
                    +
                </button>

                <input
                    id="imageInput"
                    type="file"
                    accept="image/jpeg,image/png,image/gif,image/webp"
                    style="display:none;">


                <!-- 中间输入框 -->

                <input
                    id="messageInput"
                    type="text"
                    maxlength="1500"
                    placeholder="输入消息..."
                    autocomplete="off">


                <!-- 右边 -->

                <div
                    id="composerRight"
                    class="composer-right">

                    <!-- Emoji -->

                    <button
                        id="emojiButton"
                        class="tool-button"
                        title="表情">

                        <svg
                            width="21"
                            height="21"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round">

                            <circle
                                cx="12"
                                cy="12"
                                r="9.2"/>

                            <path d="M8 14.5c1 1.2 2.3 1.8 4 1.8s3-.6 4-1.8"/>

                            <circle
                                cx="9"
                                cy="9.5"
                                r=".7"
                                fill="currentColor"
                                stroke="none"/>

                            <circle
                                cx="15"

function startCodeCooldown(){

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";

    clearInterval(codeTimer);

    codeTimer =
        setInterval(function(){

            codeCooldown--;

            if(codeCooldown <= 0){

                clearInterval(codeTimer);

                codeCooldown = 0;

                button.disabled = false;

                button.textContent =
                    "获取验证码";

                return;
            }

            button.textContent =
                codeCooldown +
                " 秒后重试";

        },1000);
}

/* =====================================================
   图片 URL
===================================================== */

async function getPrivateImageUrl(
    bucket,
    path
){

    if(!path)
        return null;

    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }

    const cacheKey =
        bucket + ":" + path;

    if(imageUrlCache.has(cacheKey)){

        const cached =
            imageUrlCache.get(cacheKey);

        if(
            cached.expires >
            Date.now()
        ){

            return cached.url;
        }
    }

    const {data,error} =
        await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(
                path,
                3600
            );

    if(error){

        console.error(
            "生成图片地址失败：",
            error
        );

        return null;
    }

    imageUrlCache.set(
        cacheKey,
        {
            url:data.signedUrl,
            expires:Date.now() + 3500000
        }
    );

    return data.signedUrl;
}

async function loadMessages(){

    const {data,error} =
        await supabaseClient
            .from(MESSAGE_TABLE)
            .select(
                "id,user_id,nickname,message,created_at,image_url"
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );

    if(error){

        console.error(
            "读取历史消息失败：",
            error
        );

        messages.innerHTML = "";

        const errorBox =
            document.createElement("div");

        errorBox.className = "empty";

        errorBox.textContent =
            "读取聊天记录失败：" +
            error.message;

        messages.appendChild(errorBox);

        return;
    }

    messages.innerHTML = "";

    if(!data || data.length === 0){

        showEmpty();

        return;
    }

    const {
        data:profiles,
        error:profileError
    } =
        await supabaseClient
            .from(PROFILE_TABLE)
            .select(
                "id,nickname,avatar_url"
            );

    if(profileError){

        console.error(
            "读取头像资料失败：",
            profileError
        );
    }

    const profileById =
        new Map();

    const profileByNickname =
        new Map();

    if(profiles){

        profiles.forEach(
            function(profile){

                if(profile.id){

                    profileById.set(
                        profile.id,
                        profile
                    );
                }

                if(
                    profile.nickname &&
                    !profileByNickname.has(
                        profile.nickname
                    )
                ){

                    profileByNickname.set(
                        profile.nickname,
                        profile
                    );
                }

            }
        );
    }

    for(const message of data){

        await renderMessage(
            message,
            profileById,
            profileByNickname
        );
    }

    forceScrollToBottom();

    setTimeout(
        forceScrollToBottom,
        100
    );

    setTimeout(
        forceScrollToBottom,
        500
    );
}

/* =====================================================
   显示消息
===================================================== */

async function renderMessage(
    message,
    profileById = null,
    profileByNickname = null
){

    hideEmpty();

    const row =
        document.createElement("div");

    row.className = "message";

    const isMine =
        currentUser &&
        (
            message.user_id ===
            currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                currentProfile.nickname
            )
        );

    if(isMine)
        row.classList.add("mine");

    let profile = null;

    if(
        message.user_id &&
        profileById
    ){

        profile =
            profileById.get(
                message.user_id
            ) || null;
    }

    if(
        !profile &&
        profileByNickname
    ){

        profile =
            profileByNickname.get(
                message.nickname
            ) || null;
    }

    if(
        isMine &&
        currentProfile
    ){

        profile =
            currentProfile;
    }

    const avatar =
        document.createElement("img");

    avatar.className =
        "message-avatar";

    avatar.alt = "头像";

    if(
        profile &&
        profile.avatar_url
    ){

        const avatarUrl =
            await getPrivateImageUrl(
                AVATAR_BUCKET,
                profile.avatar_url
            );

        avatar.src =
            avatarUrl ||
            createDefaultAvatar(
                message.nickname
            );

    }else{

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );
    }

    const body =
        document.createElement("div");

    body.className =
        "message-body";

    const name =
        document.createElement("div");

    name.className =
        "nickname";

    name.textContent =
        message.nickname ||
        "匿名";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    if(message.image_url){

        bubble.classList.add(
            "image-bubble"
        );

        const img =
            document.createElement("img");

        img.className =
            "chat-image";

        const imageUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );

        if(imageUrl){

            img.src =
                imageUrl;

            img.alt =
                "聊天图片";

            img.loading =
                "lazy";

            img.onclick =
                function(){

                    openImageViewer(
                        imageUrl
                    );
                };

            bubble.appendChild(img);

            img.addEventListener(
                "load",
                function(){

                    forceScrollToBottom();

                }
            );

        }else{

            bubble.textContent =
                "[图片无法加载]";
        }

    }else{

        bubble.textContent =
            message.message || "";
    }

    const time =
        document.createElement("div");

    time.className = "time";

    time.textContent =
        formatTime(
            message.created_at
        );

    body.appendChild(name);
    body.appendChild(bubble);
    body.appendChild(time);

    row.appendChild(avatar);
    row.appendChild(body);

    messages.appendChild(row);
}


/* =====================================================
   时间
===================================================== */

function formatTime(value){

    if(!value)
        return "";

    const date =
        new Date(value);

    if(isNaN(date.getTime()))
        return "";

    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =====================================================
   强制滚到底部
===================================================== */

function forceScrollToBottom(){

    requestAnimationFrame(

            messages.scrollTop =

}


/* =====================================================
   发送限制
===================================================== */

function checkRateLimit(){

    const now =
        Date.now();

    sentMessageTimes =
        sentMessageTimes.filter(
            function(time){

                return(
                    now - time < 60000
                );

            }
        );

    if(
        sentMessageTimes.length >= 40
    ){

        return false;
    }

    sentMessageTimes.push(now);

    return true;
}

    if(!text)
        return;

    if(text.length > 1500){

        alert(
            "一条消息最多 1500 个字符。"
        );

        return;
    }

    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请一分钟后再继续发送。"
        );

        return;
    }

    try{

        const {data,error} =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:
                        text,

                    image_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url"
                )
                .single();

        if(error)
            throw error;

        messageInput.value = "";

        updateComposerButtons();

        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }

    }catch(error){

        console.error(
            "发送消息失败：",
            error
        );

        alert(
            "发送失败：\n" +
            error.message
        );

    }finally{

        if(window.innerWidth > 600){

            messageInput.focus();

        }
    }
}

async function uploadImage(file){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;
    }

    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;
    }

    const maxSize =
        5 * 1024 * 1024;

    if(file.size > maxSize){

        alert(
            "图片不能超过 5MB。"
        );

        return;
    }

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];

    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        alert(
            "只支持 JPG、PNG、GIF、WEBP。"
        );

        return;
    }

    plusButton.disabled = true;

    try{

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();

        const fileName =
            currentUser.id +
            "_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,10) +
            "." +
            extension;

        const {error:uploadError} =
            await supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );

        if(uploadError)
            throw uploadError;

        const {data,error} =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:"",

                    image_url:
                        fileName

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url"
                )
                .single();

        if(error)
            throw error;

        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }

    }catch(error){

        console.error(
            "图片发送失败：",
            error
        );

        alert(
            "图片发送失败：\n" +
            error.message
        );

    }finally{

        plusButton.disabled = false;
    }
}


/* =====================================================
   Realtime
===================================================== */

function subscribeToMessages(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }

    realtimeChannel =
        supabaseClient
            .channel(
                "messages-realtime"
            )
            .on(

                "postgres_changes",

                {
                    event:"INSERT",
                    schema:"public",
                    table:MESSAGE_TABLE
                },

                async function(payload){

                    if(
                        currentUser &&
                        payload.new.user_id ===
                        currentUser.id
                    ){

                        return;
                    }

                    let profileMap =
                        new Map();

                    let nicknameMap =
                        new Map();

                    if(payload.new.user_id){

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "id",
                                    payload.new.user_id
                                )
                                .maybeSingle();

                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }

                    }else{

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "nickname",
                                    payload.new.nickname
                                )
                                .maybeSingle();

                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }
                    }

                    await renderMessage(
                        payload.new,
                        profileMap,
                        nicknameMap
                    );

                    forceScrollToBottom();
                }

            )
            .subscribe(
                function(status){

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );
}

function buildEmojiPanel(){

    emojiGrid.innerHTML = "";

    emojis.forEach(
        function(emoji){

            const button =
                document.createElement("button");

            button.className =
                "emoji-item";

            button.textContent =
                emoji;

            button.addEventListener(
                "click",
                function(){

                    insertEmoji(emoji);

                }
            );

            emojiGrid.appendChild(button);

        }
    );
}


function insertEmoji(emoji){

    const start =
        messageInput.selectionStart;

    const end =
        messageInput.selectionEnd;

    const value =
        messageInput.value;

    messageInput.value =
        value.substring(0,start) +
        emoji +
        value.substring(end);

    const position =
        start + emoji.length;

    messageInput.focus();

    messageInput.setSelectionRange(
        position,
        position
    );

    updateComposerButtons();
}

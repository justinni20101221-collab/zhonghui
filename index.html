<script>


/* =====================================================
   Supabase
===================================================== */


const SUPABASE_URL =
    "https://fhkqnknpmdddiehpktnu.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_3p3PR-D3GUy5BRhQDl57AA__4Gbg388";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
   ★ 重要 ★

   这里使用的是旧表 messages

   不使用 chat_msg
*/


const MESSAGE_TABLE =
    "messages";


/*
   图片 Storage
*/


const STORAGE_BUCKET =
    "chat-images";


let nickname = "";

let realtimeChannel = null;


/* =====================================================
   DOM
===================================================== */


const homePage =
    document.getElementById(
        "homePage"
    );


const chatPage =
    document.getElementById(
        "chatPage"
    );


const nicknameModal =
    document.getElementById(
        "nicknameModal"
    );


const nicknameInput =
    document.getElementById(
        "nicknameInput"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const messages =
    document.getElementById(
        "messages"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const imageButton =
    document.getElementById(
        "imageButton"
    );


const imageInput =
    document.getElementById(
        "imageInput"
    );


/* =====================================================
   昵称窗口
===================================================== */


function openNicknameModal() {

    nicknameModal.style.display =
        "flex";

    setTimeout(
        function() {

            nicknameInput.focus();

        },
        100
    );
}


/* =====================================================
   进入聊天室
===================================================== */


async function enterChat() {

    const name =
        nicknameInput.value.trim();


    if (!name) {

        alert(
            "请输入昵称"
        );

        nicknameInput.focus();

        return;
    }


    nickname = name;


    nicknameModal.style.display =
        "none";


    homePage.style.display =
        "none";


    chatPage.style.display =
        "block";


    await loadMessages();


    subscribeToMessages();


    messageInput.focus();
}


/* =====================================================
   返回首页
===================================================== */


function backHome() {

    chatPage.style.display =
        "none";

    homePage.style.display =
        "flex";
}


/* =====================================================
   读取历史消息
===================================================== */


async function loadMessages() {

    const {
        data,
        error
    } = await supabaseClient

        .from(MESSAGE_TABLE)

        .select(
            "id,nickname,message,created_at"
        )

        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "读取历史消息失败：",
            error
        );


        messages.innerHTML = `

            <div class="empty">

                读取聊天记录失败

                <br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;
    }


    messages.innerHTML = "";


    if (
        !data ||
        data.length === 0
    ) {

        showEmpty();

        return;
    }


    data.forEach(
        function(message) {

            renderMessage(
                message
            );

        }
    );


    scrollToBottom();
}


/* =====================================================
   空消息
===================================================== */


function showEmpty() {

    messages.innerHTML = `

        <div
            class="empty"
            id="emptyMessage">

            暂时还没有消息

            <br>

            成为第一个发言的人吧！

        </div>

    `;
}


function hideEmpty() {

    const empty =
        document.getElementById(
            "emptyMessage"
        );


    if (empty) {

        empty.remove();
    }
}


/* =====================================================
   判断是不是图片
===================================================== */


function isImageUrl(value) {

    if (!value) {

        return false;
    }


    const text =
        String(value).trim();


    return (
        text.startsWith("http://") ||
        text.startsWith("https://")
    );
}


/* =====================================================
   显示消息
===================================================== */


function renderMessage(message) {

    hideEmpty();


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    if (
        message.nickname ===
        nickname
    ) {

        row.classList.add(
            "mine"
        );
    }


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "nickname";


    name.textContent =
        message.nickname ||
        "匿名";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    /* =====================
       图片
    ===================== */


    if (
        isImageUrl(
            message.message
        )
    ) {

        bubble.classList.add(
            "image-bubble"
        );


        const img =
            document.createElement(
                "img"
            );


        img.className =
            "chat-image";


        img.src =
            message.message;


        img.alt =
            "聊天图片";


        img.loading =
            "lazy";


        img.onclick =
            function() {

                openImageViewer(
                    message.message
                );

            };


        /*
           图片加载失败时，
           不让整个聊天页面报错
        */


        img.onerror =
            function() {

                img.alt =
                    "图片无法加载";

                img.style.display =
                    "none";


                const text =
                    document.createElement(
                        "div"
                    );


                text.textContent =
                    message.message;


                bubble.appendChild(
                    text
                );
            };


        bubble.appendChild(
            img
        );

    }


    /* =====================
       普通文字
    ===================== */


    else {

        bubble.textContent =
            message.message ||
            "";
    }


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "time";


    time.textContent =
        formatTime(
            message.created_at
        );


    content.appendChild(
        name
    );


    content.appendChild(
        bubble
    );


    content.appendChild(
        time
    );


    row.appendChild(
        content
    );


    messages.appendChild(
        row
    );


    scrollToBottom();
}


/* =====================================================
   时间格式
===================================================== */


function formatTime(value) {

    if (!value) {

        return "";
    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleString(
        "zh-CN",
        {
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =====================================================
   滚动到底部
===================================================== */


function scrollToBottom() {

    setTimeout(
        function() {

            messages.scrollTop =
                messages.scrollHeight;

        },
        50
    );
}


/* =====================================================
   发送文字
===================================================== */


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {

        return;
    }


    sendButton.disabled =
        true;


    const {
        data,
        error
    } = await supabaseClient

        .from(MESSAGE_TABLE)

        .insert({
            nickname: nickname,
            message: text
        })

        .select(
            "id,nickname,message,created_at"
        )

        .single();


    sendButton.disabled =
        false;


    if (error) {

        console.error(
            "发送消息失败：",
            error
        );


        alert(
            "发送失败：\n" +
            error.message
        );


        return;
    }


    messageInput.value =
        "";


    /*
       立即显示自己的消息。
    */


    if (data) {

        renderMessage(
            data
        );
    }


    messageInput.focus();
}


/* =====================================================
   图片选择
===================================================== */


imageInput.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];


        if (!file) {

            return;
        }


        await uploadImage(
            file
        );


        this.value =
            "";

    }
);


/* =====================================================
   上传图片
===================================================== */


async function uploadImage(file) {


    /*
       最大 10MB
    */


    const maxSize =
        10 * 1024 * 1024;


    if (
        file.size >
        maxSize
    ) {

        alert(
            "图片太大，请选择 10MB 以下的图片。"
        );

        return;
    }


    /*
       支持的图片
    */


    const allowedTypes = [

        "image/jpeg",

        "image/png",

        "image/gif",

        "image/webp"

    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        alert(
            "只支持 JPG、PNG、GIF、WEBP 图片。"
        );

        return;
    }


    imageButton.disabled =
        true;


    imageButton.textContent =
        "⏳";


    try {


        /*
           生成唯一文件名
        */


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const fileName =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            extension;


        /*
           上传 Storage
        */


        const {
            error: uploadError
        } = await supabaseClient

            .storage

            .from(
                STORAGE_BUCKET
            )

            .upload(
                fileName,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false,

                    contentType:
                        file.type
                }
            );


        if (uploadError) {

            console.error(
                "图片上传失败：",
                uploadError
            );


            alert(
                "图片上传失败：\n" +
                uploadError.message
            );


            return;
        }


        /*
           获取公开 URL
        */


        const {
            data: urlData
        } = supabaseClient

            .storage

            .from(
                STORAGE_BUCKET
            )

            .getPublicUrl(
                fileName
            );


        const imageUrl =
            urlData.publicUrl;


        /*
           把图片 URL
           保存到旧 messages 表
        */


        const {
            data,
            error
        } = await supabaseClient

            .from(
                MESSAGE_TABLE
            )

            .insert({

                nickname:
                    nickname,

                message:
                    imageUrl

            })

            .select(
                "id,nickname,message,created_at"
            )

            .single();


        if (error) {

            console.error(
                "图片消息保存失败：",
                error
            );


            alert(
                "图片已经上传，但是保存聊天记录失败：\n" +
                error.message
            );


            return;
        }


        /*
           立即显示图片
        */


        if (data) {

            renderMessage(
                data
            );
        }


    } catch (error) {

        console.error(
            "图片发送错误：",
            error
        );


        alert(
            "发送图片时发生错误。"
        );


    } finally {

        imageButton.disabled =
            false;


        imageButton.textContent =
            "📷";
    }
}


/* =====================================================
   Realtime
===================================================== */


function subscribeToMessages() {


    /*
       如果之前已经连接，
       先关闭旧连接
    */


    if (
        realtimeChannel
    ) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }


    realtimeChannel =
        supabaseClient

            .channel(
                "messages-realtime"
            )

            .on(

                "postgres_changes",

                {
                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        MESSAGE_TABLE
                },

                function(payload) {


                    /*
                       自己发送的消息已经
                       在 sendMessage()
                       或 uploadImage()
                       中显示。

                       所以这里只显示
                       其他人的消息。
                    */


                    if (
                        payload.new.nickname !==
                        nickname
                    ) {

                        renderMessage(
                            payload.new
                        );
                    }

                }

            )

            .subscribe(

                function(status) {

                    console.log(
                        "Realtime:",
                        status
                    );

                }

            );
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0b0d12;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   首页
========================= */

#homePage{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:auto;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card{
    width:100%;
    max-width:460px;
    padding:50px 38px;
    text-align:center;
    border-radius:18px;
    background:#15171d;
    border:1px solid #252832;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:38px;
    background:#5865f2;
    box-shadow:0 15px 35px rgba(88,101,242,.35);
}

.home-card h1{
    font-size:40px;
    margin-bottom:12px;
}

.home-card p{
    color:#a6a8b0;
    line-height:1.7;
    margin-bottom:30px;
}

.primary-button{
    width:100%;
    border:none;
    border-radius:5px;
    padding:14px 20px;
    color:white;
    font-weight:700;
    background:#5865f2;
}

.primary-button:hover{
    background:#4752c4;
}

.primary-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   登录 / 注册
========================= */

.page{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;
    background:#0b0d12;
}

.auth-card{
    width:100%;
    max-width:430px;
    padding:32px;
    border-radius:8px;
    background:#15171d;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#a6a8b0;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#b5bac1;
    margin-bottom:8px;
}

.form-input{
    width:100%;
    border:none;
    outline:none;
    padding:13px;
    border-radius:4px;
    color:white;
    background:#0f1116;
    border:1px solid #252832;
}

.form-input:focus{
    border-color:#5865f2;
}

.auth-link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#a6a8b0;
}

.auth-link button{
    border:none;
    background:none;
    color:#5865f2;
    font-weight:600;
}

.auth-error{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:4px;
    background:rgba(237,66,69,.12);
    color:#f38688;
    font-size:13px;
}

.auth-success{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:4px;
    background:rgba(35,165,90,.12);
    color:#57d48b;
    font-size:13px;
}

.code-row{
    display:flex;
    gap:8px;
}

.code-row .form-input{
    flex:1;
    letter-spacing:5px;
    text-align:center;
    font-size:18px;
}

.code-button{
    width:125px;
    flex-shrink:0;
    border:none;
    border-radius:4px;
    background:#4f545c;
    color:white;
    font-size:13px;
}

.code-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   头像
========================= */

.avatar-upload{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.avatar-preview{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin-bottom:12px;
    border:3px solid #2b2e35;
}

.avatar-upload input{
    display:none;
}

.avatar-button{
    border:none;
    background:#4f545c;
    color:white;
    padding:8px 14px;
    border-radius:4px;
    font-size:13px;
}

/* =========================
   聊天页面
========================= */

#chatPage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    display:none;
    overflow:hidden;
    background:#111318;
}

.chat-container{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   顶部
========================= */

.chat-header{
    height:64px;
    min-height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#15171d;
    border-bottom:1px solid #252832;

    z-index:10;
}

.chat-title{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.chat-icon{
    width:38px;
    height:38px;
    flex:0 0 38px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;
    background:#5865f2;
}

.chat-title h2{
    font-size:16px;
}

.status{
    font-size:11px;
    color:#23a55a;
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
}

.current-user{
    display:flex;
    align-items:center;
    gap:8px;
    color:#dbdee1;
    font-size:13px;
}

.header-avatar{
    width:32px;
    height:32px;
    flex:0 0 32px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.logout-button{
    border:none;
    border-radius:4px;
    padding:8px 12px;
    background:#2b2e35;
    color:#dbdee1;
    font-size:13px;
}

.logout-button:hover{
    background:#ed4245;
}

/* =========================
   消息区域
========================= */

#messages{
    flex:1 1 auto;
    min-height:0;
    width:100%;

    overflow-x:hidden;
    overflow-y:auto;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;

    padding:25px;

    background:#111318;

    overflow-anchor:none;
}

/* =========================
   消息
========================= */

.message{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    width:100%;
}

.message.mine{
    flex-direction:row-reverse;
}

.message-avatar{
    width:40px;
    height:40px;
    flex:0 0 40px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.message-body{
    max-width:75%;
    min-width:0;
}

.message.mine .message-body{
    text-align:right;
}

.nickname{
    font-size:13px;
    color:#b5bac1;
    margin-bottom:4px;
    font-weight:600;
}

.bubble{
    display:inline-block;
    max-width:100%;
    padding:9px 13px;
    border-radius:8px;
    background:#1e2128;
    color:#dbdee1;
    line-height:1.5;
    word-break:break-word;
    overflow-wrap:anywhere;
    text-align:left;
}

.mine .bubble{
    background:#5865f2;
    color:white;
}

.bubble.image-bubble{
    padding:0 !important;
    background:transparent !important;
    border-radius:8px;
    overflow:hidden;
    line-height:0;
}

.chat-image{
    display:block;

    max-width:320px;
    max-height:400px;

    width:auto;
    height:auto;

    border-radius:8px;

    object-fit:contain;

    cursor:pointer;
}

.chat-image:hover{
    opacity:.92;
}

.time{
    font-size:10px;
    margin-top:4px;
    color:#6d717a;
}

.empty{
    min-height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#6d717a;
    text-align:center;
    line-height:1.8;
}

/* =========================
   Discord 风格输入区
========================= */

.input-area{
    position:relative;

    width:100%;
    min-height:82px;
    flex:0 0 auto;

    display:flex;
    align-items:center;

    padding:14px 20px;

    background:#15171d;
    border-top:1px solid #252832;

    z-index:20;
}

/*
   整个输入框
*/

.composer{
    width:100%;
    min-height:52px;

    display:flex;
    align-items:center;

    padding:6px 8px;

    border-radius:10px;

    background:#1e2128;

    transition:
        background .15s ease,
        box-shadow .15s ease;
}

.composer:focus-within{
    background:#20232b;
    box-shadow:0 0 0 1px rgba(88,101,242,.15);
}

/*
   左边 +
*/

.composer-left{
    width:40px;
    min-width:40px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.plus-button{
    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#b5bac1;
    color:#1e2128;

    font-size:25px;
    font-weight:300;
    line-height:1;

    transition:.15s ease;
}

.plus-button:hover{
    background:#ffffff;
    transform:scale(1.05);
}

/*
   中间输入框
*/

#messageInput{
    flex:1 1 auto;
    min-width:0;

    height:40px;

    border:none;
    outline:none;

    padding:0 10px;

    color:white;
    background:transparent;

    font-size:15px;
}

#messageInput::placeholder{
    color:#6d717a;
}

/*
   右边功能区
*/

.composer-right{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:4px;

    min-width:84px;
}

/*
   表情和麦克风
*/

.tool-button{
    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent;
    color:#b5bac1;

    font-size:21px;

    transition:
        background .15s ease,
        color .15s ease,
        transform .15s ease;
}

.tool-button:hover{
    background:#2b2e35;
    color:#ffffff;
    transform:scale(1.05);
}

/*
   发送纸飞机
*/

#sendButton{
    display:none;

    width:40px;
    height:40px;

    border:none;
    border-radius:50%;

    align-items:center;
    justify-content:center;

    background:#5865f2;
    color:white;

    font-size:20px;

    transition:
        background .15s ease,
        transform .15s ease;
}

#sendButton:hover{
    background:#4752c4;
    transform:scale(1.05);
}

#sendButton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/*
   输入文字后：
   隐藏 emoji / microphone
   显示纸飞机
*/

.composer.has-text .normal-tools{
    display:none;
}

.composer.has-text #sendButton{
    display:flex;
}

/*
   图片选择隐藏
*/

#imageInput{
    display:none;
}

/* =========================
   Emoji 面板
========================= */

#emojiPicker{
    position:absolute;

    right:20px;
    bottom:76px;

    width:310px;
    max-width:calc(100vw - 30px);

    display:none;

    padding:12px;

    border-radius:10px;

    background:#181a1f;
    border:1px solid #2b2e35;

    box-shadow:0 15px 50px rgba(0,0,0,.5);

    z-index:100;
}

.emoji-title{
    color:#b5bac1;
    font-size:12px;
    margin-bottom:8px;
}

.emoji-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:4px;
}

.emoji-item{
    width:32px;
    height:32px;

    border:none;
    border-radius:5px;

    background:transparent;

    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.emoji-item:hover{
    background:#2b2e35;
}

/* =========================
   图片查看器
========================= */

#imageViewer{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.9);

    z-index:9999;
}

#viewerImage{
    max-width:95vw;
    max-height:90vh;

    border-radius:8px;

    object-fit:contain;
}

#closeViewer{
    position:absolute;
    top:20px;
    right:25px;

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:white;
    font-size:28px;
}

/* =========================
   手机
========================= */

@media(max-width:600px){

    .home-card{
        padding:40px 25px;
    }

    .home-card h1{
        font-size:34px;
    }

    .auth-card{
        padding:25px 20px;
    }

    .page{
        padding:12px;
    }

    .chat-header{
        height:58px;
        min-height:58px;
        flex-basis:58px;
        padding:0 12px;
    }

    .chat-icon{
        width:34px;
        height:34px;
        flex-basis:34px;
    }

    .chat-title h2{
        font-size:15px;
    }

    #messages{
        padding:18px 12px;
    }

    .message{
        gap:9px;
    }

    .message-avatar{
        width:36px;
        height:36px;
        flex-basis:36px;
    }

    .message-body{
        max-width:80%;
    }

    .chat-image{
        max-width:250px;
        max-height:350px;
    }

    .input-area{
        min-height:70px;
        padding:9px 10px;
        padding-bottom:max(9px,env(safe-area-inset-bottom));
    }

    .composer{
        min-height:50px;
        padding:5px 6px;
    }

    .composer-left{
        width:38px;
        min-width:38px;
    }

    .plus-button{
        width:32px;
        height:32px;
        font-size:23px;
    }

    .tool-button{
        width:36px;
        height:36px;
        font-size:20px;
    }

    #sendButton{
        width:36px;
        height:36px;
        font-size:18px;
    }

    .current-user span{
        display:none;
    }

    .logout-button{
        padding:7px 9px;
    }

    #emojiPicker{
        right:10px;
        bottom:69px;
    }
}

@media(max-width:380px){

    .message-body{
        max-width:78%;
    }

    .composer-right{
        min-width:76px;
    }

    .tool-button{
        width:34px;
        height:34px;
    }
}

.chat-header,
.input-area,
.chat-icon,
.status,
.logout-button,
.plus-button,
.tool-button,
#sendButton{
    user-select:none;
}
</style>
</head>

<body>

<!-- =========================
     首页
========================= -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">💬</div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">
            开始聊天
        </button>

    </div>

</div>


<!-- =========================
     登录
========================= -->

<div id="loginPage" class="page">

    <div class="auth-card">

        <h1>欢迎回来</h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div id="loginError" class="auth-error"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">
            登录
        </button>

        <div class="auth-link">
            还没有账号？
            <button onclick="openRegisterPage()">
                创建账号
            </button>
        </div>

        <div class="auth-link">
            <button onclick="backToHome()">
                返回首页
            </button>
        </div>

    </div>

</div>


<!-- =========================
     注册
========================= -->

<div id="registerPage" class="page">

    <div class="auth-card">

        <h1>创建账号</h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div id="registerError" class="auth-error"></div>

        <div id="registerSuccess" class="auth-success"></div>

        <div class="form-group">

            <label>邮箱</label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>密码</label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password">

        </div>

        <div class="form-group">

            <label>8位验证码</label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="8位验证码"
                    autocomplete="one-time-code">

                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendRegisterCode()">
                    获取验证码
                </button>

            </div>

        </div>

        <button
            id="verifyButton"
            class="primary-button"
            onclick="verifyRegisterCode()">
            验证并继续
        </button>

        <div class="auth-link">
            已经有账号？
            <button onclick="openLoginPage()">
                登录
            </button>
        </div>

    </div>

</div>


<!-- =========================
     完善资料
========================= -->

<div id="profilePage" class="page">

    <div class="auth-card">

        <h1>完善资料</h1>

        <div class="auth-subtitle">
            设置你的昵称和头像
        </div>

        <div id="profileError" class="auth-error"></div>

        <div class="avatar-upload">

            <img
                id="avatarPreview"
                class="avatar-preview"
                src=""
                alt="头像"
                style="display:none;">

            <div
                id="avatarDefault"
                class="avatar-preview">
                👤
            </div>

            <input
                id="avatarInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
                onchange="previewAvatar(event)">

            <button
                class="avatar-button"
                onclick="document.getElementById('avatarInput').click()">
                选择头像
            </button>

        </div>

        <div class="form-group">

            <label>昵称</label>

            <input
                id="profileNickname"
                class="form-input"
                type="text"
                maxlength="30"
                placeholder="例如：Justin"
                autocomplete="off">

        </div>

        <button
            id="finishProfileButton"
            class="primary-button"
            onclick="finishProfile()">
            完成注册并进入聊天
        </button>

    </div>

</div>


<!-- =========================
     聊天
========================= -->

<div id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>My Chat</h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <div class="header-right">

                <div class="current-user">

                    <img
                        id="currentUserAvatar"
                        class="header-avatar"
                        src=""
                        alt="头像">

                    <span id="currentUserName">
                        用户
                    </span>

                </div>

                <button
                    class="logout-button"
                    onclick="logoutUser()">
                    退出
                </button>

            </div>

        </header>


        <main id="messages">

            <div
                class="empty"
                id="emptyMessage">

                暂时还没有消息

                <br>

                成为第一个发言的人吧！

            </div>

        </main>


        <!-- Discord 风格输入区 -->

        <div class="input-area">

            <div class="composer" id="composer">

                <!-- 左边 + -->

                <div class="composer-left">

                    <button
                        class="plus-button"
                        id="plusButton"
                        onclick="document.getElementById('imageInput').click()"
                        title="发送图片">
                        +
                    </button>

                </div>


                <!-- 中间输入框 -->

                <input
                    id="messageInput"
                    type="text"
                    maxlength="1500"
                    placeholder="输入消息..."
                    autocomplete="off">

async function sendRegisterCode(){

    hideMessage("registerError");
    hideMessage("registerSuccess");

    if(codeCooldown > 0){

        showError(
            "registerError",
            "请等待 " +
            codeCooldown +
            " 秒。"

        return;
    }


    const email =

            .getElementById("registerEmail")
            .value

    const password =
        document
            .getElementById("registerPassword")
            .value;


    if(!email){

        showError(
            "registerError",
            "请输入邮箱。"
        );

        return;
    }


    if(password.length < 6){

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;
    }


    const button =
        document.getElementById(
            "sendCodeButton"
        );


    button.disabled = true;
    button.textContent = "发送中...";


    try{

        const {error} =
            await supabaseClient.auth
                .signInWithOtp({

                    email,

                    options:{
                        shouldCreateUser:true
                    }

                });


        if(error)
            throw error;


        showSuccess(
            "registerSuccess",
            "验证码已经发送到你的邮箱。"
        );


        startCodeCooldown();


    }catch(error){

        console.error(error);

        button.disabled = false;
        button.textContent = "获取验证码";


        showError(
            "registerError",
            "验证码发送失败：" +
            error.message
        );
    }
}


function startCodeCooldown(){

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";


    clearInterval(codeTimer);


    codeTimer =
        setInterval(function(){

            codeCooldown--;


            if(codeCooldown <= 0){

                clearInterval(codeTimer);

                codeCooldown = 0;

                button.disabled = false;

                button.textContent =
                    "获取验证码";

                return;
            }


            button.textContent =
                codeCooldown +
                " 秒后重试";

        },1000);
}


async function verifyRegisterCode(){

    hideMessage("registerError");


    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    if(!/^\d{8}$/.test(token)){

        showError(
            "registerError",

        );

    }


    const button =

    button.disabled = true;
    button.textContent = "验证中...";


    try{

        const {data,error} =
            await supabaseClient.auth
                .verifyOtp({

                    token,
                    type:"email"

                });


        if(error)
            throw error;


        currentUser = data.user;

    }finally{

    }
}

/* =====================================================
   私有图片 URL
===================================================== */

async function getPrivateImageUrl(
    bucket,
    path
){

    if(!path)
        return null;


    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }


    const cacheKey =
        bucket + ":" + path;


    if(imageUrlCache.has(cacheKey)){

        const cached =
            imageUrlCache.get(cacheKey);

        if(
            cached.expires >
            Date.now()
        ){

            return cached.url;
        }
    }


    const {data,error} =
        await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(
                path,
                3600
            );


    if(error){

        console.error(
            "生成图片地址失败：",
            error
        );

        return null;
    }


    imageUrlCache.set(
        cacheKey,
        {
            url:data.signedUrl,
            expires:Date.now() + 3500000
        }
    );


    return data.signedUrl;
}

/* =====================================================
   加载消息

async function loadMessages(){

    const {data,error} =
        await supabaseClient
            .from(MESSAGE_TABLE)
            .select(
                "id,user_id,nickname,message,created_at,image_url"
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "读取历史消息失败：",
            error
        );


        messages.innerHTML = "";


        const errorBox =
            document.createElement("div");


        errorBox.className = "empty";


        errorBox.textContent =
            "读取聊天记录失败：" +
            error.message;


        messages.appendChild(errorBox);

        return;
    }


    messages.innerHTML = "";


    if(!data || data.length === 0){

        showEmpty();

        return;
    }


    const {data:profiles,error:profileError} =
        await supabaseClient
            .from(PROFILE_TABLE)
            .select(
                "id,nickname,avatar_url"
            );


    if(profileError){

        console.error(
            "读取头像资料失败：",
            profileError
        );
    }


    const profileById =
        new Map();

    const profileByNickname =
        new Map();


    if(profiles){

        profiles.forEach(
            function(profile){

                if(profile.id){

                    profileById.set(
                        profile.id,
                        profile
                    );
                }


                if(
                    profile.nickname &&
                    !profileByNickname.has(
                        profile.nickname
                    )
                ){

                    profileByNickname.set(
                        profile.nickname,
                        profile
                    );
                }

            }
        );
    }


    for(
        const message of data
    ){

        await renderMessage(
            message,
            profileById,
            profileByNickname
        );
    }


    forceScrollToBottom();


    setTimeout(
        forceScrollToBottom,
        100
    );

    setTimeout(
        forceScrollToBottom,
        500
    );
}

/* =====================================================

function createDefaultAvatar(name){

    const letter =
        (name || "?")
            .charAt(0)
            .toUpperCase();


    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg"
              width="80"
              height="80">

            <rect
                width="80"
                height="80"
                rx="40"
                fill="#5865f2"/>

            <text
                x="50%"
                y="55%"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="white"
                font-size="32"
                font-family="Arial">

                ${letter}

            </text>

        </svg>`;


    return(
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}


/* =====================================================
   显示消息
===================================================== */

async function renderMessage(
    message,
    profileById = null,
    profileByNickname = null
){

    hideEmpty();


    const row =
        document.createElement("div");


    row.className = "message";


    const isMine =
        currentUser &&
        (
            message.user_id ===
            currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                currentProfile.nickname
            )
        );


    if(isMine)
        row.classList.add("mine");


    let profile = null;


    if(
        message.user_id &&
        profileById
    ){

        profile =
            profileById.get(
                message.user_id
            ) || null;
    }


    if(
        !profile &&
        profileByNickname
    ){

        profile =
            profileByNickname.get(
                message.nickname
            ) || null;
    }


    if(
        isMine &&
        currentProfile
    ){

        profile =
            currentProfile;
    }


    const avatar =
        document.createElement("img");


    avatar.className =
        "message-avatar";


    avatar.alt = "头像";


    if(
        profile &&
        profile.avatar_url
    ){

        const avatarUrl =
            await getPrivateImageUrl(
                AVATAR_BUCKET,
                profile.avatar_url
            );


        avatar.src =
            avatarUrl ||
            createDefaultAvatar(
                message.nickname
            );

    }else{

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );
    }


    const body =
        document.createElement("div");


    body.className =
        "message-body";


    const name =
        document.createElement("div");


    name.className =
        "nickname";


    name.textContent =
        message.nickname ||
        "匿名";


    const bubble =
        document.createElement("div");


    bubble.className =
        "bubble";


    if(message.image_url){

        bubble.classList.add(
            "image-bubble"
        );


        const img =
            document.createElement("img");


        img.className =
            "chat-image";


        const imageUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );


        if(imageUrl){

            img.src =
                imageUrl;

            img.alt =
                "聊天图片";

            img.loading =
                "lazy";


            img.onclick =
                function(){

                    openImageViewer(
                        imageUrl
                    );

                };


            bubble.appendChild(img);


            img.addEventListener(
                "load",
                function(){

                    forceScrollToBottom();

                }
            );

        }else{

            bubble.textContent =
                "[图片无法加载]";
        }


    }else{

        bubble.textContent =
            message.message || "";
    }


    const time =
        document.createElement("div");


    time.className = "time";


    time.textContent =
        formatTime(
            message.created_at
        );


    body.appendChild(name);
    body.appendChild(bubble);
    body.appendChild(time);

    row.appendChild(avatar);
    row.appendChild(body);

    messages.appendChild(row);
}


/* =====================================================
   时间
===================================================== */

function formatTime(value){

    if(!value)
        return "";


    const date =
        new Date(value);


    if(isNaN(date.getTime()))
        return "";


    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =====================================================
   滚到底部
===================================================== */

function forceScrollToBottom(){

    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );
}


/* =====================================================
   发送限制
===================================================== */

function checkRateLimit(){

    const now =
        Date.now();


    sentMessageTimes =
        sentMessageTimes.filter(
            function(time){

                return(
                    now - time < 60000
                );

            }
        );


    if(
        sentMessageTimes.length >= 40
    ){

        return false;
    }


    sentMessageTimes.push(now);

    return true;
}


/* =====================================================
   文字输入状态
===================================================== */

function updateComposerState(){

    const hasText =
        messageInput.value.trim().length > 0;


    if(hasText){

        composer.classList.add(
            "has-text"
        );

    }else{

        composer.classList.remove(
            "has-text"
        );
    }
}


messageInput.addEventListener(
    "input",
    updateComposerState
);


/* =====================================================
   发送文字
===================================================== */

async function sendMessage(){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;
    }


    const text =
        messageInput.value.trim();


    if(!text)
        return;


    if(text.length > 1500){

        alert(
            "一条消息最多 1500 个字符。"
        );

        return;
    }


    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请一分钟后再继续发送。"
        );

        return;
    }


    sendButton.disabled = true;


    try{

        const {data,error} =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:
                        text,

                    image_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url"
                )
                .single();


        if(error)
            throw error;


        messageInput.value = "";

        updateComposerState();


        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );


            forceScrollToBottom();
        }


    }catch(error){

        console.error(
            "发送消息失败：",
            error
        );


        alert(
            "发送失败：\n" +
            error.message
        );


    }finally{

        sendButton.disabled = false;


        if(window.innerWidth > 600){

            messageInput.focus();

        }
    }
}


/* =====================================================
   图片选择
===================================================== */

imageInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];


        if(!file)
            return;


        await uploadImage(file);


        this.value = "";
    }
);


/* =====================================================
   上传图片
===================================================== */

async function uploadImage(file){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;
    }


    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;
    }


    const maxSize =
        5 * 1024 * 1024;


    if(file.size > maxSize){

        alert(
            "图片不能超过 5MB。"
        );

        return;
    }


    const allowedTypes = [

        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"

    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        alert(
            "只支持 JPG、PNG、GIF、WEBP。"
        );

        return;
    }


    const plusButton =
        document.getElementById(
            "plusButton"
        );


    plusButton.disabled = true;
    plusButton.textContent = "…";


    try{

        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const fileName =
            currentUser.id +
            "_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,10) +
            "." +
            extension;


        const {error:uploadError} =
            await supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:file.type
                    }
                );


        if(uploadError)
            throw uploadError;


        const {data,error} =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:"",

                    image_url:
                        fileName

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url"
                )
                .single();


        if(error)
            throw error;


        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );


            forceScrollToBottom();
        }


    }catch(error){

        console.error(
            "图片发送失败：",
            error
        );


        alert(
            "图片发送失败：\n" +
            error.message
        );


    }finally{

        plusButton.disabled = false;
        plusButton.textContent = "+";
    }
}


/* =====================================================
   Realtime
===================================================== */

function subscribeToMessages(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "messages-realtime"
            )
            .on(

                "postgres_changes",

                {
                    event:"INSERT",
                    schema:"public",
                    table:MESSAGE_TABLE
                },

                async function(payload){

                    if(
                        currentUser &&
                        payload.new.user_id ===
                        currentUser.id
                    ){

                        return;
                    }


                    let profileMap =
                        new Map();

                    let nicknameMap =
                        new Map();


                    if(payload.new.user_id){

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "id",
                                    payload.new.user_id
                                )
                                .maybeSingle();


                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }

                    }else{

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "nickname",
                                    payload.new.nickname
                                )
                                .maybeSingle();


                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }
                    }


                    await renderMessage(
                        payload.new,
                        profileMap,
                        nicknameMap
                    );


                    forceScrollToBottom();
                }

            )
            .subscribe(

                function(status){

                    console.log(
                        "Realtime:",
                        status
                    );

                }

            );
}


/* =====================================================
   Emoji
===================================================== */

emojiButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(
            emojiPicker.style.display === "block"
        ){

            emojiPicker.style.display = "none";

        }else{

            emojiPicker.style.display = "block";
        }
    }
);


document
    .querySelectorAll(".emoji-item")
    .forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const emoji =
                        this.textContent;

                    const start =
                        messageInput.selectionStart;

                    const end =
                        messageInput.selectionEnd;

                    const value =
                        messageInput.value;

                    messageInput.value =
                        value.substring(0,start) +
                        emoji +
                        value.substring(end);

                    messageInput.focus();

                    const position =
                        start + emoji.length;

                    messageInput.setSelectionRange(
                        position,
                        position
                    );

                    updateComposerState();
                }
            );

        }
    );


document.addEventListener(
    "click",
    function(event){

        if(
            !emojiPicker.contains(event.target) &&
            event.target !== emojiButton
        ){

            emojiPicker.style.display = "none";
        }

    }
);

async function logoutUser(){

    if(realtimeChannel){

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }


    await supabaseClient.auth.signOut();
}


/* =====================================================
   图片查看器
===================================================== */

function openImageViewer(url){

    const viewer =
        document.getElementById(
            "imageViewer"
        );


    const viewerImage =
        document.getElementById(
            "viewerImage"
        );


    viewerImage.src = url;

    viewer.style.display = "flex";
}


function closeImageViewer(event){

    if(event)
        event.stopPropagation();


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    const viewerImage =
        document.getElementById(
            "viewerImage"
        );


    viewer.style.display = "none";

    viewerImage.src = "";
}


/* =====================================================
   回车发送
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);

   验证码只能数字
===================================================== */

document
    .getElementById("registerCode")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .replace(/\D/g,"")
                    .slice(0,8);

        }
    );

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0b0d12;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

#homePage,
.page{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:auto;
    background:#0b0d12;
}

#homePage{
    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card,
.auth-card{
    width:100%;
    max-width:460px;
    padding:40px 32px;
    text-align:center;
    border-radius:18px;
    background:#15171d;
    border:1px solid #252832;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:38px;
    background:#5865f2;
}

.home-card h1{
    font-size:40px;
    margin-bottom:12px;
}

.home-card p{
    color:#a6a8b0;
    line-height:1.7;
    margin-bottom:30px;
}

.primary-button{
    width:100%;
    border:0;
    border-radius:6px;
    padding:14px 20px;
    color:#fff;
    font-weight:700;
    background:#5865f2;
}

.primary-button:hover{
    background:#4752c4;
}

.page{
    display:none;
}

.auth-card{
    max-width:430px;
    text-align:left;
}

.auth-card h1{
    text-align:center;
    font-size:25px;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#a6a8b0;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#b5bac1;
    margin-bottom:8px;
}

.form-input{
    width:100%;
    border:0;
    outline:0;
    padding:13px;
    border-radius:4px;
    color:#fff;
    background:#0f1116;
    border:1px solid #252832;
}

.form-input:focus{
    border-color:#5865f2;
}

.auth-link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#a6a8b0;
}

.auth-link button{
    border:0;
    background:none;
    color:#5865f2;
    font-weight:600;
}

.auth-error,
.auth-success{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:4px;
    font-size:13px;
}

.auth-error{
    background:rgba(237,66,69,.12);
    color:#f38688;
}

.auth-success{
    background:rgba(35,165,90,.12);
    color:#57d48b;
}

.code-row{
    display:flex;
    gap:8px;
}

.code-row .form-input{
    flex:1;
    letter-spacing:5px;
    text-align:center;
}

.code-button{
    width:125px;
    flex-shrink:0;
    border:0;
    border-radius:4px;
    background:#4f545c;
    color:#fff;
    font-size:13px;
}

.avatar-upload{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.avatar-preview{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin-bottom:12px;
    border:3px solid #2b2e35;
}

.avatar-upload input{
    display:none;
}

.avatar-button{
    border:0;
    background:#4f545c;
    color:#fff;
    padding:8px 14px;
    border-radius:4px;
    font-size:13px;
}

/* =========================================================
   CHAT
========================================================= */

#chatPage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    height:100dvh;
    display:none;
    overflow:hidden;
    background:#111318;
}

.chat-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* 顶部 */

.chat-header{
    height:64px;
    min-height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:#15171d;
    border-bottom:1px solid #252832;

    z-index:100;
}

.chat-title{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.chat-icon{
    width:38px;
    height:38px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;
    background:#5865f2;
}

.chat-title h2{
    font-size:16px;
}

.status{
    font-size:11px;
    color:#23a55a;
    margin-top:2px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.current-user{
    display:flex;
    align-items:center;
    gap:8px;
    color:#dbdee1;
    font-size:13px;
}

.header-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
}

.logout-button{
    border:0;
    border-radius:4px;
    padding:8px 12px;
    background:#2b2e35;
    color:#dbdee1;
    font-size:13px;
}

.logout-button:hover{
    background:#ed4245;
}

/* =========================================================
   消息
========================================================= */

#messages{
    flex:1 1 auto;
    min-height:0;

    width:100%;

    overflow-x:hidden;
    overflow-y:auto;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;

    padding:25px;

    background:#111318;

    overflow-anchor:none;
}

.message{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    width:100%;
}

.message.mine{
    flex-direction:row-reverse;
}

.message-avatar{
    width:40px;
    height:40px;

    flex:0 0 40px;

    border-radius:50%;
    object-fit:cover;

    background:#5865f2;
}

.message-body{
    max-width:75%;
    min-width:0;
}

.message.mine .message-body{
    text-align:right;
}

.nickname{
    font-size:13px;
    color:#b5bac1;
    margin-bottom:4px;
    font-weight:600;
}

.bubble{
    display:inline-block;

    max-width:100%;

    padding:9px 13px;

    border-radius:8px;

    background:#1e2128;
    color:#dbdee1;

    line-height:1.5;

    word-break:break-word;
    overflow-wrap:anywhere;

    text-align:left;
}

.mine .bubble{
    background:#5865f2;
    color:#fff;
}

.bubble.image-bubble{
    padding:0!important;
    background:transparent!important;
    border-radius:8px;
    overflow:hidden;
    line-height:0;
}

.chat-image{
    display:block;

    max-width:320px;
    max-height:400px;

    width:auto;
    height:auto;

    border-radius:8px;

    object-fit:contain;

    cursor:pointer;
}

.time{
    font-size:10px;
    margin-top:4px;
    color:#6d717a;
}

.empty{
    min-height:100%;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    color:#6d717a;

    text-align:center;
    line-height:1.8;
}

/* =========================================================
   输入区域
========================================================= */

.input-area{
    position:relative;

    width:100%;

    min-height:75px;
    flex:0 0 auto;

    display:flex;
    flex-direction:column;
    align-items:stretch;

    padding:
        12px
        20px
        max(12px,env(safe-area-inset-bottom));

    background:#15171d;

    border-top:1px solid #252832;

    z-index:200;
}

.composer{
    width:100%;
    min-height:48px;

    display:flex;
    align-items:center;

    background:#1e2128;

    border-radius:12px;

    padding:0 6px;

    gap:4px;
}

.composer-left{
    display:flex;
    align-items:center;
    flex:0 0 auto;
}

.composer-right{
    display:flex;
    align-items:center;
    flex:0 0 auto;
    margin-left:auto;
}

.composer button{
    width:40px;
    height:40px;

    border:0;

    background:transparent;

    color:#b5bac1;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        background .15s ease,
        color .15s ease,
        transform .1s ease;
}

.composer button:hover{
    background:#2b2e35;
    color:#fff;
}

.composer button:active{
    transform:scale(.92);
}

.plus-btn{
    font-size:28px;
    font-weight:300;
    line-height:1;
}

.icon-btn svg{
    width:21px;
    height:21px;
    display:block;
}

.send-btn{
    color:#fff;
}

.send-btn:disabled{
    display:none;
}

.composer-input{
    flex:1;

    min-width:0;

    height:46px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    padding:0 8px;

    font-size:16px;

    line-height:46px;

    -webkit-appearance:none;
    appearance:none;
}

.composer-input::placeholder{
    color:#777c86;
}

/* =========================================================
   微信风格：表情区域
========================================================= */

.emoji-under-input{
    display:none;

    width:100%;

    margin-top:8px;

    align-items:center;
}

.emoji-under-input.open{
    display:flex;
}

.emoji-under-button{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#1e2128;

    color:#b5bac1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.emoji-under-button:hover{
    background:#2b2e35;
    color:#fff;
}

.emoji-under-button svg{
    width:21px;
    height:21px;
}

/* =========================================================
   Emoji 面板
========================================================= */

.emoji-panel{
    position:absolute;

    left:20px;
    right:20px;

    bottom:78px;

    width:auto;
    height:300px;

    display:none;

    background:#1b1e24;

    border:1px solid #30343d;

    border-radius:14px;

    box-shadow:
        0 18px 50px rgba(0,0,0,.5);

    padding:10px;

    z-index:300;

    overflow:hidden;
}

.emoji-panel.open{
    display:block;
}

.emoji-scroll{
    width:100%;
    height:100%;

    overflow-y:auto;
    overflow-x:hidden;

    -webkit-overflow-scrolling:touch;

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    align-content:start;

    gap:4px;

    overscroll-behavior:contain;
}

.emoji-item{
    height:34px;
    width:34px;

    border:0;

    background:transparent;

    border-radius:6px;

    font-size:21px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.emoji-item:hover{
    background:#2b2e35;
}

/* =========================================================
   微信风格录音按钮
========================================================= */

.voice-area{
    display:none;

    width:100%;

    margin-top:8px;

    align-items:center;
    justify-content:center;
}

.voice-area.open{
    display:flex;
}

.voice-hold-button{
    width:100%;
    height:48px;

    border:0;

    border-radius:10px;

    background:#1e2128;

    color:#dbdee1;

    font-size:15px;
    font-weight:600;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        background .15s ease,
        transform .1s ease;
}

.voice-hold-button:hover{
    background:#2b2e35;
}

.voice-hold-button.recording{
    background:#ed4245;
    color:#fff;
}

.voice-hold-button.recording::before{
    content:"●";
    margin-right:7px;
    animation:recordPulse 1s infinite;
}

.voice-hold-button.cancel{
    background:#4f545c;
}

@keyframes recordPulse{
    0%{
        opacity:1;
    }

    50%{
        opacity:.35;
    }

    100%{
        opacity:1;
    }
}

/* =========================================================
   图片查看
========================================================= */

#imageInput{
    display:none;
}

#imageViewer{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:rgba(0,0,0,.9);

    z-index:9999;
}

#viewerImage{
    max-width:95vw;
    max-height:90vh;

    border-radius:8px;

    object-fit:contain;
}

#closeViewer{
    position:absolute;

    top:20px;
    right:25px;

    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:#fff;

    font-size:28px;
}

/* =========================================================
   手机
========================================================= */

@media(max-width:600px){

    .home-card{
        padding:40px 25px;
    }

    .home-card h1{
        font-size:34px;
    }

    .auth-card{
        padding:25px 20px;
    }

    .page{
        padding:12px;
    }

    .chat-header{
        height:58px;
        min-height:58px;
        flex-basis:58px;

        padding:0 12px;
    }

    .chat-icon{
        width:34px;
        height:34px;
        flex-basis:34px;
    }

    .chat-title h2{
        font-size:15px;
    }

    #messages{
        padding:18px 12px;
    }

    .message{
        gap:9px;
    }

    .message-avatar{
        width:36px;
        height:36px;
        flex-basis:36px;
    }

    .message-body{
        max-width:80%;
    }

    .chat-image{
        max-width:250px;
        max-height:350px;
    }

    .input-area{
        min-height:64px;

        padding:
            8px
            8px
            max(8px,env(safe-area-inset-bottom));
    }

    .composer{
        min-height:48px;
        border-radius:12px;
    }

    .composer-input{
        height:46px;
        line-height:46px;
        font-size:16px;
    }

    .composer button{
        width:38px;
        height:38px;
    }

    .current-user span{
        display:none;
    }

    .logout-button{
        padding:7px 9px;
    }

    .emoji-panel{
        left:8px;
        right:8px;

        bottom:116px;

        height:285px;
    }

    .emoji-scroll{
        grid-template-columns:
            repeat(8,1fr);
    }

    .emoji-item{
        font-size:20px;
    }

    .voice-hold-button{
        height:48px;
    }
}

@media(max-width:380px){

    .message-body{
        max-width:78%;
    }

    .emoji-panel{
        height:270px;
    }
}

.chat-header,
.input-area,
.chat-icon,
.status,
.logout-button,
.composer button,
.voice-hold-button{
    user-select:none;
}

input,
textarea{
    touch-action:manipulation;
}

body.chat-open{
    overflow:hidden!important;
    position:fixed;
    width:100%;
}
</style>
</head>

<body>

<!-- =====================================================
     首页
===================================================== -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>
            My Chat
        </h1>

        <p>
            一个属于你和朋友的私人聊天室。<br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">
            开始聊天
        </button>

    </div>

</div>


<!-- =====================================================
     登录
===================================================== -->

<div id="loginPage" class="page">

    <div class="auth-card">

        <h1>
            欢迎回来
        </h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div
            id="loginError"
            class="auth-error">
        </div>

        <div class="form-group">

            <label>
                邮箱
            </label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>
                密码
            </label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">
            登录
        </button>

        <div class="auth-link">

            还没有账号？

            <button onclick="openRegisterPage()">
                创建账号
            </button>

        </div>

        <div class="auth-link">

            <button onclick="backToHome()">
                返回首页
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     注册
===================================================== -->

<div id="registerPage" class="page">

    <div class="auth-card">

        <h1>
            创建账号
        </h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div
            id="registerError"
            class="auth-error">
        </div>

        <div
            id="registerSuccess"
            class="auth-success">
        </div>

        <div class="form-group">

            <label>
                邮箱
            </label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>
                8位验证码
            </label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="8位验证码">

                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendRegisterCode()">

                    获取验证码

                </button>

            </div>

        </div>

        <div class="form-group">

            <label>
                密码
            </label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password">

        </div>

        <button
            id="verifyButton"
            class="primary-button"
            onclick="verifyRegisterCode()">

            验证并继续

        </button>

        <div class="auth-link">

            已经有账号？

            <button onclick="openLoginPage()">
                登录
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     完善资料
===================================================== -->

<div id="profilePage" class="page">

    <div class="auth-card">

        <h1>
            完善资料
        </h1>

        <div class="auth-subtitle">
            设置你的昵称和头像
        </div>

        <div
            id="profileError"
            class="auth-error">
        </div>

        <div class="avatar-upload">

            <img
                id="avatarPreview"
                class="avatar-preview"
                src=""
                alt="头像"
                style="display:none">

            <div
                id="avatarDefault"
                class="avatar-preview">

                👤

            </div>

            <input
                id="avatarInput"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp"
                onchange="previewAvatar(event)">

            <button
                class="avatar-button"
                onclick="document.getElementById('avatarInput').click()">

                选择头像

            </button>

        </div>

        <div class="form-group">

            <label>
                昵称
            </label>

            <input
                id="profileNickname"
                class="form-input"
                type="text"
                maxlength="30"
                placeholder="例如：Justin">

        </div>

        <button
            id="finishProfileButton"
            class="primary-button"
            onclick="finishProfile()">

            完成注册并进入聊天

        </button>

    </div>

</div>


<!-- =====================================================
     聊天页面
===================================================== -->

<div id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>
                        My Chat
                    </h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <div class="header-right">

                <div class="current-user">

                    <img
                        id="currentUserAvatar"
                        class="header-avatar"
                        src=""
                        alt="头像">

                    <span id="currentUserName">
                        用户
                    </span>

                </div>

                <button
                    class="logout-button"
                    onclick="logoutUser()">

                    退出

                </button>

            </div>

        </header>


        <main id="messages">

            <div
                class="empty"
                id="emptyMessage">

                暂时还没有消息<br>
                成为第一个发言的人吧！

async function sendRegisterCode(){

    const button =

    try{

        } =

                }
            });

        if(error)
            throw error;

        showSuccess(
            "registerSuccess",
            "验证码已经发送到你的邮箱。"
        );

        startCodeCooldown();

    }catch(e){

        button.disabled = false;
        button.textContent = "获取验证码";

        showError(
            "registerError",
            "验证码发送失败：" +
            e.message
        );

    }

}


function startCodeCooldown(){

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";

    clearInterval(codeTimer);

    codeTimer =
        setInterval(
            ()=>{

                codeCooldown--;

                if(codeCooldown <= 0){

                    clearInterval(codeTimer);

                    button.disabled = false;

                    button.textContent =
                        "获取验证码";

                }else{

                    button.textContent =
                        codeCooldown +
                        " 秒后重试";

                }

            },
            1000
        );

}

========================================================= */

async function verifyRegisterCode(){

    hideMessage("registerError");

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const token =
        document
            .getElementById("registerCode")
            .value
            .trim();

    if(password.length < 6){

        return showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

    }

    if(!/^\d{8}$/.test(token)){

        return showError(
            "registerError",
            "请输入完整的8位验证码。"
        );

    }

    const button =
        document.getElementById(
            "verifyButton"
        );

    button.disabled = true;
    button.textContent = "验证中...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth.verifyOtp({
                email,
                token,
                type:"email"
            });

        if(error)
            throw error;

        currentUser =
            data.user;

        const {
            error:passwordError
        } =
            await supabaseClient.auth.updateUser({

        openProfilePage();

    }catch(e){

        button.textContent = "验证并继续";

    }

}

/* =========================================================
   私有图片 URL
========================================================= */

async function getPrivateImageUrl(
    bucket,
    path
){

    if(!path)
        return null;

    if(/^https?:\/\//.test(path))
        return path;

    const key =
        bucket +
        ":" +
        path;

    const cached =
        imageUrlCache.get(key);

    if(
        cached &&
        cached.expires > Date.now()
    ){

        return cached.url;

    }

    const {
        data,
        error
    } =
        await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(
                path,
                3600
            );

    if(error)
        return null;

    imageUrlCache.set(
        key,
        {
            url:data.signedUrl,
            expires:Date.now() + 3500000
        }
    );

    return data.signedUrl;

}

/* =========================================================
   加载消息
========================================================= */

async function loadMessages(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from(MESSAGE_TABLE)
            .select(
                "id,user_id,nickname,message,created_at,image_url"
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "读取历史消息失败：",
            error
        );

        messages.innerHTML = "";

        const errorBox =
            document.createElement(
                "div"
            );

        errorBox.className = "empty";

        errorBox.textContent =
            "读取聊天记录失败：" +
            error.message;

        messages.appendChild(
            errorBox
        );

        return;

    }


    messages.innerHTML = "";


    if(
        !data ||
        data.length === 0
    ){

        showEmpty();

        return;

    }


    const {
        data:profiles
    } =
        await supabaseClient
            .from(PROFILE_TABLE)
            .select(
                "id,nickname,avatar_url"
            );


    const profileById =
        new Map();

    const profileByNickname =
        new Map();


    (profiles || [])
        .forEach(
            function(profile){

                if(profile.id){

                    profileById.set(
                        profile.id,
                        profile
                    );

                }

                if(
                    profile.nickname &&
                    !profileByNickname.has(
                        profile.nickname
                    )
                ){

                    profileByNickname.set(
                        profile.nickname,
                        profile
                    );

                }

            }
        );


    for(
        const message of data
    ){

        await renderMessage(
            message,
            profileById,
            profileByNickname
        );

    }


    forceScrollToBottom();

    setTimeout(
        forceScrollToBottom,
        100
    );

    setTimeout(
        forceScrollToBottom,
        500
    );

}

function createDefaultAvatar(name){

    const letter =
        (name || "?")
            .charAt(0)
            .toUpperCase();

    const svg =
        `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="80"
            height="80">

            <rect
                width="80"
                height="80"
                rx="40"
                fill="#5865f2"/>

                x="50%"
                y="55%"
                text-anchor="middle"
                dominant-baseline="middle"
                fill="white"
                font-size="32"
                font-family="Arial">

                ${letter}

            </text>

        </svg>
        `;

    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );

}


/* =========================================================
   渲染消息
========================================================= */

async function renderMessage(
    message,
    profileById=null,
    profileByNickname=null
){

    hideEmpty();

    const row =
        document.createElement(
            "div"
        );

    row.className = "message";


    const mine =
        currentUser &&
        (
            message.user_id ===
                currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                    currentProfile.nickname
            )
        );


    if(mine){

        row.classList.add(
            "mine"
        );

    }


    let profile = null;


    if(
        message.user_id &&
        profileById
    ){

        profile =
            profileById.get(
                message.user_id
            );

    }


    if(
        !profile &&
        profileByNickname
    ){

        profile =
            profileByNickname.get(
                message.nickname
            )
            ||
            null;

    }


    if(
        mine &&
        currentProfile
    ){

        profile =
            currentProfile;

    }


    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "message-avatar";

    avatar.alt = "头像";


    if(profile?.avatar_url){

        avatar.src =
            await getPrivateImageUrl(
                AVATAR_BUCKET,
                profile.avatar_url
            )
            ||
            createDefaultAvatar(
                message.nickname
            );

    }else{

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );

    }


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "nickname";

    name.textContent =
        message.nickname ||
        "匿名";


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    /* =====================================================
       语音消息
    ===================================================== */

    if(
        message.message &&
        message.message.startsWith(
            "[voice]"
        )
    ){

        const voicePath =
            message.message.replace(
                "[voice]",
                ""
            );

        const audioUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                voicePath
            );

        if(audioUrl){

            const audio =
                document.createElement(
                    "audio"
                );

            audio.controls = true;

            audio.preload = "metadata";

            audio.src = audioUrl;

            audio.style.maxWidth =
                "230px";

            audio.style.height =
                "38px";

            bubble.appendChild(
                audio
            );

        }else{

            bubble.textContent =
                "[语音无法加载]";

        }


    }else if(message.image_url){

        bubble.classList.add(
            "image-bubble"
        );

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "chat-image";


        const imageUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );


        if(imageUrl){

            img.src =
                imageUrl;

            img.alt =
                "聊天图片";

            img.loading =
                "lazy";

            img.onclick =
                () =>
                    openImageViewer(
                        imageUrl
                    );

            img.addEventListener(
                "load",
                forceScrollToBottom
            );

            bubble.appendChild(
                img
            );

        }else{

            bubble.textContent =
                "[图片无法加载]";

        }

    }else{

        bubble.textContent =
            message.message ||
            "";

    }


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "time";

    time.textContent =
        formatTime(
            message.created_at
        );


    body.append(
        name,
        bubble,
        time
    );

    row.append(
        avatar,
        body
    );

    messages.appendChild(
        row
    );

}


/* =========================================================
   时间
========================================================= */

function formatTime(value){

    if(!value)
        return "";

    const date =
        new Date(value);

    if(isNaN(date.getTime()))
        return "";

    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   滚到底部
========================================================= */

function forceScrollToBottom(){

    requestAnimationFrame(
        function(){

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =========================================================
   限速
========================================================= */

function checkRateLimit(){

    const now =
        Date.now();

    sentMessageTimes =
        sentMessageTimes.filter(
            function(time){

                return (
                    now - time <
                    60000
                );

            }
        );


    if(
        sentMessageTimes.length >=
        40
    ){

        return false;

    }


    sentMessageTimes.push(
        now
    );

    return true;

}

async function sendMessage(){

    if(
        !currentUser ||
        !currentProfile
    ){

        return openLoginPage();

    }


    const text =
        messageInput.value.trim();


    if(!text)
        return;


    if(text.length > 1500){

    }


    if(!checkRateLimit()){

            "发送太频繁了，请一分钟后再继续发送。"

    sendButton.disabled = true;


    try{

            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:

                    nickname:
                        currentProfile.nickname,

                    message:
                        text,

                    image_url:
                        null

                .select(
                    "id,user_id,nickname,message,created_at,image_url"

        );

    }finally{

        updateComposerState();

    }

}

/* =========================================================
   查找浏览器支持的录音格式
========================================================= */

function getSupportedAudioMimeType(){

    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        return "";

    }

    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/ogg",

        "audio/mp4"

    ];


    for(
        const type of types
    ){

        try{

            if(
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(type)
            ){

                return type;

            }

        }catch(e){

            console.warn(
                "检测录音格式失败:",
                type,
                e
            );

        }

    }


    return "";

}


/* =========================================================
   获取文件扩展名
========================================================= */

function getAudioExtension(mimeType){

    const type =
        (mimeType || "")
            .toLowerCase();


    if(
        type.includes("webm")
    ){

        return "webm";

    }

    if(
        type.includes("ogg")
    ){

        return "ogg";

    }

    if(
        type.includes("mp4") ||
        type.includes("m4a")
    ){

        return "mp4";

    }

    return "webm";

}


/* =========================================================
   检查浏览器录音
========================================================= */

function browserSupportsRecording(){

    return !!(
        navigator.mediaDevices &&
        typeof navigator.mediaDevices.getUserMedia ===
            "function" &&
        typeof MediaRecorder !==
            "undefined"
    );

}


/* =========================================================
   开始录音
========================================================= */

async function startRecording(){

    if(recording)
        return;


    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;

    }


    if(!browserSupportsRecording()){

        alert(
            "当前浏览器不支持网页语音录音。\n\n请使用最新版 Chrome、Edge 或 Firefox，并通过 HTTPS 网站访问。"
        );

        return;

    }


    const mimeType =
        getSupportedAudioMimeType();


    if(!mimeType){

        alert(
            "当前浏览器没有可用的网页录音格式。\n\n请使用最新版 Chrome、Edge 或 Firefox。"
        );

        return;

    }


    try{

        recordingStream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


        audioChunks = [];


        /*
         * 关键修复：
         *
         * 不再强制 audio/mp4。
         * 只有浏览器明确支持的格式才使用。
         */

        mediaRecorder =
            new MediaRecorder(
                recordingStream,
                {
                    mimeType:mimeType
                }
            );


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onerror =
            function(event){

                console.error(
                    "MediaRecorder error:",
                    event
                );

            };


        mediaRecorder.onstop =
            async function(){

                const actualMimeType =
                    mediaRecorder.mimeType ||
                    mimeType ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                actualMimeType
                        }
                    );


                if(
                    recordingStream
                ){

                    recordingStream
                        .getTracks()
                        .forEach(
                            track =>
                                track.stop()
                        );

                }

                recordingStream = null;


                /*
                 * 清除录音状态后上传
                 */

                recording = false;

                voiceHoldButton.classList.remove(
                    "recording"
                );

                voiceHoldButton.textContent =
                    "按住说话";


                if(blob.size > 0){

                    await uploadVoice(
                        blob,
                        actualMimeType
                    );

                }

            };


        /*
         * 每 100ms 收一次数据，
         * 防止部分浏览器最后没有完整数据。
         */

        mediaRecorder.start(100);

        recording = true;


        voiceHoldButton.classList.add(
            "recording"
        );

        voiceHoldButton.textContent =
            "松开结束并发送";


    }catch(e){

        console.error(
            "开始录音失败:",
            e
        );


        if(recordingStream){

            recordingStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

        recordingStream = null;

        recording = false;


        if(
            e.name ===
            "NotAllowedError"
        ){

            alert(
                "麦克风权限被拒绝。\n\n请允许浏览器使用麦克风，然后重新按住「按住说话」。"
            );

        }else if(
            e.name ===
            "NotFoundError"
        ){

            alert(
                "没有找到麦克风设备。"
            );

        }else{

            alert(
                "无法开始录音：\n" +
                e.message
            );

        }

    }

}


/* =========================================================
   停止录音
========================================================= */

function stopRecording(){

    if(
        !mediaRecorder ||
        !recording
    ){

        return;

    }


    try{

        if(
            mediaRecorder.state !==
            "inactive"
        ){

            mediaRecorder.stop();

        }else{

            recording = false;

        }

    }catch(e){

        console.error(
            "停止录音失败:",
            e
        );

        recording = false;

    }

}


/* =========================================================
   静默停止
========================================================= */

function stopRecordingSilently(){

    recording = false;


    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        try{

            mediaRecorder.stop();

        }catch(e){}

    }


    if(recordingStream){

        recordingStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    recordingStream = null;

    audioChunks = [];

    voiceHoldButton.classList.remove(
        "recording"
    );

    voiceHoldButton.textContent =
        "按住说话";

}


/* =========================================================
   上传语音
========================================================= */

async function uploadVoice(
    blob,
    mimeType
){

    if(
        !currentUser ||
        !currentProfile
    ){

        return;

    }


    if(!blob || blob.size === 0){

        return alert(
            "没有录到有效的语音。"
        );

    }


    if(!checkRateLimit()){

        return alert(
            "发送太频繁了，请稍后再试。"
        );

    }


    try{

        /*
         * 使用实际 MIME 类型。
         * 不再把 WebM 强行写成 MP4。
         */

        const realMimeType =
            mimeType ||
            blob.type ||
            "audio/webm";


        const extension =
            getAudioExtension(
                realMimeType
            );


        const fileName =
            currentUser.id +
            "_voice_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2,8) +
            "." +
            extension;


        const {
            error:uploadError
        } =
            await supabaseClient.storage
                .from(CHAT_IMAGE_BUCKET)
                .upload(
                    fileName,
                    blob,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:
                            realMimeType
                    }
                );


        if(uploadError)
            throw uploadError;


        const {
            data,
            error
        } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:
                        "[voice]" +
                        fileName,

                    image_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url"
                )
                .single();


        if(error)
            throw error;


        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();

        }


    }catch(e){

        console.error(
            "语音发送失败:",
            e
        );

        alert(
            "语音发送失败：\n" +
            e.message
        );

    }

}

let voicePointerActive = false;


/*
 * pointerdown：
 * 鼠标按下 / 手机手指按下
 */

voiceHoldButton.addEventListener(
    "pointerdown",
    async function(event){

        event.preventDefault();

        if(
            voicePointerActive ||
            recording
        ){

            return;

        }

        voicePointerActive = true;

        try{

            voiceHoldButton.setPointerCapture(
                event.pointerId
            );

        }catch(e){}


        await startRecording();

    }
);


/*
 * pointerup：
 * 鼠标松开 / 手指松开
 */

voiceHoldButton.addEventListener(
    "pointerup",
    function(event){

        event.preventDefault();

        if(!voicePointerActive)
            return;

        voicePointerActive = false;

        stopRecording();

    }
);


/*
 * pointercancel：
 * 手机滑出按钮区域、系统打断等
 */

voiceHoldButton.addEventListener(
    "pointercancel",
    function(event){

        event.preventDefault();

        voicePointerActive = false;

        stopRecording();

    }
);


/*
 * pointerleave：
 * 桌面鼠标拖出按钮。
 * 手机一般不会走这里。
 */

voiceHoldButton.addEventListener(
    "pointerleave",
    function(){

        if(
            voicePointerActive &&
            recording
        ){

            /*
             * 不立即结束。
             * 因为微信式操作需要允许手指稍微移动。

);

function openImageViewer(url){

    document.getElementById(
        "viewerImage"
    ).src = url;

    document.getElementById(
        "imageViewer"
    ).style.display = "flex";

}


function closeImageViewer(event){

    if(event)
        event.stopPropagation();

    document.getElementById(
        "imageViewer"
    ).style.display = "none";

    document.getElementById(
        "viewerImage"
    ).src = "";

}


/* =========================================================
   实时消息
========================================================= */

function subscribeToMessages(){

    if(realtimeChannel){

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "messages-realtime"
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:MESSAGE_TABLE
                },
                async payload => {

                    /*
                     * 自己发送的消息已经本地显示，
                     * 所以不要再次显示。
                     */

                    if(
                        currentUser &&
                        payload.new.user_id ===
                            currentUser.id
                    ){

                        return;

                    }


                    const byId =
                        new Map();

                    const byName =
                        new Map();


                    if(payload.new.user_id){

                        const {
                            data
                        } =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "id",
                                    payload.new.user_id
                                )
                                .maybeSingle();


                        if(data){

                            byId.set(
                                data.id,
                                data
                            );

                            byName.set(
                                data.nickname,
                                data
                            );

                        }

                    }else{

                        const {
                            data
                        } =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "nickname",
                                    payload.new.nickname
                                )
                                .maybeSingle();


                        if(data){

                            byId.set(
                                data.id,
                                data
                            );

                            byName.set(
                                data.nickname,
                                data
                            );

                        }

                    }


                    await renderMessage(
                        payload.new,
                        byId,
                        byName
                    );

                    forceScrollToBottom();

                }
            )
            .subscribe(
                status =>
                    console.log(
                        "Realtime:",
                        status
                    )
            );

}


/* =========================================================
   退出
========================================================= */

async function logoutUser(){

    if(realtimeChannel){

        await supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }

    stopRecordingSilently();

    document.body.classList.remove(
        "chat-open"
    );

    await supabaseClient.auth.signOut();

}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f5f5f5;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    color:#111;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   通用页面
========================================================= */

.page,
#homePage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    min-height:100%;
}

#homePage{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:auto;

    background:
        radial-gradient(
            circle at top left,
            rgba(88,101,242,.25),
            transparent 40%
        ),
        #0b0d12;
}

.home-card{
    width:100%;
    max-width:460px;
    padding:50px 38px;
    text-align:center;
    border-radius:18px;
    background:#15171d;
    border:1px solid #252832;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 25px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:38px;
    background:#5865f2;
}

.home-card h1{
    color:white;
    font-size:40px;
    margin-bottom:12px;
}

.home-card p{
    color:#a6a8b0;
    line-height:1.7;
    margin-bottom:30px;
}

.primary-button{
    width:100%;
    border:none;
    border-radius:6px;
    padding:14px 20px;
    color:white;
    font-weight:700;
    background:#5865f2;
}

.primary-button:hover{
    background:#4752c4;
}

.primary-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================================================
   登录 / 注册
========================================================= */

.page{
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;
    background:#0b0d12;
}

.auth-card{
    width:100%;
    max-width:430px;
    padding:32px;
    border-radius:8px;
    background:#15171d;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.auth-card h1{
    text-align:center;
    font-size:25px;
    color:white;
    margin-bottom:8px;
}

.auth-subtitle{
    text-align:center;
    color:#a6a8b0;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#b5bac1;
    margin-bottom:8px;
}

.form-input{
    width:100%;
    border:none;
    outline:none;
    padding:13px;
    border-radius:5px;
    color:white;
    background:#0f1116;
    border:1px solid #252832;
}

.form-input:focus{
    border-color:#5865f2;
}

.auth-link{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    color:#a6a8b0;
}

.auth-link button{
    border:none;
    background:none;
    color:#5865f2;
    font-weight:600;
}

.auth-error{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    background:rgba(237,66,69,.12);
    color:#f38688;
    font-size:13px;
}

.auth-success{
    display:none;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    background:rgba(35,165,90,.12);
    color:#57d48b;
    font-size:13px;
}

.code-row{
    display:flex;
    gap:8px;
}

.code-row .form-input{
    flex:1;
    letter-spacing:4px;
    text-align:center;
    font-size:18px;
}

.code-button{
    width:125px;
    flex-shrink:0;
    border:none;
    border-radius:5px;
    background:#4f545c;
    color:white;
    font-size:13px;
}

.code-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   头像
========================================================= */

.avatar-upload{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.avatar-preview{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    background:#5865f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    margin-bottom:12px;
    border:3px solid #2b2e35;
}

.avatar-upload input{
    display:none;
}

.avatar-button{
    border:none;
    background:#4f545c;
    color:white;
    padding:8px 14px;
    border-radius:5px;
    font-size:13px;
}

/* =========================================================
   聊天主界面
========================================================= */

#chatPage{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    overflow:hidden;
    display:none;
    background:#f5f5f5;
}

.chat-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#f5f5f5;
}

/* =========================================================
   顶部 —— 微信风格
========================================================= */

.chat-header{
    position:relative;
    flex:0 0 56px;
    height:56px;
    min-height:56px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0
        12px
        0
        14px;

    background:#ededed;
    border-bottom:1px solid #d7d7d7;
    z-index:50;
}

.chat-title{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.chat-icon{
    width:34px;
    height:34px;
    flex:0 0 34px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#07c160;
    font-size:18px;
}

.chat-title h2{
    font-size:16px;
    color:#111;
    font-weight:600;
}

.status{
    font-size:10px;
    color:#07a64f;
    margin-top:1px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
}

.current-user{
    display:flex;
    align-items:center;
    gap:6px;
    color:#333;
    font-size:12px;
}

.header-avatar{
    width:30px;
    height:30px;
    flex:0 0 30px;
    border-radius:50%;
    object-fit:cover;
    background:#07c160;
}

.logout-button{
    border:none;
    border-radius:4px;
    padding:6px 9px;
    background:#dedede;
    color:#333;
    font-size:12px;
}

.logout-button:hover{
    background:#d2d2d2;
}

/* =========================================================
   消息区域 —— 固定中间，不撑开页面
========================================================= */

#messages{
    position:relative;

    flex:1 1 auto;
    min-height:0;

    width:100%;
    overflow-x:hidden;
    overflow-y:auto;

    padding:
        16px
        12px
        18px;

    background:#f5f5f5;

    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;

    overflow-anchor:none;
}

/* =========================================================
   消息
========================================================= */

.message{
    display:flex;
    align-items:flex-start;
    gap:8px;
    width:100%;
    margin-bottom:14px;
}

.message.mine{
    flex-direction:row-reverse;
}

.message-avatar{
    width:36px;
    height:36px;
    flex:0 0 36px;
    border-radius:4px;
    object-fit:cover;
    background:#07c160;
}

.message-body{
    max-width:min(72%, 520px);
    min-width:0;
}

.message.mine .message-body{
    text-align:right;
}

.nickname{
    font-size:11px;
    color:#888;
    margin-bottom:3px;
    font-weight:500;
}

.bubble{
    display:inline-block;
    max-width:100%;
    padding:8px 10px;
    border-radius:4px;

    background:white;
    color:#222;

    line-height:1.5;
    word-break:break-word;
    overflow-wrap:anywhere;
    text-align:left;

    box-shadow:
        0 0 0 1px rgba(0,0,0,.02);
}

.mine .bubble{
    background:#95ec69;
    color:#111;
}

.time{
    font-size:9px;
    margin-top:3px;
    color:#aaa;
}

/* =========================================================
   图片
========================================================= */

.bubble.image-bubble{
    padding:0 !important;
    background:transparent !important;
    box-shadow:none;
    overflow:hidden;
}

.chat-image{
    display:block;
    max-width:280px;
    max-height:360px;
    width:auto;
    height:auto;
    border-radius:5px;
    object-fit:contain;
    cursor:pointer;
}

/* =========================================================
   语音消息
========================================================= */

.audio-bubble{
    padding:5px !important;
    background:white;
}

.mine .audio-bubble{
    background:#95ec69;
}

.audio-player{
    display:block;
    width:230px;
    max-width:100%;
    height:38px;
}

/* =========================================================
   空消息
========================================================= */

.empty{
    width:100%;
    height:100%;
    min-height:300px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:#aaa;
    text-align:center;
    line-height:1.8;
    font-size:13px;
}

/* =========================================================
   底部输入区域 —— 固定
========================================================= */

.input-area{
    position:relative;

    flex:0 0 auto;
    width:100%;

    display:flex;
    align-items:center;

    padding:
        7px
        9px
        calc(7px + env(safe-area-inset-bottom));

    background:#f5f5f5;
    border-top:1px solid #dedede;

    z-index:100;
}

/* =========================================================
   输入框
========================================================= */

.composer{
    position:relative;

    width:100%;
    min-height:42px;

    display:flex;
    align-items:center;
    gap:5px;

    background:#fff;
    border:1px solid #ddd;
    border-radius:5px;

    padding:3px 5px;
}

.composer:focus-within{
    border-color:#cfcfcf;
}

.plus-button{
    width:34px;
    height:34px;
    flex:0 0 34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:4px;

    background:transparent;
    color:#555;

    font-size:24px;
    line-height:1;
}

.plus-button:active{
    background:#eee;
}

#messageInput{
    flex:1 1 auto;
    min-width:0;

    height:34px;

    border:none;
    outline:none;

    padding:4px 3px;

    color:#222;
    background:transparent;

    font-size:15px;
}

#messageInput::placeholder{
    color:#aaa;
}

/* =========================================================
   右侧功能
========================================================= */

.composer-actions{
    display:flex;
    align-items:center;
    gap:0;
    flex:0 0 auto;
}

.composer-button{
    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    border-radius:4px;

    background:transparent;
    color:#555;

    font-size:21px;
}

.composer-button:active{
    background:#eee;
}

#sendButton{
    display:none;

    width:35px;
    height:35px;
    flex:0 0 35px;

    align-items:center;
    justify-content:center;

    border:none;
    border-radius:4px;

    background:#07c160;
    color:white;

    font-size:17px;
}

#sendButton:active{
    background:#06a653;
}

#sendButton:disabled{
    opacity:.5;
}

.composer.has-text .normal-actions{
    display:none;
}

.composer.has-text #sendButton{
    display:flex;
}

/* =========================================================
   Emoji —— 小型微信风格面板
========================================================= */

#emojiPicker{
    position:absolute;

    left:0;
    right:0;
    bottom:calc(100% + 1px);

    display:none;

    padding:8px 9px 9px;

    background:#f5f5f5;
    border-top:1px solid #ddd;
    box-shadow:0 -4px 12px rgba(0,0,0,.06);

    z-index:90;
}

.emoji-header{
    height:25px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 4px 4px;

    color:#888;
    font-size:11px;
}

.emoji-grid{
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:2px;

    max-height:150px;
    overflow-y:auto;
}

.emoji-item{
    width:100%;
    height:32px;

    border:none;
    background:transparent;
    border-radius:4px;

    font-size:19px;
    line-height:1;
}

.emoji-item:active{
    background:#e2e2e2;
}

/* =========================================================
   加号菜单
========================================================= */

#plusMenu{
    position:absolute;

    left:5px;
    bottom:calc(100% + 7px);

    width:170px;

    padding:5px;

    display:none;

    background:#fff;
    border:1px solid #ddd;
    border-radius:7px;

    box-shadow:0 5px 20px rgba(0,0,0,.12);

    z-index:95;
}

.plus-menu-item{
    width:100%;

    display:flex;
    align-items:center;
    gap:10px;

    border:none;
    background:transparent;

    color:#333;

    padding:10px;

    border-radius:5px;

    text-align:left;
    font-size:13px;
}

.plus-menu-item:active{
    background:#f0f0f0;
}

/* =========================================================
   按住说话浮层
========================================================= */

#holdToTalkBar{
    position:absolute;

    left:50%;
    bottom:calc(100% + 8px);

    transform:translateX(-50%);

    width:min(260px, calc(100% - 30px));

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:14px;

    background:rgba(35,35,35,.96);
    color:white;

    border-radius:10px;

    z-index:150;
}

.hold-icon{
    font-size:30px;
    margin-bottom:6px;
}

.hold-text{
    font-size:13px;
}

.hold-time{
    margin-top:4px;
    color:#aaa;
    font-size:11px;
}

.hold-cancel{
    margin-top:7px;
    color:#ff6969;
    font-size:11px;
}

/* =========================================================
   按住说话按钮
========================================================= */

.voice-button{
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

/* =========================================================
   图片查看器
========================================================= */

#imageViewer{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:15px;

    background:rgba(0,0,0,.9);

    z-index:9999;
}

#viewerImage{
    max-width:95vw;
    max-height:90vh;

    border-radius:6px;

    object-fit:contain;
}

#closeViewer{
    position:absolute;

    top:
        calc(12px + env(safe-area-inset-top));

    right:15px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:white;
    font-size:28px;
}

/* =========================================================
   手机
========================================================= */

@media(max-width:600px){

    .home-card{
        padding:40px 25px;
    }

    .home-card h1{
        font-size:34px;
    }

    .auth-card{
        padding:25px 20px;
    }

    .page{
        padding:12px;
    }

    .chat-header{
        flex-basis:54px;
        height:54px;
        min-height:54px;
        padding:0 10px 0 12px;
    }

    .chat-icon{
        width:32px;
        height:32px;
        flex-basis:32px;
    }

    .chat-title h2{
        font-size:15px;
    }

    #messages{
        padding:
            12px
            9px
            14px;
    }

    .message{
        gap:7px;
        margin-bottom:12px;
    }

    .message-avatar{
        width:35px;
        height:35px;
        flex-basis:35px;
    }

    .message-body{
        max-width:78%;
    }

    .nickname{
        font-size:10px;
    }

    .bubble{
        padding:7px 9px;
        font-size:14px;
    }

    .chat-image{
        max-width:240px;
        max-height:330px;
    }

    .current-user span{
        display:none;
    }

    .logout-button{
        padding:6px 8px;
    }

    .input-area{
        padding:
            6px
            7px
            calc(6px + env(safe-area-inset-bottom));
    }

    .composer{
        min-height:43px;
    }

    #messageInput{
        font-size:15px;
    }

    .emoji-grid{
        grid-template-columns:repeat(9,1fr);
        max-height:145px;
    }

    .emoji-item{
        height:31px;
        font-size:18px;
    }

    #emojiPicker{
        padding:7px 7px 8px;
    }

    .audio-player{
        width:210px;
    }
}

/* =========================================================
   超小屏
========================================================= */

@media(max-width:380px){

    .message-body{
        max-width:80%;
    }

    .emoji-grid{
        grid-template-columns:repeat(8,1fr);
    }

    .emoji-item{
        font-size:17px;
    }
}

/* =========================================================
   防止拖动/选择
========================================================= */

.chat-header,
.input-area,
.chat-icon,
.status,
.logout-button,
.plus-button,
.composer-button,
#sendButton{
    user-select:none;
    -webkit-user-select:none;
}

/* =========================================================
   键盘打开时
========================================================= */

body.keyboard-open .chat-header{
    flex-basis:52px;
    height:52px;
    min-height:52px;
}

body.keyboard-open .input-area{
    padding-bottom:5px;
}
</style>
</head>

<body>

<!-- ======================================================
     首页
====================================================== -->

<div id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>
            My Chat
        </h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            安全、简单、实时聊天。
        </p>

        <button
            class="primary-button"
            onclick="openLoginPage()">

            开始聊天

        </button>

    </div>

</div>


<!-- ======================================================
     登录
====================================================== -->

<div id="loginPage" class="page">

    <div class="auth-card">

        <h1>
            欢迎回来
        </h1>

        <div class="auth-subtitle">
            登录 My Chat
        </div>

        <div
            id="loginError"
            class="auth-error">
        </div>

        <div class="form-group">

            <label>
                邮箱
            </label>

            <input
                id="loginEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>
                密码
            </label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="输入密码"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="primary-button"
            onclick="loginUser()">

            登录

        </button>

        <div class="auth-link">

            还没有账号？

            <button onclick="openRegisterPage()">
                创建账号
            </button>

        </div>

        <div class="auth-link">

            <button onclick="backToHome()">
                返回首页
            </button>

        </div>

    </div>

</div>


<!-- ======================================================
     注册
====================================================== -->

<div id="registerPage" class="page">

    <div class="auth-card">

        <h1>
            创建账号
        </h1>

        <div class="auth-subtitle">
            注册 My Chat
        </div>

        <div
            id="registerError"
            class="auth-error">
        </div>

        <div
            id="registerSuccess"
            class="auth-success">
        </div>

        <div class="form-group">

            <label>
                邮箱
            </label>

            <input
                id="registerEmail"
                class="form-input"
                type="email"
                placeholder="you@example.com"
                autocomplete="email">

        </div>

        <div class="form-group">

            <label>
                密码
            </label>

            <input
                id="registerPassword"
                class="form-input"
                type="password"
                placeholder="至少 6 个字符"
                autocomplete="new-password">

        </div>

        <div class="form-group">

            <label>
                8位验证码
            </label>

            <div class="code-row">

                <input
                    id="registerCode"
                    class="form-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="8位验证码"
                    autocomplete="one-time-code">

                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendRegisterCode()">

                    获取验证码

                </button>

            </div>

        </div>

        <button
            id="verifyButton"
            class="primary-button"
            onclick="verifyRegisterCode()">

            验证并继续

        </button>

        <div class="auth-link">

            已经有账号？

            <button onclick="openLoginPage()">
                登录
            </button>

        </div>

    </div>

</div>


<!-- ======================================================
     完善资料
====================================================== -->

async function sendRegisterCode(){

    hideMessage("registerError");

    hideMessage("registerSuccess");

    if(codeCooldown > 0){

    }

    const email =

    const password =
        document
            .getElementById("registerPassword")
            .value;

    if(!email){

        showError(
            "registerError",

        );

        return;
    }

    if(password.length < 6){

        showError(
            "registerError",
            "密码至少需要 6 个字符。"
        );

        return;
    }

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    button.disabled = true;

    button.textContent =
        "发送中...";


    try{

        const {error} =
            await supabaseClient.auth
                .signInWithOtp({

                    email,

                    options:{
                        shouldCreateUser:true
                    }

                });

        if(error)
            throw error;

        showSuccess(
            "registerSuccess",
            "验证码已经发送到你的邮箱。"
        );

        startCodeCooldown();

    }catch(error){

        console.error(error);

        button.disabled = false;

        button.textContent =
            "获取验证码";

        showError(
            "registerError",
            "验证码发送失败：" +
            error.message
        );
    }
}


function startCodeCooldown(){

    const button =
        document.getElementById(
            "sendCodeButton"
        );

    codeCooldown = 60;

    button.disabled = true;

    button.textContent =
        codeCooldown +
        " 秒后重试";

    clearInterval(codeTimer);

    codeTimer =
        setInterval(function(){

            codeCooldown--;

            if(codeCooldown <= 0){

                clearInterval(codeTimer);

                codeCooldown = 0;

                button.disabled = false;

                button.textContent =
                    "获取验证码";

                return;
            }

            button.textContent =
                codeCooldown +
                " 秒后重试";

        },1000);
}

        document

    }

function previewAvatar(event){

    const file =
        event.target.files[0];

    if(!file)
        return;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/gif",
        "image/webp"
    ];

    if(!allowedTypes.includes(file.type)){

        alert(
            "头像只支持 JPG、PNG、GIF、WEBP。"
        );

        event.target.value = "";

        return;
    }

    if(file.size > 5 * 1024 * 1024){

        alert(
            "头像不能超过 5MB。"
        );

        event.target.value = "";

        return;
    }

    temporaryAvatarFile = file;

    const url =
        URL.createObjectURL(file);

    const preview =
        document.getElementById(
            "avatarPreview"
        );

    const defaultAvatar =
        document.getElementById(
            "avatarDefault"
        );

    preview.src = url;

    preview.style.display = "block";

    defaultAvatar.style.display = "none";
}

async function finishProfile(){

    if(!currentUser){

        showError(

        );

        );

    button.disabled = true;

    button.textContent =

    let avatarUrl = null;


    try{

        if(temporaryAvatarFile){

            const extension =

                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =

            "完成注册并进入聊天";

/* =========================================================
   私有 URL
========================================================= */

async function getPrivateImageUrl(
    bucket,
    path
){

    if(!path)
        return null;

    if(
        path.startsWith("http://") ||
        path.startsWith("https://")
    ){

        return path;
    }

    const cacheKey =
        bucket + ":" + path;

    if(imageUrlCache.has(cacheKey)){

        const cached =
            imageUrlCache.get(cacheKey);

        if(
            cached.expires >
            Date.now()
        ){

            return cached.url;
        }
    }

    const {data,error} =
        await supabaseClient.storage
            .from(bucket)
            .createSignedUrl(
                path,
                3600
            );

    if(error){

        console.error(
            "生成地址失败：",
            error
        );

        return null;
    }

    imageUrlCache.set(
        cacheKey,
        {
            url:data.signedUrl,
            expires:
                Date.now() + 3500000
        }
    );

    return data.signedUrl;
}

/* =========================================================
   加载历史消息
========================================================= */

async function loadMessages(){

    const {data,error} =
        await supabaseClient
            .from(MESSAGE_TABLE)
            .select(
                "id,user_id,nickname,message,created_at,image_url,audio_url"
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );

    if(error){

        console.error(
            "读取历史消息失败：",
            error
        );

        messages.innerHTML = "";

        const errorBox =
            document.createElement("div");

        errorBox.className =
            "empty";

        errorBox.textContent =
            "读取聊天记录失败：" +
            error.message;

        messages.appendChild(
            errorBox
        );

        return;
    }

    messages.innerHTML = "";

    if(!data || data.length === 0){

        showEmpty();

        return;
    }


    const {
        data:profiles,
        error:profileError
    } =
        await supabaseClient
            .from(PROFILE_TABLE)
            .select(
                "id,nickname,avatar_url"
            );

    if(profileError){

        console.error(
            "读取头像资料失败：",
            profileError
        );
    }


    const profileById =
        new Map();

    const profileByNickname =
        new Map();


    if(profiles){

        profiles.forEach(
            function(profile){

                if(profile.id){

                    profileById.set(
                        profile.id,
                        profile
                    );
                }

                if(
                    profile.nickname &&
                    !profileByNickname.has(
                        profile.nickname
                    )
                ){

                    profileByNickname.set(
                        profile.nickname,
                        profile
                    );
                }

            }
        );
    }


    for(
        const message of data
    ){

        await renderMessage(
            message,
            profileById,
            profileByNickname
        );
    }

    forceScrollToBottom();

    setTimeout(
        forceScrollToBottom,
        100
    );
}

    `;

    return(
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );
}


/* =========================================================
   显示消息
========================================================= */

async function renderMessage(
    message,
    profileById = null,
    profileByNickname = null
){

    hideEmpty();

    const row =
        document.createElement("div");

    row.className =
        "message";


    const isMine =
        currentUser &&
        (
            message.user_id ===
            currentUser.id
            ||
            (
                !message.user_id &&
                currentProfile &&
                message.nickname ===
                currentProfile.nickname
            )
        );

    if(isMine)
        row.classList.add("mine");


    let profile = null;


    if(
        message.user_id &&
        profileById
    ){

        profile =
            profileById.get(
                message.user_id
            ) || null;
    }


    if(
        !profile &&
        profileByNickname
    ){

        profile =
            profileByNickname.get(
                message.nickname
            ) || null;
    }


    if(
        isMine &&
        currentProfile
    ){

        profile =
            currentProfile;
    }


    /* 头像 */

    const avatar =
        document.createElement("img");

    avatar.className =
        "message-avatar";

    avatar.alt =
        "头像";

    if(
        profile &&
        profile.avatar_url
    ){

        const avatarUrl =
            await getPrivateImageUrl(
                AVATAR_BUCKET,
                profile.avatar_url
            );

        avatar.src =
            avatarUrl ||
            createDefaultAvatar(
                message.nickname
            );

    }else{

        avatar.src =
            createDefaultAvatar(
                message.nickname
            );
    }


    /* 主体 */

    const body =
        document.createElement("div");

    body.className =
        "message-body";


    /* 昵称 */

    const name =
        document.createElement("div");

    name.className =
        "nickname";

    name.textContent =
        message.nickname ||
        "匿名";


    /* 气泡 */

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    /* 图片 */

    if(message.image_url){

        bubble.classList.add(
            "image-bubble"
        );

        const img =
            document.createElement("img");

        img.className =
            "chat-image";

        const imageUrl =
            await getPrivateImageUrl(
                CHAT_IMAGE_BUCKET,
                message.image_url
            );

        if(imageUrl){

            img.src =
                imageUrl;

            img.alt =
                "聊天图片";

            img.loading =
                "lazy";

            img.onclick =
                function(){

                    openImageViewer(
                        imageUrl
                    );

                };

            bubble.appendChild(
                img
            );

            img.addEventListener(
                "load",
                forceScrollToBottom
            );

        }else{

            bubble.textContent =
                "[图片无法加载]";
        }


    /* 语音 */

    }else if(message.audio_url){

        bubble.classList.add(
            "audio-bubble"
        );

        const audio =
            document.createElement(
                "audio"
            );

        audio.className =
            "audio-player";

        audio.controls = true;

        const audioUrl =
            await getPrivateImageUrl(
                AUDIO_BUCKET,
                message.audio_url
            );

        if(audioUrl){

            audio.src =
                audioUrl;

            audio.preload =
                "metadata";

            bubble.appendChild(
                audio
            );

        }else{

            bubble.textContent =
                "[语音无法加载]";
        }


    /* 文字 */

    }else{

        bubble.textContent =
            message.message || "";
    }


    /* 时间 */

    const time =
        document.createElement("div");

    time.className =
        "time";

    time.textContent =
        formatTime(
            message.created_at
        );


    body.appendChild(name);

    body.appendChild(bubble);

    body.appendChild(time);

    row.appendChild(avatar);

    row.appendChild(body);

    messages.appendChild(row);
}


/* =========================================================
   时间
========================================================= */

function formatTime(value){

    if(!value)
        return "";

    const date =
        new Date(value);

    if(isNaN(date.getTime()))
        return "";

    return date.toLocaleString(
        "zh-CN",
        {
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

}


/* =========================================================
   判断手机
========================================================= */

function isMobileDevice(){

    return(
        /Android|iPhone|iPad|iPod/i
            .test(navigator.userAgent)
        ||
        window.innerWidth <= 600
    );
}


/* =========================================================
   限速
========================================================= */

function checkRateLimit(){

    const now =
        Date.now();

    sentMessageTimes =
        sentMessageTimes.filter(
            function(time){

                return(
                    now - time < 60000
                );

            }
        );

    if(
        sentMessageTimes.length >= 40
    ){

        return false;
    }

    sentMessageTimes.push(now);

    return true;
}


/* =========================================================
   发送文字
========================================================= */

async function sendMessage(){

    if(
        !currentUser ||
        !currentProfile
    ){

        openLoginPage();

        return;
    }

    const text =
        messageInput.value.trim();

    if(!text)
        return;

    if(text.length > 1500){

        alert(
            "一条消息最多 1500 个字符。"
        );

        return;
    }

    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;
    }

    sendButton.disabled = true;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:
                        text,

                    image_url:
                        null,

                    audio_url:
                        null

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url,audio_url"
                )
                .single();

        if(error)
            throw error;


        messageInput.value = "";

        updateComposerState();


        /*
         * 自己的消息直接显示。
         * Realtime 收到自己消息时会跳过，
         * 所以不会出现两遍。
         */

        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }

    }catch(error){

        console.error(
            "发送消息失败：",
            error
        );

        alert(
            "发送失败：\n" +
            error.message
        );

    }finally{

        sendButton.disabled = false;

        if(
            window.innerWidth > 600 &&
            !isMobileDevice()
        ){

            messageInput.focus();
        }
    }
}

/* =========================================================
   ★ 微信式按住说话
========================================================= */

function getSupportedAudioMimeType(){

    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/ogg"

    ];

    for(
        const type of types
    ){

        if(
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported(type)
        ){

            return type;
        }
    }

    return "";
}


/* =========================================================
   开始录音
========================================================= */

async function startRecording(){

    plusMenu.style.display =
        "none";

    emojiPicker.style.display =
        "none";

    if(mediaRecorder){

        return;
    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "你的浏览器不支持麦克风。"
        );

        return;
    }


    try{

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true

                });


        const mimeType =
            getSupportedAudioMimeType();


        if(mimeType){

            mediaRecorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType
                    }
                );

        }else{

            mediaRecorder =
                new MediaRecorder(
                    stream
                );
        }


        audioChunks = [];

        recordingCancelled = false;


        mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async function(){

                stream
                    .getTracks()
                    .forEach(
                        function(track){

                            track.stop();

                        }
                    );


                const actualType =
                    mediaRecorder.mimeType ||
                    mimeType ||
                    "audio/webm";


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:actualType
                        }
                    );


                const shouldSend =
                    !recordingCancelled;


                mediaRecorder = null;

                audioChunks = [];

                stopRecordingUI();


                if(
                    shouldSend &&
                    blob.size > 0
                ){

                    await uploadAudio(
                        blob,
                        actualType
                    );
                }

            };


        mediaRecorder.start();

        recordingStartTime =
            Date.now();

        showRecordingUI();

        updateRecordingTime();

        recordingTimer =
            setInterval(
                updateRecordingTime,
                500
            );


    }catch(error){

        console.error(error);

        mediaRecorder = null;

        alert(
            "无法使用麦克风：\n" +
            error.message
        );
    }
}

function showRecordingUI(){

    holdToTalkBar.style.display =
        "flex";

        "00:00";

function stopRecordingUI(){

    holdToTalkBar.style.display =
        "none";

    clearInterval(
        recordingTimer
    );

    recordingTimer = null;

function updateRecordingTime(){

    if(!recordingStartTime)
        return;

    const seconds =
        Math.floor(
            (
                Date.now() -
                recordingStartTime
            ) / 1000
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const remain =
        seconds % 60;

    document.getElementById(
        "holdTime"
    ).textContent =

        String(minutes)
            .padStart(2,"0") +

        ":" +

        String(remain)
            .padStart(2,"0");
}


/* =========================================================
   停止录音
========================================================= */

function stopRecording(){

    if(!mediaRecorder)
        return;

    if(
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }
}


/* =========================================================
   取消录音
========================================================= */

function cancelRecording(){

    if(!mediaRecorder)
        return;

    recordingCancelled = true;

    if(
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }
}

async function uploadAudio(

){

    if(
        !currentUser ||
        !currentProfile
    ){

        return;
    }

    if(!checkRateLimit()){

        alert(
            "发送太频繁了，请稍后再试。"
        );

        return;
    }


    if(
        blob.size >
        10 * 1024 * 1024
    ){

        alert(
            "语音文件不能超过 10MB。"
        );

        return;
    }


    try{

        /*
         * 根据真实录音格式决定扩展名。
         */

        let extension =
            "webm";

        let contentType =
            actualMimeType ||
            "audio/webm";


        if(
            contentType.includes(
                "ogg"
            )
        ){

            extension =
                "ogg";
        }


        /*
         * 这里绝不会主动写 audio/mp4。
         */

        const fileName =
            currentUser.id +
            "_" +
            Date.now() +
            "." +
            extension;


        const {
            error:uploadError
        } =
            await supabaseClient.storage
                .from(AUDIO_BUCKET)
                .upload(
                    fileName,
                    blob,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType
                    }
                );


        if(uploadError)
            throw uploadError;


        const {
            data,
            error
        } =
            await supabaseClient
                .from(MESSAGE_TABLE)
                .insert({

                    user_id:
                        currentUser.id,

                    nickname:
                        currentProfile.nickname,

                    message:"",

                    image_url:null,

                    audio_url:
                        fileName

                })
                .select(
                    "id,user_id,nickname,message,created_at,image_url,audio_url"
                )
                .single();


        if(error)
            throw error;


        if(data){

            await renderMessage(
                data,

                new Map([
                    [
                        currentUser.id,
                        currentProfile
                    ]
                ]),

                new Map([
                    [
                        currentProfile.nickname,
                        currentProfile
                    ]
                ])
            );

            forceScrollToBottom();
        }


    }catch(error){

        console.error(
            "语音发送失败：",
            error
        );

        alert(
            "语音发送失败：\n" +
            error.message
        );
    }
}


/* =========================================================
   Realtime
========================================================= */

function subscribeToMessages(){

    if(realtimeChannel){

        supabaseClient
            .removeChannel(
                realtimeChannel
            );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "messages-realtime"
            )
            .on(

                "postgres_changes",

                {
                    event:"INSERT",

                    schema:"public",

                    table:MESSAGE_TABLE
                },

                async function(payload){

                    /*
                     * 自己刚刚发送的消息已经在
                     * sendMessage/uploadAudio/uploadImage
                     * 中显示，因此这里跳过。
                     */

                    if(
                        currentUser &&
                        payload.new.user_id ===
                        currentUser.id
                    ){

                        return;
                    }


                    let profileMap =
                        new Map();

                    let nicknameMap =
                        new Map();


                    if(
                        payload.new.user_id
                    ){

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "id",
                                    payload.new.user_id
                                )
                                .maybeSingle();

                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }

                    }else{

                        const {data} =
                            await supabaseClient
                                .from(PROFILE_TABLE)
                                .select(
                                    "id,nickname,avatar_url"
                                )
                                .eq(
                                    "nickname",
                                    payload.new.nickname
                                )
                                .maybeSingle();

                        if(data){

                            profileMap.set(
                                data.id,
                                data
                            );

                            nicknameMap.set(
                                data.nickname,
                                data
                            );
                        }
                    }


                    await renderMessage(
                        payload.new,
                        profileMap,
                        nicknameMap
                    );

                    forceScrollToBottom();
                }

            )
            .subscribe(

                function(status){

                    console.log(
                        "Realtime:",
                        status
                    );

                }

            );
}


/* =========================================================
   退出
========================================================= */

async function logoutUser(){

    if(realtimeChannel){

        await supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }

    await supabaseClient.auth.signOut();
}


/* =========================================================
   图片查看器
========================================================= */

function openImageViewer(url){

    const viewer =
        document.getElementById(
            "imageViewer"
        );

    const viewerImage =
        document.getElementById(
            "viewerImage"
        );

    viewerImage.src = url;

    viewer.style.display =
        "flex";
}


function closeImageViewer(event){

    if(event)
        event.stopPropagation();

    const viewer =
        document.getElementById(
            "imageViewer"
        );

    const viewerImage =
        document.getElementById(
            "viewerImage"
        );

    viewer.style.display =
        "none";

    viewerImage.src =
        "";
}


/* =========================================================
   回车发送
========================================================= */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================================
   验证码只能数字
========================================================= */

document
    .getElementById("registerCode")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .replace(/\D/g,"")
                    .slice(0,8);

        }
    );


/* =========================================================
   手机键盘状态
========================================================= */

if(window.visualViewport){

    let lastHeight =
        window.visualViewport.height;

    window.visualViewport.addEventListener(
        "resize",
        function(){

            const height =
                window.visualViewport.height;

            if(
                height <
                lastHeight - 100
            ){

                document.body.classList.add(
                    "keyboard-open"
                );

            }

            if(
                height >
                lastHeight - 50
            ){

                document.body.classList.remove(
                    "keyboard-open"
                );
            }

            lastHeight = height;

        }
    );
}


/* =========================================================
   初始化 Emoji
========================================================= */

initializeEmojiPicker();


/* =========================================================
   启动
========================================================= */

initializeApp();

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(circle at top left, #283c86, transparent 40%),
                radial-gradient(circle at bottom right, #45a247, transparent 40%),
                #10131c;

            min-height: 100vh;
            color: white;
        }

        button,
        input {
            font: inherit;
        }

        /* =========================
           首页
        ========================= */

        #homePage {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .home-card {
            width: 100%;
            max-width: 500px;

            padding: 50px 35px;

            text-align: center;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 24px;

            font-size: 38px;

            background:
                linear-gradient(135deg, #667eea, #764ba2);

            box-shadow:
                0 15px 35px rgba(118, 75, 162, 0.4);
        }

        .home-card h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .home-card p {
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .primary-button {
            width: 100%;

            border: none;
            border-radius: 15px;

            padding: 16px 20px;

            color: white;
            font-weight: 700;
            font-size: 16px;

            cursor: pointer;

            background:
                linear-gradient(135deg, #667eea, #764ba2);

            box-shadow:
                0 10px 25px rgba(118, 75, 162, 0.35);

            transition: 0.2s;
        }

        .primary-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 15px 30px rgba(118, 75, 162, 0.5);
        }

        /* =========================
           聊天页面
        ========================= */

        #chatPage {
            display: none;

            height: 100vh;

            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;

            height: calc(100vh - 40px);

            margin: auto;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border-radius: 24px;

            background: rgba(15, 18, 28, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.4);
        }

        .chat-header {
            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 22px;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-icon {
            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 14px;

            background:
                linear-gradient(135deg, #667eea, #764ba2);
        }

        .chat-title h2 {
            font-size: 18px;
        }

        .status {
            font-size: 12px;
            color: #7ee787;

            margin-top: 3px;
        }

        .back-button {
            border: none;

            padding: 9px 13px;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);
            color: white;

            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 消息区域 */

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 25px;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.mine {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
        }

        .nickname {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);

            margin-bottom: 5px;
        }

        .mine .nickname {
            text-align: right;
        }

        .bubble {
            padding: 11px 15px;

            border-radius: 17px;

            background: rgba(255, 255, 255, 0.10);

            word-break: break-word;

            line-height: 1.5;
        }

        .mine .bubble {
            background:
                linear-gradient(135deg, #667eea, #764ba2);
        }

        .time {
            font-size: 10px;

            margin-top: 5px;

            color: rgba(255, 255, 255, 0.35);
        }

        .mine .time {
            text-align: right;
        }

        .empty {
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: rgba(255, 255, 255, 0.35);

            text-align: center;
        }

        /* 输入区域 */

        .input-area {
            display: flex;
            gap: 10px;

            padding: 15px;

            border-top:
                1px solid rgba(255, 255, 255, 0.08);
        }

        #messageInput {
            flex: 1;

            min-width: 0;

            border: 1px solid rgba(255, 255, 255, 0.1);

            outline: none;

            padding: 13px 15px;

            border-radius: 14px;

            color: white;

            background: rgba(255, 255, 255, 0.07);
        }

        #messageInput::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        #sendButton {
            width: 90px;

            border: none;
            border-radius: 14px;

            color: white;
            font-weight: 700;

            background:
                linear-gradient(135deg, #667eea, #764ba2);

            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           昵称弹窗
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background: rgba(0, 0, 0, 0.65);

            z-index: 100;
        }

        .modal-card {
            width: 100%;
            max-width: 400px;

            padding: 30px;

            border-radius: 22px;

            background: #181c28;

            border:
                1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-card h2 {
            margin-bottom: 10px;
        }

        .modal-card p {
            color: rgba(255, 255, 255, 0.55);

            font-size: 14px;

            margin-bottom: 20px;
        }

        #nicknameInput {
            width: 100%;

            padding: 14px;

            border-radius: 13px;

            border:
                1px solid rgba(255, 255, 255, 0.1);

            outline: none;

            background: rgba(255, 255, 255, 0.07);

            color: white;

            margin-bottom: 15px;
        }

        #nicknameInput::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        /* =========================
           手机适配
        ========================= */

        @media (max-width: 600px) {

            #chatPage {
                padding: 0;
            }

            .chat-container {
                height: 100vh;

                border-radius: 0;
            }

            .home-card {
                padding: 40px 25px;
            }

            .home-card h1 {
                font-size: 34px;
            }

            #messages {
                padding: 18px;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-header {
                padding: 12px 15px;
            }

            #sendButton {
                width: 70px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     首页
========================= -->

<section id="homePage">

    <div class="home-card">

        <div class="logo">
            💬
        </div>

        <h1>My Chat</h1>

        <p>
            一个属于你和朋友的私人聊天室。
            <br>
            现在免费开始，未来慢慢升级。
        </p>

        <button
            class="primary-button"
            onclick="openNicknameModal()">
            进入多人聊天室
        </button>

    </div>

</section>


<!-- =========================
     聊天页面
========================= -->

<section id="chatPage">

    <div class="chat-container">

        <header class="chat-header">

            <div class="chat-title">

                <div class="chat-icon">
                    💬
                </div>

                <div>

                    <h2>多人聊天室</h2>

                    <div class="status">
                        ● 实时连接
                    </div>

                </div>

            </div>

            <button
                class="back-button"
                onclick="backHome()">
                返回
            </button>

        </header>


        <main id="messages">

            <div class="empty" id="emptyMessage">
                暂时还没有消息<br>
                成为第一个发言的人吧！
            </div>

        </main>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                maxlength="1000"
                placeholder="输入消息..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="sendMessage()">
                发送
            </button>

        </div>

    </div>

</section>


<!-- =========================
     昵称弹窗
========================= -->

<div class="modal" id="nicknameModal">

    <div class="modal-card">

        <h2>进入聊天室</h2>

        <p>
            输入一个昵称，你不需要注册账号。
        </p>

        <input
            id="nicknameInput"
            type="text"
            maxlength="30"
            placeholder="例如：Justin"
            autocomplete="off"
        >

        <button
            class="primary-button"
            onclick="enterChat()">
            进入聊天室
        </button>

    </div>

</div>


<script>

    /* ==================================================
       Supabase 配置
    ================================================== */

    const SUPABASE_URL =
        "https://fhkqnknpmdddiehpktnu.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_3p3PR-D3GUy5BRhQDl57AA__4Gbg388";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==================================================
       当前用户
    ================================================== */

    let currentNickname = "";


    /* ==================================================
       DOM
    ================================================== */

    const homePage =
        document.getElementById("homePage");

    const chatPage =
        document.getElementById("chatPage");

    const nicknameModal =
        document.getElementById("nicknameModal");

    const nicknameInput =
        document.getElementById("nicknameInput");

    const messageInput =
        document.getElementById("messageInput");

    const messages =
        document.getElementById("messages");

    const sendButton =
        document.getElementById("sendButton");

    const emptyMessage =
        document.getElementById("emptyMessage");


    /* ==================================================
       打开昵称窗口
    ================================================== */

    function openNicknameModal() {

        nicknameModal.style.display = "flex";

        setTimeout(() => {
            nicknameInput.focus();
        }, 100);

    }


    /* ==================================================
       进入聊天室
    ================================================== */

    async function enterChat() {

        const nickname =
            nicknameInput.value.trim();

        if (!nickname) {

            alert("请输入昵称");

            nicknameInput.focus();

            return;
        }


        currentNickname = nickname;


        nicknameModal.style.display = "none";

        homePage.style.display = "none";

        chatPage.style.display = "block";


        await loadMessages();

        subscribeToMessages();

        messageInput.focus();

    }


    /* ==================================================
       返回首页
    ================================================== */

    function backHome() {

        chatPage.style.display = "none";

        homePage.style.display = "flex";

    }


    /* ==================================================
       加载历史消息
    ================================================== */

    async function loadMessages() {

        const {
            data,
            error
        } = await supabaseClient

            .from("messages")

            .select("*")

            .order("created_at", {
                ascending: true
            })

            .limit(100);


        if (error) {

            console.error(error);

            alert(
                "读取消息失败，请检查 Supabase 设置。"
            );

            return;
        }


        messages.innerHTML = "";


        if (!data || data.length === 0) {

            messages.innerHTML = `
                <div class="empty" id="emptyMessage">
                    暂时还没有消息<br>
                    成为第一个发言的人吧！
                </div>
            `;

            return;
        }


        data.forEach(message => {

            renderMessage(message);

        });


        scrollToBottom();

    }


    /* ==================================================
       显示消息
    ================================================== */

    function renderMessage(message) {

        const isMine =
            message.nickname === currentNickname;


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message" +
            (isMine ? " mine" : "");


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const nickname =
            document.createElement("div");

        nickname.className =
            "nickname";

        nickname.textContent =
            message.nickname;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.textContent =
            message.message;


        const time =
            document.createElement("div");

        time.className =
            "time";

        time.textContent =
            formatTime(message.created_at);


        content.appendChild(nickname);

        content.appendChild(bubble);

        content.appendChild(time);

        wrapper.appendChild(content);

        messages.appendChild(wrapper);


        const empty =
            document.getElementById("emptyMessage");

        if (empty) {
            empty.remove();
        }

    }


    /* ==================================================
       发送消息
    ================================================== */

    async function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        if (!currentNickname) {
            return;
        }


        sendButton.disabled = true;


        const {
            error
        } = await supabaseClient

            .from("messages")

            .insert({

                nickname:
                    currentNickname,

                message:
                    text

            });


        if (error) {

            console.error(error);

            alert(
                "发送失败，请检查 Supabase 设置。"
            );

        } else {

            messageInput.value = "";

            messageInput.focus();

        }


        sendButton.disabled = false;

    }


    /* ==================================================
       实时监听新消息
    ================================================== */

    function subscribeToMessages() {

        supabaseClient

            .channel("messages-room")

            .on(

                "postgres_changes",

                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },

                payload => {

                    renderMessage(
                        payload.new
                    );

                    scrollToBottom();

                }

            )

            .subscribe();

    }


    /* ==================================================
       滚动到底部
    ================================================== */

    function scrollToBottom() {

        messages.scrollTop =
            messages.scrollHeight;

    }


    /* ==================================================
       时间格式
    ================================================== */

    function formatTime(dateString) {

        const date =
            new Date(dateString);

        return date.toLocaleTimeString(
            "zh-CN",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* ==================================================
       Enter 发送消息
    ================================================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ==================================================
       Enter 输入昵称
    ================================================== */

    nicknameInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                enterChat();

            }

        }
    );

</script>

</body>
</html>
